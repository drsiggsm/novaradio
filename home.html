<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at 50% 0,#211b50,#07091a 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(1000px,92vw);
  margin:auto;
  padding:30px 0 80px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:70px;
}

.logo{
  font-size:34px;
  font-weight:800;
}

.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.account{
  padding:10px 14px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#ddd;
  font-size:13px;
}

.settings{
  width:44px;
  height:44px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#fff;
  font-size:21px;
  cursor:pointer;
}

.hero{
  text-align:center;
  margin-bottom:38px;
}

.hero h1{
  font-size:44px;
  margin:0 0 10px;
}

.hero p{
  color:#aeb0c8;
  margin:0;
  font-size:17px;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
}

.field{
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:9px;
}

select{
  width:100%;
  padding:17px;
  border-radius:15px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

.now{
  margin-top:32px;
  padding:25px;
  border-radius:22px;
  background:#080b1d;
  border:1px solid #30355e;
  text-align:center;
}

.now-label{
  color:#9da2c0;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.now-title{
  font-size:26px;
  font-weight:800;
  margin-bottom:6px;
}

.now-artist{
  color:#aeb0c8;
}

.player{
  margin-top:20px;
  width:100%;
}

.empty{
  text-align:center;
  color:#8f93ad;
  padding:28px 10px;
}

.menu{
  display:none;
  position:absolute;
  right:4vw;
  top:88px;
  width:250px;
  background:#101228;
  border:1px solid #30355e;
  border-radius:20px;
  padding:10px;
  z-index:10;
  box-shadow:0 20px 60px #0008;
}

.menu.show{
  display:block;
}

.menu a,
.menu button{
  display:block;
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#fff;
  text-align:left;
  text-decoration:none;
  font-size:15px;
  cursor:pointer;
}

.menu a:hover,
.menu button:hover{
  background:#1c2040;
}

@media(max-width:600px){
  .hero h1{font-size:34px}
  .logo{font-size:28px}
  .account{display:none}
}
</style>
</head>

<body>

<main class="wrap">

<header>

  <div class="logo">NovaRadio</div>

  <div class="header-right">
    <div class="account" id="account">確認中...</div>

    <button class="settings" id="settings" type="button">
      ⚙️
    </button>
  </div>

</header>

<div class="menu" id="menu">

  <a href="dashboard.html">
    🎵 曲をアップロード・管理
  </a>

  <button id="logout">
    🚪 ログアウト
  </button>

</div>

<section class="hero">

  <h1>🎧 今日は何を聴く？</h1>

  <p>
    ジャンルと気分を選ぶだけ。<br>
    あとはNovaRadioにおまかせ。
  </p>

</section>

<section class="card">

  <div class="field">

    <label for="genre">
      🎵 ジャンル
    </label>

    <select id="genre">

      <option value="">ジャンルを選択</option>

      <option value="Hip Hop">
        Hip Hop
      </option>

      <option value="R&B">
        R&B
      </option>

      <option value="Pop">
        Pop
      </option>

      <option value="Trap">
        Trap
      </option>

      <option value="Rock">
        Rock
      </option>

      <option value="Lo-Fi">
        Lo-Fi
      </option>

      <option value="Electronic">
        Electronic
      </option>

    </select>

  </div>


  <div class="field">

    <label for="mood">
      🌙 Mood
    </label>

    <select id="mood">

      <option value="">
        Moodを選択
      </option>

      <option value="Chill">
        Chill
      </option>

      <option value="Dark">
        Dark
      </option>

      <option value="Happy">
        Happy
      </option>

      <option value="Emotional">
        Emotional
      </option>

      <option value="Energetic">
        Energetic
      </option>

    </select>

  </div>


  <div class="now" id="now">

    <div class="now-label">
      NOVARADIO
    </div>

    <div class="empty">
      ジャンルとMoodを選ぶと<br>
      NovaRadioが曲を選びます 🎧
    </div>

  </div>

</section>

</main>


<script>

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function checkLogin(){

  const {
    data:{session}
  } = await sb.auth.getSession();

  if(!session){

    location.href="index.html";

    return;
  }

  document.getElementById("account").textContent =
    session.user.email;

}


checkLogin();


const genre =
  document.getElementById("genre");

const mood =
  document.getElementById("mood");

const now =
  document.getElementById("now");


function updateRadio(){

  const selectedGenre =
    genre.value;

  const selectedMood =
    mood.value;


  if(!selectedGenre && !selectedMood){

    now.innerHTML = `
      <div class="now-label">
        NOVARADIO
      </div>

      <div class="empty">
        ジャンルとMoodを選ぶと<br>
        NovaRadioが曲を選びます 🎧
      </div>
    `;

    return;
  }


  now.innerHTML = `

    <div class="now-label">
      NOW PLAYING
    </div>

    <div class="now-title">
      曲を探しています…
    </div>

    <div class="now-artist">
      ${selectedGenre || "All"} ·
      ${selectedMood || "All"}
    </div>

    <div class="empty">
      🎧 音源を読み込んでいます…
    </div>

  `;


  /*
    ここに次のステップで

    Supabaseから条件に合う曲を取得
    ↓
    音源URLを取得
    ↓
    audio.play()

    を追加する。
  */

}


genre.addEventListener(
  "change",
  updateRadio
);

mood.addEventListener(
  "change",
  updateRadio
);


const settings =
  document.getElementById("settings");

const menu =
  document.getElementById("menu");


settings.addEventListener(
  "click",
  ()=>{
    menu.classList.toggle("show");
  }
);


document.getElementById("logout")
.addEventListener(
  "click",
  async ()=>{

    await sb.auth.signOut();

    location.href="index.html";

  }
);

</script>

</body>
</html>
