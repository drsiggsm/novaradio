<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at 50% 0,#211b50,#07091a 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(1000px,92vw);
  margin:auto;
  padding:30px 0 80px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:60px;
}

.logo{
  font-size:34px;
  font-weight:800;
}

.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.account{
  padding:10px 14px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#ddd;
  font-size:13px;
}

.settings{
  width:44px;
  height:44px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#fff;
  font-size:21px;
  cursor:pointer;
}

.hero{
  text-align:center;
  margin-bottom:38px;
}

.hero h1{
  font-size:44px;
  margin:0 0 10px;
}

.hero p{
  color:#aeb0c8;
  margin:0;
  font-size:17px;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
  margin-bottom:25px;
}

.field{
  margin-bottom:30px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:13px;
  font-size:18px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.option{
  padding:12px 18px;
  border-radius:999px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#bfc2d8;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
}

.option:hover{
  border-color:#7b25ff;
  color:#fff;
}

.option.selected{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border-color:transparent;
  color:#fff;
  box-shadow:0 5px 20px #6425ff55;
}

.conditions{
  margin-top:8px;
  padding:16px 18px;
  border-radius:16px;
  background:#080b1d;
  border:1px solid #30355e;
  color:#aeb0c8;
  font-size:14px;
  line-height:1.7;
}

.conditions strong{
  color:#fff;
}

.play{
  width:100%;
  margin-top:25px;
  padding:19px;
  border:0;
  border-radius:18px;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  color:#fff;
  font-size:19px;
  font-weight:800;
  cursor:pointer;
}

.play:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.artist-search{
  display:flex;
  gap:10px;
}

.artist-search input{
  flex:1;
  min-width:0;
  padding:16px;
  border-radius:15px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

.artist-search button{
  padding:0 22px;
  border:0;
  border-radius:15px;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.artist-results{
  margin-top:20px;
}

.artist-result{
  padding:18px;
  border-radius:17px;
  background:#080b1d;
  border:1px solid #30355e;
  margin-top:10px;
  cursor:pointer;
}

.artist-result:hover{
  border-color:#7b25ff;
}

.artist-name{
  font-size:19px;
  font-weight:800;
}

.artist-meta{
  margin-top:5px;
  color:#9da2c0;
  font-size:13px;
}

.now{
  margin-top:30px;
  padding:28px;
  border-radius:22px;
  background:#080b1d;
  border:1px solid #30355e;
  text-align:center;
}

.now-label{
  color:#9da2c0;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.now-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:7px;
}

.now-artist{
  color:#aeb0c8;
}

.empty{
  text-align:center;
  color:#8f93ad;
  padding:25px 10px;
}

.menu{
  display:none;
  position:absolute;
  right:4vw;
  top:88px;
  width:250px;
  background:#101228;
  border:1px solid #30355e;
  border-radius:20px;
  padding:10px;
  z-index:10;
  box-shadow:0 20px 60px #0008;
}

.menu.show{
  display:block;
}

.menu a,
.menu button{
  display:block;
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#fff;
  text-align:left;
  text-decoration:none;
  font-size:15px;
  cursor:pointer;
}

.menu a:hover,
.menu button:hover{
  background:#1c2040;
}

audio{
  width:100%;
  margin-top:22px;
}

@media(max-width:600px){
  .hero h1{
    font-size:34px;
  }

  .logo{
    font-size:28px;
  }

  .account{
    display:none;
  }

  .artist-search{
    flex-direction:column;
  }

  .artist-search button{
    padding:16px;
  }
}
</style>
</head>

<body>

<main class="wrap">

<header>

  <div class="logo">NovaRadio</div>

  <div class="header-right">

    <div class="account" id="account">
      確認中...
    </div>

    <button class="settings" id="settings" type="button">
      ⚙️
    </button>

  </div>

</header>


<div class="menu" id="menu">

  <a href="dashboard.html">
    🎵 曲をアップロード・管理
  </a>

  <button id="logout">
    🚪 ログアウト
  </button>

</div>


<section class="hero">

  <h1>🎧 今日は何を聴く？</h1>

  <p>
    ジャンルと気分を選んで、<br>
    あとはNovaRadioにおまかせ。
  </p>

</section>


<!-- ジャンル・Mood -->

<section class="card">

  <div class="field">

    <label>🎵 ジャンル</label>

    <div class="options" id="genreOptions">

      <button class="option" data-value="Hip Hop">Hip Hop</button>
      <button class="option" data-value="R&B">R&B</button>
      <button class="option" data-value="Pop">Pop</button>
      <button class="option" data-value="Trap">Trap</button>
      <button class="option" data-value="Rock">Rock</button>
      <button class="option" data-value="Lo-Fi">Lo-Fi</button>
      <button class="option" data-value="Electronic">Electronic</button>

    </div>

  </div>


  <div class="field">

    <label>🌙 Mood</label>

    <div class="options" id="moodOptions">

      <button class="option" data-value="Chill">Chill</button>
      <button class="option" data-value="Dark">Dark</button>
      <button class="option" data-value="Happy">Happy</button>
      <button class="option" data-value="Emotional">Emotional</button>
      <button class="option" data-value="Energetic">Energetic</button>

    </div>

  </div>


  <div class="conditions" id="conditions">
    <strong>選択中：</strong>
    まだ条件が選択されていません
  </div>


  <button class="play" id="play" disabled>
    ▶️ この条件で再生
  </button>


  <div class="now" id="now">

    <div class="now-label">
      NOVARADIO
    </div>

    <div class="empty">
      ジャンルとMoodを選んで<br>
      「この条件で再生」を押してね 🎧
    </div>

  </div>

</section>


<!-- アーティスト検索 -->

<section class="card">

  <div class="field">

    <label>🔎 アーティストを探す</label>

    <div class="artist-search">

      <input
        id="artistSearch"
        type="text"
        placeholder="アーティスト名を入力"
      >

      <button id="artistSearchButton">
        探す
      </button>

    </div>

  </div>


  <div class="artist-results" id="artistResults">

    <div class="empty">
      アーティスト名を入力して探してみよう。
    </div>

  </div>

</section>

</main>


<script>

/* ========================================
   SUPABASE
======================================== */

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ========================================
   LOGIN
======================================== */

async function checkLogin(){

  const {
    data:{session}
  } = await sb.auth.getSession();

  if(!session){
    location.href="index.html";
    return;
  }

  document.getElementById("account").textContent =
    session.user.email;
}

checkLogin();


/* ========================================
   GENRE / MOOD
======================================== */

const selectedGenres = [];
const selectedMoods = [];


function updateConditions(){

  const genreText =
    selectedGenres.length
      ? selectedGenres.join(" / ")
      : "指定なし";

  const moodText =
    selectedMoods.length
      ? selectedMoods.join(" / ")
      : "指定なし";

  document.getElementById("conditions").innerHTML = `
    <strong>選択中：</strong>
    ${genreText} × ${moodText}
  `;

  document.getElementById("play").disabled =
    !selectedGenres.length &&
    !selectedMoods.length;
}


document
.querySelectorAll("#genreOptions .option")
.forEach(button => {

  button.addEventListener("click", () => {

    const value = button.dataset.value;

    const index =
      selectedGenres.indexOf(value);

    if(index === -1){

      selectedGenres.push(value);
      button.classList.add("selected");

    }else{

      selectedGenres.splice(index,1);
      button.classList.remove("selected");

    }

    updateConditions();

  });

});


document
.querySelectorAll("#moodOptions .option")
.forEach(button => {

  button.addEventListener("click", () => {

    const value = button.dataset.value;

    const index =
      selectedMoods.indexOf(value);

    if(index === -1){

      selectedMoods.push(value);
      button.classList.add("selected");

    }else{

      selectedMoods.splice(index,1);
      button.classList.remove("selected");

    }

    updateConditions();

  });

});


/* ========================================
   SONG PLAYER
======================================== */

function playSong(song){

  const now =
    document.getElementById("now");

  if(!song.audio_url){

    now.innerHTML = `
      <div class="now-label">
        ERROR
      </div>

      <div class="empty">
        この曲にはaudio_urlが登録されていません。
      </div>
    `;

    return;
  }


  now.innerHTML = `

    <div class="now-label">
      NOW PLAYING
    </div>

    <div class="now-title">
      ${song.title || "Untitled"}
    </div>

    <div class="now-artist">
      ${song.artist || "Unknown Artist"}
    </div>

    <div class="artist-meta" style="margin-top:8px;">
      ${song.genre || ""}
      ${song.mood ? " · " + song.mood : ""}
    </div>

    <audio
      id="audioPlayer"
      controls
      autoplay
      preload="metadata"
    >
      <source
        src="${song.audio_url}"
        type="audio/wav"
      >
      このブラウザでは音源を再生できません。
    </audio>

  `;


  const audio =
    document.getElementById("audioPlayer");

  audio.play().catch(error => {
    console.log(
      "再生開始エラー:",
      error
    );
  });

}


/* ========================================
   条件から曲を探す
======================================== */

document
.getElementById("play")
.addEventListener("click", async () => {

  const now =
    document.getElementById("now");


  now.innerHTML = `

    <div class="now-label">
      NOVARADIO
    </div>

    <div class="empty">
      曲を選んでいます… 🎧
    </div>

  `;


  const {
    data,
    error
  } = await sb
    .from("songs")
    .select("*");


  if(error){

    console.error(
      "Supabase error:",
      error
    );

    now.innerHTML = `

      <div class="now-label">
        ERROR
      </div>

      <div class="empty">
        曲の取得に失敗しました。<br><br>
        ${error.message}
      </div>

    `;

    return;
  }


  let songs =
    data || [];


  /* Genre */

  if(selectedGenres.length){

    songs =
      songs.filter(song =>
        selectedGenres.includes(song.genre)
      );

  }


  /* Mood */

  if(selectedMoods.length){

    songs =
      songs.filter(song =>
        selectedMoods.includes(song.mood)
      );

  }


  if(!songs.length){

    now.innerHTML = `

      <div class="now-label">
        NOVARADIO
      </div>

      <div class="empty">
        この条件に合う曲は<br>
        まだありません 🎧
      </div>

    `;

    return;
  }


  /* ランダム */

  const randomSong =
    songs[
      Math.floor(
        Math.random() *
        songs.length
      )
    ];


  playSong(randomSong);

});


/* ========================================
   ARTIST SEARCH
======================================== */

document
.getElementById("artistSearchButton")
.addEventListener(
  "click",
  searchArtist
);


document
.getElementById("artistSearch")
.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      searchArtist();
    }

  }
);


async function searchArtist(){

  const query =
    document
    .getElementById("artistSearch")
    .value
    .trim();


  const results =
    document
    .getElementById("artistResults");


  if(!query){

    results.innerHTML = `

      <div class="empty">
        アーティスト名を入力してください。
      </div>

    `;

    return;
  }


  results.innerHTML = `

    <div class="empty">
      「${query}」を探しています…
    </div>

  `;


  const {
    data,
    error
  } = await sb
    .from("songs")
    .select("*")
    .ilike(
      "artist",
      `%${query}%`
    );


  if(error){

    console.error(
      "Artist search error:",
      error
    );

    results.innerHTML = `

      <div class="empty">
        検索に失敗しました。<br><br>
        ${error.message}
      </div>

    `;

    return;
  }


  if(!data || !data.length){

    results.innerHTML = `

      <div class="empty">
        「${query}」の曲は<br>
        見つかりませんでした。
      </div>

    `;

    return;
  }


  results.innerHTML = "";


  data.forEach(song => {

    const item =
      document.createElement("div");


    item.className =
      "artist-result";


    item.innerHTML = `

      <div class="artist-name">
        ${song.title || "Untitled"}
      </div>

      <div class="artist-meta">

        ${song.artist || "Unknown Artist"}

        ${song.genre
          ? " · " + song.genre
          : ""
        }

        ${song.mood
          ? " · " + song.mood
          : ""
        }

      </div>

      <div
        style="
          margin-top:12px;
          font-weight:700;
        "
      >
        ▶️ この曲を再生
      </div>

    `;


    item.addEventListener(
      "click",
      () => {

        playSong(song);

        document
        .getElementById("now")
        .scrollIntoView({
          behavior:"smooth",
          block:"center"
        });

      }
    );


    results.appendChild(item);

  });

}


/* ========================================
   SETTINGS MENU
======================================== */

document
.getElementById("settings")
.addEventListener(
  "click",
  () => {

    document
    .getElementById("menu")
    .classList.toggle("show");

  }
);


/* ========================================
   LOGOUT
======================================== */

document
.getElementById("logout")
.addEventListener(
  "click",
  async () => {

    await sb.auth.signOut();

    location.href="index.html";

  }
);

</script>

</body>
</html>
