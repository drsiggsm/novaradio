<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at 50% 0,#211b50,#07091a 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(1000px,92vw);
  margin:auto;
  padding:30px 0 80px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:70px;
}

.logo{
  font-size:34px;
  font-weight:800;
}

.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.account{
  padding:10px 14px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#ddd;
  font-size:13px;
}

.settings{
  width:44px;
  height:44px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#fff;
  font-size:21px;
  cursor:pointer;
}

.hero{
  text-align:center;
  margin-bottom:38px;
}

.hero h1{
  font-size:44px;
  margin:0 0 10px;
}

.hero p{
  color:#aeb0c8;
  margin:0;
  font-size:17px;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
}

.field{
  margin-bottom:30px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:13px;
  font-size:18px;
}

/* 選択ボタン */
.options{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.option{
  padding:12px 18px;
  border-radius:999px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#bfc2d8;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
}

.option:hover{
  border-color:#7b25ff;
  color:#fff;
}

.option.selected{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border-color:transparent;
  color:#fff;
  box-shadow:0 5px 20px #6425ff55;
}

/* 選択条件 */
.conditions{
  margin-top:8px;
  padding:16px 18px;
  border-radius:16px;
  background:#080b1d;
  border:1px solid #30355e;
  color:#aeb0c8;
  font-size:14px;
  line-height:1.7;
}

.conditions strong{
  color:#fff;
}

/* 再生ボタン */
.play{
  width:100%;
  margin-top:25px;
  padding:19px;
  border:0;
  border-radius:18px;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  color:#fff;
  font-size:19px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

.play:hover{
  opacity:.9;
  transform:translateY(-1px);
}

.play:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

/* Now Playing */
.now{
  margin-top:30px;
  padding:28px;
  border-radius:22px;
  background:#080b1d;
  border:1px solid #30355e;
  text-align:center;
}

.now-label{
  color:#9da2c0;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.now-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:7px;
}

.now-artist{
  color:#aeb0c8;
}

.empty{
  text-align:center;
  color:#8f93ad;
  padding:25px 10px;
}

.menu{
  display:none;
  position:absolute;
  right:4vw;
  top:88px;
  width:250px;
  background:#101228;
  border:1px solid #30355e;
  border-radius:20px;
  padding:10px;
  z-index:10;
  box-shadow:0 20px 60px #0008;
}

.menu.show{
  display:block;
}

.menu a,
.menu button{
  display:block;
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#fff;
  text-align:left;
  text-decoration:none;
  font-size:15px;
  cursor:pointer;
}

.menu a:hover,
.menu button:hover{
  background:#1c2040;
}

@media(max-width:600px){
  .hero h1{font-size:34px}
  .logo{font-size:28px}
  .account{display:none}
}
</style>
</head>

<body>

<main class="wrap">

<header>

  <div class="logo">NovaRadio</div>

  <div class="header-right">

    <div class="account" id="account">
      確認中...
    </div>

    <button class="settings" id="settings" type="button">
      ⚙️
    </button>

  </div>

</header>

<div class="menu" id="menu">

  <a href="dashboard.html">
    🎵 曲をアップロード・管理
  </a>

  <button id="logout">
    🚪 ログアウト
  </button>

</div>


<section class="hero">

  <h1>🎧 今日は何を聴く？</h1>

  <p>
    ジャンルと気分を選んで、<br>
    あとはNovaRadioにおまかせ。
  </p>

</section>


<section class="card">

  <!-- ジャンル -->

  <div class="field">

    <label>🎵 ジャンル</label>

    <div class="options" id="genreOptions">

      <button class="option" data-value="Hip Hop">
        Hip Hop
      </button>

      <button class="option" data-value="R&B">
        R&B
      </button>

      <button class="option" data-value="Pop">
        Pop
      </button>

      <button class="option" data-value="Trap">
        Trap
      </button>

      <button class="option" data-value="Rock">
        Rock
      </button>

      <button class="option" data-value="Lo-Fi">
        Lo-Fi
      </button>

      <button class="option" data-value="Electronic">
        Electronic
      </button>

    </div>

  </div>


  <!-- Mood -->

  <div class="field">

    <label>🌙 Mood</label>

    <div class="options" id="moodOptions">

      <button class="option" data-value="Chill">
        Chill
      </button>

      <button class="option" data-value="Dark">
        Dark
      </button>

      <button class="option" data-value="Happy">
        Happy
      </button>

      <button class="option" data-value="Emotional">
        Emotional
      </button>

      <button class="option" data-value="Energetic">
        Energetic
      </button>

    </div>

  </div>


  <!-- 選択条件 -->

  <div class="conditions" id="conditions">
    <strong>選択中：</strong>
    まだ条件が選択されていません
  </div>


  <!-- 再生ボタン -->

  <button class="play" id="play" disabled>
    ▶️ この条件で再生
  </button>


  <!-- Now Playing -->

  <div class="now" id="now">

    <div class="now-label">
      NOVARADIO
    </div>

    <div class="empty">
      ジャンルとMoodを選んで<br>
      「この条件で再生」を押してね 🎧
    </div>

  </div>

</section>

</main>


<script>

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ログイン確認 */

async function checkLogin(){

  const {
    data:{session}
  } = await sb.auth.getSession();

  if(!session){

    location.href="index.html";

    return;
  }

  document.getElementById("account").textContent =
    session.user.email;

}

checkLogin();


/* 選択状態 */

const selectedGenres = [];

const selectedMoods = [];


/* 条件表示 */

function updateConditions(){

  const conditions =
    document.getElementById("conditions");

  const play =
    document.getElementById("play");


  const genreText =
    selectedGenres.length
      ? selectedGenres.join(" / ")
      : "指定なし";


  const moodText =
    selectedMoods.length
      ? selectedMoods.join(" / ")
      : "指定なし";


  conditions.innerHTML = `
    <strong>選択中：</strong>
    ${genreText}
    ×
    ${moodText}
  `;


  if(
    selectedGenres.length ||
    selectedMoods.length
  ){

    play.disabled = false;

  }else{

    play.disabled = true;

  }

}


/* ジャンル選択 */

document
  .querySelectorAll("#genreOptions .option")
  .forEach(button => {

    button.addEventListener(
      "click",
      ()=>{

        const value =
          button.dataset.value;

        const index =
          selectedGenres.indexOf(value);


        if(index === -1){

          selectedGenres.push(value);

          button.classList.add("selected");

        }else{

          selectedGenres.splice(index,1);

          button.classList.remove("selected");

        }


        updateConditions();

      }
    );

  });


/* Mood選択 */

document
  .querySelectorAll("#moodOptions .option")
  .forEach(button => {

    button.addEventListener(
      "click",
      ()=>{

        const value =
          button.dataset.value;

        const index =
          selectedMoods.indexOf(value);


        if(index === -1){

          selectedMoods.push(value);

          button.classList.add("selected");

        }else{

          selectedMoods.splice(index,1);

          button.classList.remove("selected");

        }


        updateConditions();

      }
    );

  });


/* 再生 */

document
  .getElementById("play")
  .addEventListener(
    "click",
    ()=>{

      const now =
        document.getElementById("now");


      const genreText =
        selectedGenres.length
          ? selectedGenres.join(" / ")
          : "すべて";


      const moodText =
        selectedMoods.length
          ? selectedMoods.join(" / ")
          : "すべて";


      now.innerHTML = `

        <div class="now-label">
          NOW PLAYING
        </div>

        <div class="now-title">
          曲を探しています…
        </div>

        <div class="now-artist">
          ${genreText}
          ·
          ${moodText}
        </div>

        <div class="empty">
          🎧 音源を読み込んでいます…
        </div>

      `;


      /*
        次のステップでここに

        Supabaseから曲を取得
        ↓
        音源URLを取得
        ↓
        audio.play()

        を追加する。
      */

    }
  );


/* 設定メニュー */

const settings =
  document.getElementById("settings");

const menu =
  document.getElementById("menu");


settings.addEventListener(
  "click",
  ()=>{

    menu.classList.toggle("show");

  }
);


/* ログアウト */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async ()=>{

      await sb.auth.signOut();

      location.href="index.html";

    }
  );

</script>

</body>
</html>
