<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NovaRadio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% 0,
      #211b50,
      #07091a 55%,
      #050611
    );

  color:#fff;
}

.wrap{
  width:min(1000px,92vw);
  margin:auto;
  padding:30px 0 80px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:60px;
}

.logo{
  font-size:34px;
  font-weight:800;
}

.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.account{
  padding:10px 14px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#ddd;
  font-size:13px;
}

.settings{
  width:44px;
  height:44px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#fff;
  font-size:21px;
  cursor:pointer;
}

.hero{
  text-align:center;
  margin-bottom:38px;
}

.hero h1{
  font-size:44px;
  margin:0 0 10px;
}

.hero p{
  color:#aeb0c8;
  margin:0;
  font-size:17px;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
  margin-bottom:25px;
}

.field{
  margin-bottom:30px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:13px;
  font-size:18px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.option{
  padding:12px 18px;
  border-radius:999px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#bfc2d8;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.option:hover{
  border-color:#7b25ff;
  color:#fff;
}

.option.selected{
  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );

  border-color:transparent;
  color:#fff;

  box-shadow:
    0 5px 20px #6425ff55;
}

.conditions{
  margin-top:8px;
  padding:16px 18px;
  border-radius:16px;
  background:#080b1d;
  border:1px solid #30355e;
  color:#aeb0c8;
  font-size:14px;
  line-height:1.7;
}

.conditions strong{
  color:#fff;
}

.play-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:25px;
}

.play{
  width:100%;
  margin-top:0;
  padding:19px;
  border:0;
  border-radius:18px;

  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );

  color:#fff;
  font-size:19px;
  font-weight:800;
  cursor:pointer;
}

.play.highlight{
  background:
    linear-gradient(
      90deg,
      #ff3d9a,
      #8b36ff
    );
}

.play:disabled{
  opacity:.45;
  cursor:not-allowed;
}

@media(max-width:650px){
  .play-buttons{
    grid-template-columns:1fr;
  }
}


/* =========================
   ARTIST SEARCH
========================= */

.artist-search{
  display:flex;
  gap:10px;
}

.artist-search input{
  flex:1;
  min-width:0;
  padding:16px;
  border-radius:15px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

.artist-search button{
  padding:0 22px;
  border:0;
  border-radius:15px;

  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );

  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.artist-results{
  margin-top:20px;
}

.artist-result{
  padding:18px;
  border-radius:17px;
  background:#080b1d;
  border:1px solid #30355e;
  margin-top:10px;
  cursor:pointer;
}

.artist-result:hover{
  border-color:#7b25ff;
}

.artist-result-inner{
  display:flex;
  align-items:center;
  gap:14px;
}

.artist-result-avatar{
  width:58px;
  height:58px;
  flex:0 0 58px;

  border-radius:50%;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #7b25ff,
      #159df5
    );

  font-size:24px;
}

.artist-result-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.artist-result-body{
  min-width:0;
  flex:1;
}

.artist-name{
  font-size:19px;
  font-weight:800;
}

.artist-bio-preview{
  margin-top:7px;
  color:#858baa;
  font-size:13px;
  line-height:1.5;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.artist-open{
  margin-top:9px;
  color:#cfd3ff;
  font-size:13px;
  font-weight:800;
}


/* =========================
   PLAYER
========================= */

.now{
  margin-top:30px;
  padding:28px;
  border-radius:22px;
  background:#080b1d;
  border:1px solid #30355e;
  text-align:center;
}


.now-cover{
  width:min(320px,78vw);
  aspect-ratio:1 / 1;
  margin:0 auto 22px;
  border-radius:24px;
  overflow:hidden;
  border:1px solid #30355e;
  background:
    linear-gradient(
      135deg,
      #171a31,
      #080b1d
    );
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:72px;
  color:#8f95b5;
  box-shadow:0 18px 50px #0006;
}

.now-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.now-label{
  color:#9da2c0;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.now-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:7px;
}

.now-artist{
  color:#aeb0c8;
}

.now-artist.clickable{
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:4px;
}

.artist-meta{
  margin-top:8px;
  color:#9da2c0;
  font-size:13px;
}

.player-nav{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.player-nav button{
  padding:14px;
  border-radius:14px;
  border:1px solid #343b67;
  background:#171a31;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.player-nav button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.like-button,
.playlist-button{
  width:100%;
  margin-top:14px;
  padding:15px;
  border-radius:16px;
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}



.like-button{
  border:1px solid #4a3558;
  background:#171325;
}

.like-button.liked{
  background:#542237;
  border-color:#a34b6a;
}

.playlist-button{
  border:1px solid #35527a;
  background:#17223a;
}

.empty{
  text-align:center;
  color:#8f93ad;
  padding:25px 10px;
}


/* =========================
   MENU
========================= */

.menu{
  display:none;
  position:absolute;
  right:4vw;
  top:88px;
  width:260px;

  background:#101228;
  border:1px solid #30355e;
  border-radius:20px;

  padding:10px;

  z-index:10;

  box-shadow:
    0 20px 60px #0008;
}

.menu.show{
  display:block;
}

.menu a,
.menu button{
  display:block;
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#fff;
  text-align:left;
  text-decoration:none;
  font-size:15px;
  cursor:pointer;
}

.menu a:hover,
.menu button:hover{
  background:#1c2040;
}

audio{
  width:100%;
  margin-top:22px;
}


/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  z-index:100;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(520px,95vw);
  background:#101228;
  border:1px solid #30355e;
  border-radius:24px;
  padding:25px;
}

.modal-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:18px;
}

.playlist-list{
  display:grid;
  gap:10px;
}

.playlist-choice{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #343b67;
  background:#080b1d;
  color:#fff;
  text-align:left;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.playlist-choice:hover{
  border-color:#7b25ff;
}

.new-playlist-button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:14px;

  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );

  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.modal-close{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#242842;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.create-area{
  display:none;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #30355e;
}

.create-area.show{
  display:block;
}

.create-input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

.create-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.create-buttons button{
  padding:13px;
  border:0;
  border-radius:13px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.cancel-create{
  background:#242842;
}

.save-create{
  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );
}



/* =========================
   FIXED MINI PLAYER
========================= */

body{
  padding-bottom:118px;
}

.fixed-player{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  width:min(940px,94vw);
  z-index:90;

  display:none;

  padding:10px 14px 8px;

  border:1px solid #3a3f70;
  border-radius:20px;

  background:#0b0e20f2;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  box-shadow:
    0 18px 60px #000a;
}

.fixed-player.show{
  display:block;
}

.fixed-player-main{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:14px;
  align-items:center;
}

.fixed-track{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.fixed-cover{
  width:54px;
  height:54px;
  flex:0 0 54px;

  border-radius:11px;
  overflow:hidden;

  border:1px solid #343b67;

  background:#15182e;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;
}

.fixed-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.fixed-info{
  min-width:0;
}

.fixed-title{
  font-size:14px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.fixed-artist{
  margin-top:3px;

  color:#9ba0bd;
  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.fixed-controls{
  display:flex;
  align-items:center;
  gap:7px;
}

.fixed-control{
  width:38px;
  height:38px;

  border:1px solid #343b67;
  border-radius:50%;

  background:#171a31;
  color:#fff;

  font-size:15px;
  font-weight:800;

  cursor:pointer;
}

.fixed-control.main{
  width:44px;
  height:44px;

  border:0;

  background:
    linear-gradient(
      135deg,
      #7b25ff,
      #159df5
    );

  font-size:18px;
}

.fixed-progress-row{
  display:grid;
  grid-template-columns:42px 1fr 42px;
  gap:9px;
  align-items:center;

  margin-top:6px;
}

.fixed-time{
  color:#8f94b2;
  font-size:11px;
  text-align:center;
}

.fixed-seek{
  width:100%;
  cursor:pointer;
  accent-color:#7b25ff;
}

/* NOW PLAYING内の標準audioバーは使わない */
#audioPlayer{
  display:none !important;
}

@media(max-width:600px){

  body{
    padding-bottom:132px;
  }

  .fixed-player{
    bottom:8px;
    padding:9px 10px 8px;
    border-radius:16px;
  }

  .fixed-player-main{
    gap:8px;
  }

  .fixed-cover{
    width:46px;
    height:46px;
    flex-basis:46px;
  }

  .fixed-control{
    width:34px;
    height:34px;
  }

  .fixed-control.main{
    width:40px;
    height:40px;
  }

}

/* =========================
   MOBILE
========================= */

@media(
  max-width:600px
){

  .hero h1{
    font-size:34px;
  }

  .logo{
    font-size:28px;
  }

  .account{
    display:none;
  }

  .artist-search{
    flex-direction:column;
  }

  .artist-search button{
    padding:16px;
  }

  .player-nav{
    grid-template-columns:1fr 1fr;
  }

  .now-cover{
    width:min(260px,76vw);
    border-radius:20px;
  }

  .card{
    padding:22px;
  }

}


/* ===== Genre categories ===== */
.genre-groups{display:grid;gap:12px}
.genre-group{border:1px solid rgba(116,130,205,.34);border-radius:18px;background:rgba(5,8,28,.24);overflow:hidden}
.genre-category-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px}
.genre-category-toggle{width:100%;border:0;background:transparent;color:#f5f6ff;font:inherit;font-weight:800;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-align:left}
.genre-category-row .genre-category-toggle{width:48px;justify-content:center;border:1px solid rgba(116,130,205,.34);border-radius:14px;padding:0}
.genre-category-select{width:100%;justify-content:flex-start;font-weight:850}
.genre-children{display:none;flex-wrap:wrap;gap:10px;padding:0 14px 14px}
.genre-children.open{display:flex}
.genre-category-toggle[aria-expanded="false"] .genre-chevron,
.genre-category-row .genre-category-toggle[aria-expanded="false"]{transform:rotate(180deg)}
.genre-limit-note{margin-top:10px;color:#9ea6c7;font-size:.9rem}
@media(min-width:760px){.genre-groups{grid-template-columns:repeat(2,minmax(0,1fr))}.genre-group:last-child:nth-child(odd){grid-column:1/-1}}


/* ===== NEW DISCOVERY ===== */
.new-discovery-wrap{
  margin-top:14px;
}
.new-discovery-button{
  width:100%;
  border:1px solid rgba(255,183,77,.32);
  border-radius:18px;
  padding:18px 20px;
  cursor:pointer;
  font:inherit;
  font-weight:900;
  font-size:18px;
  color:#fff;
  background:
    linear-gradient(
      100deg,
      rgba(255,111,40,.95),
      rgba(255,52,153,.94),
      rgba(122,62,255,.96)
    );
  box-shadow:
    0 12px 28px rgba(255,69,127,.15);
  transition:
    transform .18s ease,
    filter .18s ease;
}
.new-discovery-button:hover{
  transform:translateY(-1px);
  filter:brightness(1.05);
}
.new-discovery-sub{
  margin-top:8px;
  text-align:center;
  color:#9199ba;
  font-size:13px;
}

</style>

</head>


<body>


<main class="wrap">


<header>

  <div class="logo">
    NovaRadio
  </div>


  <div class="header-right">

    <div
      class="account"
      id="account"
    >
      確認中...
    </div>


    <button
      class="settings"
      id="settings"
      type="button"
    >
      ⚙️
    </button>

  </div>

</header>


<div
  class="menu"
  id="menu"
>

  <a href="mypage.html">
    👤 マイページ
  </a>

  <a href="dashboard.html">
    🎵 Artist Studio
  </a>

  <button
    id="logout"
    type="button"
  >
    🚪 ログアウト
  </button>

</div>


<section class="hero">

  <h1>
    🎧 今日は何を聴く？
  </h1>

  <p>
    ジャンルと気分を選んで、<br>
    あとはNovaRadioにおまかせ。
  </p>

</section>


<section class="card">


  <div class="field">

    <label>
      🎵 ジャンル
    </label>


    <div class="genre-groups" id="genreOptions">
<div class="genre-group">
<div class="genre-category-row">
<button type="button" class="option genre-category-select" data-category="Hip Hop / R&B" data-values="Hip Hop|Trap|Pluggnb|Rage|Drill|Boom Bap|R&B|Soul|Neo Soul|Jersey Club">Hip Hop / R&B</button>
<button type="button" class="genre-category-toggle" aria-label="Hip Hop / R&Bを展開" aria-expanded="false">⌄</button>

<div class="genre-children">

<button type="button" class="option genre-child" data-value="Trap">Trap</button>
<button type="button" class="option genre-child" data-value="Pluggnb">Pluggnb</button>
<button type="button" class="option genre-child" data-value="Rage">Rage</button>
<button type="button" class="option genre-child" data-value="Drill">Drill</button>
<button type="button" class="option genre-child" data-value="Boom Bap">Boom Bap</button>
<button type="button" class="option genre-child" data-value="R&B">R&B</button>
<button type="button" class="option genre-child" data-value="Soul">Soul</button>
<button type="button" class="option genre-child" data-value="Neo Soul">Neo Soul</button>
<button type="button" class="option genre-child" data-value="Jersey Club">Jersey Club</button>
</div>
</div>
<div class="genre-group">
<div class="genre-category-row">
<button type="button" class="option genre-category-select" data-category="Electronic / Dance" data-values="House|Techno|UK Garage|Drum & Bass|Amapiano|Future Bass|Hardstyle|Ambient">Electronic / Dance</button>
<button type="button" class="genre-category-toggle" aria-label="Electronic / Danceを展開" aria-expanded="false">⌄</button>
</div>
<div class="genre-children">
<button type="button" class="option genre-child" data-value="House">House</button>
<button type="button" class="option genre-child" data-value="Techno">Techno</button>
<button type="button" class="option genre-child" data-value="UK Garage">UK Garage</button>
<button type="button" class="option genre-child" data-value="Drum & Bass">Drum & Bass</button>
<button type="button" class="option genre-child" data-value="Amapiano">Amapiano</button>
<button type="button" class="option genre-child" data-value="Future Bass">Future Bass</button>
<button type="button" class="option genre-child" data-value="Hardstyle">Hardstyle</button>
<button type="button" class="option genre-child" data-value="Ambient">Ambient</button>
</div>
</div>
<div class="genre-group">
<div class="genre-category-row">
<button type="button" class="option genre-category-select" data-category="Pop" data-values="Pop|Indie Pop|Hyperpop|Synth-Pop|J-Pop|K-Pop|Afrobeats">Pop</button>
<button type="button" class="genre-category-toggle" aria-label="Popを展開" aria-expanded="false">⌄</button>
</div>
<div class="genre-children">
<button type="button" class="option genre-child" data-value="Pop">Pop</button>
<button type="button" class="option genre-child" data-value="Indie Pop">Indie Pop</button>
<button type="button" class="option genre-child" data-value="Hyperpop">Hyperpop</button>
<button type="button" class="option genre-child" data-value="Synth-Pop">Synth-Pop</button>
<button type="button" class="option genre-child" data-value="J-Pop">J-Pop</button>
<button type="button" class="option genre-child" data-value="K-Pop">K-Pop</button>
<button type="button" class="option genre-child" data-value="Afrobeats">Afrobeats</button>
</div>
</div>
<div class="genre-group">
<div class="genre-category-row">
<button type="button" class="option genre-category-select" data-category="Rock / Alternative" data-values="Rock|Indie Rock|Alternative|Punk|Metal|Emo">Rock / Alternative</button>
<button type="button" class="genre-category-toggle" aria-label="Rock / Alternativeを展開" aria-expanded="false">⌄</button>
</div>

function updateConditions(){

  const displayedGenres = [
    ...selectedGenreCategories.keys(),
    ...selectedGenres

  const genreText =
    displayedGenres.length
      ? displayedGenres.join(
          " / "

    !getEffectiveSelectedGenres().length &&

    noConditions;

  document
  .getElementById(
    "highlightPlay"
  )
  .disabled =
    noConditions;

}



function getEffectiveSelectedGenres(){
  return [...new Set([
    ...selectedGenres,
    ...Array.from(selectedGenreCategories.values()).flat()
  ])];
}

document.querySelectorAll("#genreOptions .genre-category-toggle").forEach(button=>{
  button.addEventListener("click",()=>{
    const children=button.closest(".genre-group").querySelector(".genre-children");
    const open=!children.classList.contains("open");
    children.classList.toggle("open",open);
    button.setAttribute("aria-expanded",String(open));
  });
});

document.querySelectorAll("#genreOptions .genre-category-select").forEach(button=>{
  button.addEventListener("click",()=>{
    const category=button.dataset.category;
    if(selectedGenreCategories.has(category)){
      selectedGenreCategories.delete(category);
      button.classList.remove("selected");
    }else{
      selectedGenreCategories.set(category,button.dataset.values.split("|").filter(Boolean));
      button.classList.add("selected");
    }
    updateConditions();
  });
});

document.querySelectorAll("#genreOptions .genre-child").forEach(button=>{
  button.addEventListener("click",()=>{
    toggleSelection(button,selectedGenres);
    updateConditions();
  });
});

document
.querySelectorAll(
  "#moodOptions .option"
)
.forEach(
  button=>{

    button.addEventListener(
      "click",

        toggleSelection(
          button,

        );

      }
    );

);


function toggleSelection(
  button,
  array
){

  const value =
    button.dataset.value;


  const index =
    array.indexOf(
      value
    );


  if(
    index === -1
  ){

    array.push(
      value
    );


    button.classList.add(
      "selected"
    );

  }
  else{

    array.splice(
      index,
      1
    );


    button.classList.remove(
      "selected"
    );

  }


  updateConditions();

}


/* =========================
   TAGS
========================= */

function splitTags(
  value
){

  if(!value){

    return [];

  }


  return String(
    value
  )
  .split(
    ","
  )
  .map(
    value=>
      value.trim()
  )
  .filter(
    Boolean
  );

}


/* =========================
   SONG MATCH
========================= */

function songMatches(
  song
){

  const genres =
    splitTags(
      song.genre
    );


  const moods =
    splitTags(
      song.mood
    );


  const effectiveGenres =
    getEffectiveSelectedGenres();

  const genreMatches =
    !effectiveGenres.length ||
    effectiveGenres.some(
      genre=>
        genres.includes(
          genre
        )
    );


  const moodMatches =
    !selectedMoods.length ||
    selectedMoods.some(
      mood=>
        moods.includes(
          mood
        )
    );


  return (
    genreMatches &&
    moodMatches
  );

}


/* =========================
   LIKE
========================= */

async function isSongLiked(
  songId,
  force=false
){

  if(
    !currentSession ||
    !songId
  ){
    return false;
  }

  const cacheKey =
    String(songId);

  if(
    !force &&
    likeStateCache.has(
      cacheKey
    )
  ){
    return likeStateCache.get(
      cacheKey
    );
  }

  /*
    同じ曲への問い合わせが同時に走った場合は
    1本にまとめる。
  */
  if(
    !force &&
    likeRequestCache.has(
      cacheKey
    )
  ){
    return likeRequestCache.get(
      cacheKey
    );
  }

  const request =
    (async ()=>{

      const {
        data,
        error
      } =
      await sb
      .from(
        "likes"
      )
      .select(
        "id"
      )
      .eq(
        "user_id",
        currentSession.user.id
      )
      .eq(
        "song_id",
        songId
      )
      .limit(
        1
      );

      if(error){

        console.error(
          "Like check error:",
          error
        );

        return false;
      }

      const liked =
        !!(
          data &&
          data.length
        );

      likeStateCache.set(
        cacheKey,
        liked
      );

      return liked;

    })();

  likeRequestCache.set(
    cacheKey,
    request
  );

  try{

    return await request;

  }
  finally{

    likeRequestCache.delete(
      cacheKey
    );

  }

}

}


async function toggleLike(){

  if(
    !currentSong ||
    !currentSession
  ){

    return;

  }


  const liked =
    await isSongLiked(
      currentSong.id
    );


  let error;


  if(liked){

    ({
      error
    } =
    await sb
    .from(
      "likes"
    )
    .delete()
    .eq(
      "user_id",
      currentSession.user.id
    )
    .eq(
      "song_id",
      currentSong.id
    ));

  }
  else{

    ({
      error
    } =
    await sb
    .from(
      "likes"
    )
    .insert({

      user_id:
        currentSession.user.id,

      song_id:
        currentSong.id

    }));

  }


  if(error){

    alert(
      (
        liked
          ? "いいね解除"
          : "いいね"
      ) +
      "に失敗しました：" +
      error.message
    );

    return;

  }

  likeStateCache.set(
    String(currentSong.id),
    !liked
  );

  await updateLikeButton();

}


/* =========================
   HISTORY
========================= */

function pushHistory(
  song
){

  if(
    historyIndex <
    historySongs.length - 1
  ){

    historySongs =
      historySongs.slice(
        0,
        historyIndex + 1
      );

  }


  historySongs.push(
    song
  );


  historyIndex =
    historySongs.length - 1;

}

/* =========================
   NAV BUTTONS
========================= */

function updateNavigationButtons(){

  const previousButton =
    document.getElementById(
      "previousButton"
    );


  const nextButton =
    document.getElementById(
      "nextButton"
    );


  if(previousButton){

    previousButton.disabled =
      historyIndex <= 0;

  }


  if(nextButton){

    nextButton.disabled =
      currentQueue.length <= 1;

  }

}


/* =========================
   PREVIOUS
========================= */

async function playPreviousSong(){

  if(isInsideNovaApp()){
    window.parent.postMessage(
      {type:"NOVARADIO_PREV"},
      "*"
    );
    return;
  }

  if(
    historyIndex <= 0
  ){

    return;

  }


  historyIndex -=
    1;


  await playSong(
    historySongs[
      historyIndex
    ],
    false
  );

}


/* =========================
   NEXT
========================= */

async function playNextSong(){

  if(isInsideNovaApp()){
    window.parent.postMessage(
      {type:"NOVARADIO_NEXT"},
      "*"
    );
    return;
  }

  if(
    !currentQueue.length
  ){

    return;

  }


  if(
    currentQueue.length === 1
  ){

    await playSong(
      currentQueue[0]
    );

    return;

  }


  let candidates =
    currentQueue.filter(
      song=>
        !currentSong ||
        Number(
          song.id
        ) !==
        Number(
          currentSong.id
        )
    );


  if(
    !candidates.length
  ){

    candidates =
      currentQueue;

  }


  const nextSong =
    candidates[
      Math.floor(
        Math.random() *
        candidates.length
      )
    ];


  await playSong(
    nextSong
  );

}



function isInsideNovaApp(){
  return (
    window.parent &&
    window.parent !== window
  );
}

function sendPlayToNovaApp(
  song,
  highlight=false
){
  if(!isInsideNovaApp()){
    return false;
  }

  window.parent.postMessage(
    {
      type:"NOVARADIO_PLAY",
      song:song,
      queue:currentQueue,
      index:currentQueue.findIndex(
        item=>
          Number(item.id) ===
          Number(song.id)
      ),
      highlight:
        !!highlight
    },
    "*"
  );

  return true;
}

function formatTime(
  seconds
){

  if(
    !Number.isFinite(
      seconds
    )
  ){
    return "0:00";
  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    Math.floor(
      seconds % 60
    );

  return (
    minutes +
    ":" +
    String(secs)
    .padStart(
      2,
      "0"
    )
  );

}


function playSongInFixedPlayer(
  song,
  restoreTime=null
){

  if(
    !song ||
    !song.audio_url
  ){
    return;
  }


  fixedPlayer.classList.add(
    "show"
  );


  const coverUrl =
    safeHttpUrl(
      song.cover_url
    );


  fixedCover.innerHTML =
    coverUrl
      ? `<img
          src="${escapeHtml(
            coverUrl
          )}"
          alt="${escapeHtml(
            (song.title || "ジャケット") +
            " のジャケット"
          )}"
        >`
      : "🎵";


  fixedTitle.textContent =
    song.title ||
    "Untitled";


  fixedArtist.textContent =
    song.artist ||
    "Unknown Artist";


  const currentSrc =
    globalAudio.getAttribute(
      "src"
    );


  if(
    currentSrc !==
    song.audio_url
  ){

    globalAudio.src =
      song.audio_url;

    globalAudio.load();

  }


  if(
    restoreTime !== null &&
    Number.isFinite(
      restoreTime
    ) &&
    restoreTime > 0
  ){

    const setRestoreTime =
      ()=>{

        if(
          Number.isFinite(
            globalAudio.duration
          )
        ){

          globalAudio.currentTime =
            Math.min(
              restoreTime,
              Math.max(
                0,
                globalAudio.duration - 0.25
              )
            );

        }

      };


    if(
      globalAudio.readyState >= 1
    ){
      setRestoreTime();
    }
    else{

      globalAudio.addEventListener(
        "loadedmetadata",
        setRestoreTime,
        {
          once:true
        }
      );

    }

  }


  globalAudio
  .play()
  .then(
    ()=>{
      fixedPlayPause.textContent =
        "⏸";
    }
  )
  .catch(
    ()=>{
      fixedPlayPause.textContent =
        "▶";
    }
  );


  savePlayerState();

}


function savePlayerState(){

  if(!currentSong){
    return;
  }


  const state = {

    song:
      currentSong,

    queue:
      currentQueue,

    history:
      historySongs,

    historyIndex:
      historyIndex,

    currentTime:
      Number(
        globalAudio.currentTime ||
        0
      ),

    wasPlaying:
      !globalAudio.paused,

    savedAt:
      Date.now()

  };


  try{

    localStorage.setItem(
      "novaradio_player_state",
      JSON.stringify(
        state
      )
    );

  }
  catch(error){

    console.warn(
      "Player state save failed:",
      error
    );

  }

}


async function restorePlayerState(){

  let raw;

  try{

    raw =
      localStorage.getItem(
        "novaradio_player_state"
      );

  }
  catch{

    return;

  }


  if(!raw){
    return;
  }


  try{

    const state =
      JSON.parse(
        raw
      );


    if(
      !state ||
      !state.song ||
      !state.song.audio_url
    ){
      return;
    }


    currentSong =
      state.song;


    currentQueue =
      Array.isArray(
        state.queue
      )
        ? state.queue
        : [];


    historySongs =
      Array.isArray(
        state.history
      )
        ? state.history
        : [];


    historyIndex =
      Number.isInteger(
        state.historyIndex
      )
        ? state.historyIndex
        : historySongs.length - 1;


    await playSong(
      currentSong,
      false
    );


    if(
      Number.isFinite(
        state.currentTime
      )
    ){

      const applyTime =
        ()=>{

          globalAudio.currentTime =
            Math.min(
              state.currentTime,
              Number.isFinite(
                globalAudio.duration
              )
                ? Math.max(
                    0,
                    globalAudio.duration - 0.25
                  )
                : state.currentTime
            );

        };


      if(
        globalAudio.readyState >= 1
      ){
        applyTime();
      }
      else{

        globalAudio.addEventListener(
          "loadedmetadata",
          applyTime,
          {
            once:true
          }
        );

      }

    }


    if(!state.wasPlaying){

      globalAudio.pause();

      fixedPlayPause.textContent =
        "▶";

    }


    updateNavigationButtons();

  }
  catch(error){

    console.warn(
      "Player state restore failed:",
      error
    );

  }

}

/* =========================
   FAIR / SCALABLE RADIO
========================= */

/*
  1000曲以上になっても全曲をブラウザへ取得しない。
  Supabase側で条件絞り込み + アーティスト公平抽選を行い、
  1回につき最大40曲だけ受け取る。
*/
const RADIO_BATCH_SIZE =
  40;

const RADIO_RECENT_KEY =
  "novaradio_recent_song_ids";

const RADIO_RECENT_LIMIT =
  80;


function getRecentRadioSongIds(){

  try{

    const value =
      JSON.parse(
        localStorage.getItem(
          RADIO_RECENT_KEY
        ) ||
        "[]"
      );

    if(!Array.isArray(value)){
      return [];
    }

    return value
    .map(Number)
    .filter(Number.isFinite)
    .slice(
      -RADIO_RECENT_LIMIT
    );

  }
  catch(error){

    return [];

  }

}


function rememberRadioSong(
  songId
){

  const id =
    Number(songId);

  if(!Number.isFinite(id)){
    return;
  }

  const recent =
    getRecentRadioSongIds()
    .filter(
      item=>
        Number(item) !== id
    );

  recent.push(id);

  try{

    localStorage.setItem(
      RADIO_RECENT_KEY,
      JSON.stringify(
        recent.slice(
          -RADIO_RECENT_LIMIT
        )
      )
    );

  }
  catch(error){}

}


async function fetchFairRadioQueue(){

  const recentIds =
    getRecentRadioSongIds();

  let result =
    await sb.rpc(
      "get_fair_radio_queue",
      {
        p_genres:
          getEffectiveSelectedGenres(),

        p_moods:
          selectedMoods,

        p_exclude_ids:
          recentIds,

        p_limit:
          RADIO_BATCH_SIZE
      }
    );

  /*
    最近聴いた曲を除外した結果が0件なら、
    除外だけ解除してもう一度取得。
    曲数が少ない開発初期でもラジオが止まらない。
  */
  if(
    !result.error &&
    (
      !result.data ||
      !result.data.length
    ) &&
    recentIds.length
  ){

    result =
      await sb.rpc(
        "get_fair_radio_queue",
        {
          p_genres:
          getEffectiveSelectedGenres(),

          p_moods:
            selectedMoods,

          p_exclude_ids:
            [],

          p_limit:
            RADIO_BATCH_SIZE
        }
      );

  }

  return result;

}


/* =========================
   NEW DISCOVERY
========================= */

const NEW_DISCOVERY_FETCH_LIMIT =
  60;


/*
  新着曲だけを少量取得。
  全曲は読み込まないので、曲数が増えても軽い。
*/
async function fetchNewDiscoveryQueue(){

  /*
    NEW DISCOVERYでも、現在Homeで選ばれている
    Genre / Mood条件をそのまま使う。

    ・何も選ばない → 全ジャンル新着
    ・Hip Hopだけ → Hip Hop新着
    ・Hip Hop / R&B大カテゴリー → 配下ジャンル全部
    ・Moodも選択 → Genre AND Moodで絞り込み
  */
  const effectiveGenres =
    getEffectiveSelectedGenres();

  /*
    NEW DISCOVERYは「アップロードから7日以内」の曲だけ。
    7日を過ぎた曲は通常再生 / 通常ハイライトには残るが、
    NEW DISCOVERYの候補からは外れる。
  */
  const sevenDaysAgo =
    new Date(
      Date.now() -
      7 * 24 * 60 * 60 * 1000
    )
    .toISOString();

  let query =
    sb
    .from("songs")
    .select("*")
    .not(
      "audio_url",
      "is",
      null
    )
    .gte(
      "created_at",
      sevenDaysAgo
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    )
    .limit(
      NEW_DISCOVERY_FETCH_LIMIT
    );

  /*
    songs.genre / mood はカンマ区切り文字列なので、
    まず新着候補を少量だけ取得してから
    ブラウザ側で既存の songMatches と同じ考え方で絞る。
    最大60曲だけなので全曲取得にはならない。
  */
  const {
    data,
    error
  } =
  await query;

  if(error){
    return {
      data:null,
      error
    };
  }


  const filtered =
    (data || [])
    .filter(
      song=>{

        const songGenres =
          String(
            song.genre ||
            ""
          )
          .split(",")
          .map(
            value=>
              value.trim()
          )
          .filter(Boolean);

        const songMoods =
          String(
            song.mood ||
            ""
          )
          .split(",")
          .map(
            value=>
              value.trim()
          )
          .filter(Boolean);


        const genreMatches =
          !effectiveGenres.length ||
          effectiveGenres.some(
            genre=>
              songGenres.includes(
                genre
              )
          );


        const moodMatches =
          !selectedMoods.length ||
          selectedMoods.some(
            mood=>
              songMoods.includes(
                mood
              )
          );


        return (
          genreMatches &&
          moodMatches
        );

      }
    );


  /*
    同じアーティストの大量投稿で新着欄が埋まらないように、
    アーティストごとに山を分けて交互に並べる。
  */
  const artistBuckets =
    new Map();

  for(
    const song
    of filtered
  ){

    const artistKey =
      String(
        song.user_id ||
        song.artist ||
        `song-${song.id}`
      )
      .trim()
      .toLowerCase();

    if(
      !artistBuckets.has(
        artistKey
      )
    ){
      artistBuckets.set(
        artistKey,
        []
      );
    }

    artistBuckets
    .get(
      artistKey
    )
    .push(
      song
    );

  }


  for(
    const bucket
    of artistBuckets.values()
  ){

    for(
      let i =
        bucket.length - 1;
      i > 0;
      i--
    ){

      const j =
        Math.floor(
          Math.random() *
          (i + 1)
        );

      [
        bucket[i],
        bucket[j]
      ] =
      [
        bucket[j],
        bucket[i]
      ];

    }

  }


  const queue =
    [];

  let buckets =
    Array.from(
      artistBuckets.values()
    );


  while(
    buckets.length
  ){

    buckets =
      buckets.sort(
        ()=>
          Math.random() -
          0.5
      );

    const nextBuckets =
      [];

    for(
      const bucket
      of buckets
    ){

      const song =
        bucket.shift();

      if(song){
        queue.push(
          song
        );
      }

      if(
        bucket.length
      ){
        nextBuckets.push(
          bucket
        );
      }

    }

    buckets =
      nextBuckets;

  }


  return {
    data:queue,
    error:null
  };

}


document
.getElementById(
  "newDiscoveryPlay"

.addEventListener(
  "click",
  async ()=>{

    const now =

    now.innerHTML =

    historySongs =

async function searchArtist(){

  const query =
    document
    .getElementById(
      "artistSearch"
    )
    .value
    .trim();


  const results =
    document.getElementById(
      "artistResults"
    );


  if(!query){

    results.innerHTML =
      `<div class="empty">
        アーティスト名を入力してください。
      </div>`;

    return;

  }


  results.innerHTML =
    `<div class="empty">
      「${escapeHtml(
        query
      )}」を探しています…
    </div>`;


  const {
    data,
    error
  } =
  await sb
  .from(
    "profiles"
  )
  .select(
    "user_id,artist_name,avatar_url,bio"
  )
  .ilike(
    "artist_name",
    `%${query}%`
  )
  .order(
    "artist_name",
    {
      ascending:true
    }
  );


  if(error){

    results.innerHTML =
      `<div class="empty">
        検索に失敗しました。
        <br><br>

        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;

  }


  if(
    !data ||
    !data.length
  ){

    results.innerHTML =
      `<div class="empty">
        「${escapeHtml(
          query
        )}」のアーティストは
        <br>
        見つかりませんでした。
      </div>`;

    return;

  }


  results.innerHTML =
    "";


  data.forEach(
    profile=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "artist-result";


      const avatar =
        safeHttpUrl(
          profile.avatar_url
        );


      const bio =
        String(
          profile.bio ||
          ""
        )
        .trim();


      item.innerHTML =
        `<div class="artist-result-inner">


          <div class="artist-result-avatar">

            ${
              avatar
                ? `<img
                    src="${escapeHtml(
                      avatar
                    )}"
                    alt=""
                  >`
                : "👤"
            }

          </div>


          <div class="artist-result-body">


            <div class="artist-name">

              ${escapeHtml(
                profile.artist_name ||
                "Unknown Artist"
              )}

            </div>


            ${
              bio
                ? `<div class="artist-bio-preview">
                    ${escapeHtml(
                      bio
                    )}
                  </div>`
                : ""
            }


            <div class="artist-open">
              👤 アーティストページを見る
            </div>


          </div>


        </div>`;


      item.addEventListener(
        "click",
        ()=>{

          location.href =
            `artist.html?id=${encodeURIComponent(
              profile.user_id
            )}`;

        }
      );


      results.appendChild(
        item
      );

    }
  );

}


/* =========================
   HELPERS
========================= */

function safeHttpUrl(
  value
){

  const raw =
    String(
      value ||
      ""
    )
    .trim();


  if(!raw){

    return null;

  }


  try{

    const url =
      new URL(
        raw
      );


    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return url.href;

    }


    return null;

  }
  catch{

    return null;

  }

}


function escapeHtml(
  value
){

  return String(
    value ??
    ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}
