<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at 50% 0,#211b50,#07091a 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(1000px,92vw);
  margin:auto;
  padding:30px 0 80px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:60px;
}

.logo{
  font-size:34px;
  font-weight:800;
}

.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.account{
  padding:10px 14px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#ddd;
  font-size:13px;
}

.settings{
  width:44px;
  height:44px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#fff;
  font-size:21px;
  cursor:pointer;
}

.hero{
  text-align:center;
  margin-bottom:38px;
}

.hero h1{
  font-size:44px;
  margin:0 0 10px;
}

.hero p{
  color:#aeb0c8;
  margin:0;
  font-size:17px;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
  margin-bottom:25px;
}

.field{
  margin-bottom:30px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:13px;
  font-size:18px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.option{
  padding:12px 18px;
  border-radius:999px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#bfc2d8;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.option:hover{
  border-color:#7b25ff;
  color:#fff;
}

.option.selected{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border-color:transparent;
  color:#fff;
  box-shadow:0 5px 20px #6425ff55;
}

.conditions{
  margin-top:8px;
  padding:16px 18px;
  border-radius:16px;
  background:#080b1d;
  border:1px solid #30355e;
  color:#aeb0c8;
  font-size:14px;
  line-height:1.7;
}

.conditions strong{
  color:#fff;
}

.play{
  width:100%;
  margin-top:25px;
  padding:19px;
  border:0;
  border-radius:18px;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  color:#fff;
  font-size:19px;
  font-weight:800;
  cursor:pointer;
}

.play:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.artist-search{
  display:flex;
  gap:10px;
}

.artist-search input{
  flex:1;
  min-width:0;
  padding:16px;
  border-radius:15px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

.artist-search button{
  padding:0 22px;
  border:0;
  border-radius:15px;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.artist-results{
  margin-top:20px;
}

.artist-result{
  padding:18px;
  border-radius:17px;
  background:#080b1d;
  border:1px solid #30355e;
  margin-top:10px;
  cursor:pointer;
}

.artist-result:hover{
  border-color:#7b25ff;
}

.artist-name{
  font-size:19px;
  font-weight:800;
}

.artist-meta{
  margin-top:5px;
  color:#9da2c0;
  font-size:13px;
}

.now{
  margin-top:30px;
  padding:28px;
  border-radius:22px;
  background:#080b1d;
  border:1px solid #30355e;
  text-align:center;
}

.now-label{
  color:#9da2c0;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.now-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:7px;
}

.now-artist{
  color:#aeb0c8;
}

.like-button,
.playlist-button{
  width:100%;
  margin-top:14px;
  padding:15px;
  border-radius:16px;
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.like-button{
  border:1px solid #4a3558;
  background:#171325;
}

.like-button.liked{
  background:#542237;
  border-color:#a34b6a;
}

.playlist-button{
  border:1px solid #35527a;
  background:#17223a;
}

.empty{
  text-align:center;
  color:#8f93ad;
  padding:25px 10px;
}

.menu{
  display:none;
  position:absolute;
  right:4vw;
  top:88px;
  width:260px;
  background:#101228;
  border:1px solid #30355e;
  border-radius:20px;
  padding:10px;
  z-index:10;
  box-shadow:0 20px 60px #0008;
}

.menu.show{
  display:block;
}

.menu a,
.menu button{
  display:block;
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#fff;
  text-align:left;
  text-decoration:none;
  font-size:15px;
  cursor:pointer;
}

.menu a:hover,
.menu button:hover{
  background:#1c2040;
}

audio{
  width:100%;
  margin-top:22px;
}

/* モーダル */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  z-index:100;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(520px,95vw);
  background:#101228;
  border:1px solid #30355e;
  border-radius:24px;
  padding:25px;
}

.modal-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:18px;
}

.playlist-list{
  display:grid;
  gap:10px;
}

.playlist-choice{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #343b67;
  background:#080b1d;
  color:#fff;
  text-align:left;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.playlist-choice:hover{
  border-color:#7b25ff;
}

.new-playlist-button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.modal-close{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#242842;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.create-area{
  display:none;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #30355e;
}

.create-area.show{
  display:block;
}

.create-input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

.create-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.create-buttons button{
  padding:13px;
  border:0;
  border-radius:13px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.cancel-create{
  background:#242842;
}

.save-create{
  background:linear-gradient(90deg,#7b25ff,#159df5);
}

@media(max-width:600px){
  .hero h1{
    font-size:34px;
  }

  .logo{
    font-size:28px;
  }

  .account{
    display:none;
  }

  .artist-search{
    flex-direction:column;
  }

  .artist-search button{
    padding:16px;
  }
}
</style>
</head>

<body>

<main class="wrap">

<header>

  <div class="logo">
    NovaRadio
  </div>

  <div class="header-right">

    <div
      class="account"
      id="account"
    >
      確認中...
    </div>

    <button
      class="settings"
      id="settings"
      type="button"
    >
      ⚙️
    </button>

  </div>

</header>


<div
  class="menu"
  id="menu"
>

  <a href="mypage.html">
    👤 マイページ
  </a>

  <a href="dashboard.html">
    🎵 Artist Studio
  </a>

  <button id="logout">
    🚪 ログアウト
  </button>

</div>


<section class="hero">

  <h1>
    🎧 今日は何を聴く？
  </h1>

  <p>
    ジャンルと気分を選んで、<br>
    あとはNovaRadioにおまかせ。
  </p>

</section>


<section class="card">

  <div class="field">

    <label>
      🎵 ジャンル
    </label>

    <div
      class="options"
      id="genreOptions"
    >

      <button type="button" class="option" data-value="Hip Hop">
        Hip Hop
      </button>

      <button type="button" class="option" data-value="R&B">
        R&B
      </button>

      <button type="button" class="option" data-value="Pop">
        Pop
      </button>

      <button type="button" class="option" data-value="Trap">
        Trap
      </button>

      <button type="button" class="option" data-value="Rock">
        Rock
      </button>

      <button type="button" class="option" data-value="Lo-Fi">
        Lo-Fi
      </button>

      <button type="button" class="option" data-value="Electronic">
        Electronic
      </button>

      <button type="button" class="option" data-value="Pluggnb">
        Pluggnb
      </button>

      <button type="button" class="option" data-value="Other">
        Other
      </button>

    </div>

  </div>


  <div class="field">

    <label>
      🌙 Mood
    </label>

    <div
      class="options"
      id="moodOptions"
    >

      <button type="button" class="option" data-value="Chill">
        Chill
      </button>

      <button type="button" class="option" data-value="Dark">
        Dark
      </button>

      <button type="button" class="option" data-value="Happy">
        Happy
      </button>

      <button type="button" class="option" data-value="Emotional">
        Emotional
      </button>

      <button type="button" class="option" data-value="Energetic">
        Energetic
      </button>

    </div>

  </div>


  <div
    class="conditions"
    id="conditions"
  >
    <strong>選択中：</strong>

  </div>


  <button

  >

    id="now"
  >

    <div class="now-label">

    </div>

      「この条件で再生」を押してね 🎧

</section>


<section class="card">

  <div class="field">

    <label>
      🔎 アーティストを探す

    <div class="artist-search">

      <input
        id="artistSearch"
        type="text"
        placeholder="アーティスト名を入力"
      >

      <button
        id="artistSearchButton"
        type="button"
      >
        探す
      </button>

    </div>

  </div>


  <div
    class="artist-results"
    id="artistResults"
  >

    <div class="empty">
      アーティスト名を入力して探してみよう。
    </div>

  </div>

</section>

</main>


<!-- プレイリスト追加モーダル -->

<div
  class="modal"
  id="playlistModal"
>

  <div class="modal-box">

    <div class="modal-title">
      📚 プレイリストに追加
    </div>

    <div
      class="playlist-list"
      id="playlistList"
    >
      <div class="empty">
        読み込んでいます…
      </div>
    </div>

    <button
      class="new-playlist-button"
      id="showCreatePlaylist"
      type="button"
    >
      ＋ 新しいプレイリストを作る
    </button>


    <div
      class="create-area"
      id="createPlaylistArea"
    >

      <input
        class="create-input"
        id="newPlaylistName"
        type="text"
        maxlength="50"
        placeholder="プレイリスト名"
      >

      <div class="create-buttons">

        <button
          class="cancel-create"
          id="cancelCreatePlaylist"
          type="button"
        >
          キャンセル
        </button>

        <button
          class="save-create"
          id="saveNewPlaylist"
          type="button"
        >
          作成して追加
        </button>

      </div>

    </div>


    <button
      class="modal-close"
      id="closePlaylistModal"
      type="button"
    >
      閉じる
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentSession =
  null;

let currentSong =
  null;


const selectedGenres =
  [];

const selectedMoods =
  [];


const playlistModal =
  document.getElementById(
    "playlistModal"
  );

const playlistList =
  document.getElementById(
    "playlistList"
  );

const createPlaylistArea =
  document.getElementById(
    "createPlaylistArea"
  );

const newPlaylistName =
  document.getElementById(
    "newPlaylistName"
  );


/* =========================
   LOGIN
========================= */

async function checkLogin(){

  const {
    data:{session},
    error
  } =
  await sb.auth.getSession();


  if(error){

    console.error(
      error
    );

    return;
  }


  if(!session){

    location.href =
      "index.html";

    return;
  }


  currentSession =
    session;


  const username =
    session.user.user_metadata?.artist_name ||
    "ユーザー";


  document
  .getElementById(
    "account"
  )
  .textContent =
    username;

}


checkLogin();


/* =========================
   GENRE / MOOD
========================= */

function updateConditions(){

  const genreText =
    selectedGenres.length
      ? selectedGenres.join(" / ")
      : "指定なし";


  const moodText =
    selectedMoods.length
      ? selectedMoods.join(" / ")
      : "指定なし";


  document
  .getElementById(
    "conditions"
  )
  .innerHTML =
    `<strong>選択中：</strong>
    ${genreText} × ${moodText}`;


  document
  .getElementById(
    "play"
  )
  .disabled =
    !selectedGenres.length &&
    !selectedMoods.length;

}


document
.querySelectorAll(
  "#genreOptions .option"
)
.forEach(
  button=>{

    button.addEventListener(
      "click",
      ()=>{

        const value =
          button.dataset.value;


        const index =
          selectedGenres.indexOf(
            value
          );


        if(
          index === -1
        ){

          selectedGenres.push(
            value
          );

          button.classList.add(
            "selected"
          );

        }
        else{

          selectedGenres.splice(
            index,
            1
          );

          button.classList.remove(
            "selected"
          );

        }


        updateConditions();

      }
    );

  }
);


document
.querySelectorAll(
  "#moodOptions .option"
)
.forEach(
  button=>{

    button.addEventListener(
      "click",
      ()=>{

        const value =
          button.dataset.value;


        const index =
          selectedMoods.indexOf(
            value
          );


        if(
          index === -1
        ){

          selectedMoods.push(
            value
          );

          button.classList.add(
            "selected"
          );

        }
        else{

          selectedMoods.splice(
            index,
            1
          );

          button.classList.remove(
            "selected"
          );

        }


        updateConditions();

      }
    );

  }
);


/* =========================
   TAG
========================= */

function splitTags(
  value
){

  if(!value){
    return [];
  }


  return String(value)
    .split(",")
    .map(
      tag=>tag.trim()
    )
    .filter(Boolean);

}


/* =========================
   MATCH
========================= */

function songMatches(
  song
){

  const songGenres =
    splitTags(
      song.genre
    );


  const songMoods =
    splitTags(
      song.mood
    );


  const genreMatches =
    !selectedGenres.length ||
    selectedGenres.some(
      genre=>
        songGenres.includes(
          genre
        )
    );


  const moodMatches =
    !selectedMoods.length ||
    selectedMoods.some(
      mood=>
        songMoods.includes(
          mood
        )
    );


  return (
    genreMatches &&
    moodMatches
  );

}


/* =========================
   LIKE
========================= */

async function isSongLiked(
  songId
){

  if(
    !currentSession
  ){
    return false;
  }


  const {
    data,
    error
  } =
  await sb
  .from("likes")
  .select("id")
  .eq(
    "user_id",
    currentSession.user.id
  )
  .eq(
    "song_id",
    songId
  )
  .limit(1);


  if(error){

    console.error(
      "Like check error:",
      error
    );

    return false;
  }


  return !!(
    data &&
    data.length
  );

}


async function updateLikeButton(){

  if(
    !currentSong ||
    !currentSession
  ){
    return;
  }


  const button =
    document.getElementById(
      "likeButton"
    );


  if(!button){
    return;
  }


  const liked =
    await isSongLiked(
      currentSong.id
    );


  if(liked){

    button.textContent =
      "❤️ いいね済み";

    button.classList.add(
      "liked"
    );

  }
  else{

    button.textContent =
      "🤍 いいね";

    button.classList.remove(
      "liked"
    );

  }

}


async function toggleLike(){

  if(
    !currentSong ||
    !currentSession
  ){
    return;
  }


  const liked =
    await isSongLiked(
      currentSong.id
    );


  if(liked){

    const {
      error
    } =
    await sb
    .from("likes")
    .delete()
    .eq(
      "user_id",
      currentSession.user.id
    )
    .eq(
      "song_id",
      currentSong.id
    );


    if(error){

      alert(
        "いいね解除に失敗しました：" +
        error.message
      );

      return;
    }

  }
  else{

    const {
      error
    } =
    await sb
    .from("likes")
    .insert({

      user_id:
        currentSession.user.id,

      song_id:
        currentSong.id

    });


    if(error){

      alert(
        "いいねに失敗しました：" +
        error.message
      );

      return;
    }

  }


  await updateLikeButton();

}


/* =========================
   PLAYER
========================= */

async function playSong(
  song
){

  currentSong =
    song;


  const now =
    document.getElementById(
      "now"
    );


  if(
    !song.audio_url
  ){

    now.innerHTML =
      `<div class="now-label">
        ERROR
      </div>

      <div class="empty">
        この曲には音源が登録されていません。
      </div>`;

    return;
  }


  const genres =
    splitTags(
      song.genre
    )
    .join(" / ");


  const moods =
    splitTags(
      song.mood
    )
    .join(" / ");


  now.innerHTML =
    `<div class="now-label">
      NOW PLAYING
    </div>

    <div class="now-title">
      ${escapeHtml(
        song.title ||
        "Untitled"
      )}
    </div>

    <div class="now-artist">
      ${escapeHtml(
        song.artist ||
        "Unknown Artist"
      )}
    </div>

    <div
      class="artist-meta"
      style="margin-top:8px;"
    >
      ${escapeHtml(
        genres
      )}

      ${
        moods
          ? " · " +
            escapeHtml(
              moods
            )
          : ""
      }
    </div>

    <audio
      id="audioPlayer"
      controls
      autoplay
      preload="metadata"
      src="${song.audio_url}"
    ></audio>

    <button
      class="like-button"
      id="likeButton"
      type="button"
    >
      🤍 いいね
    </button>

    <button
      class="playlist-button"
      id="playlistButton"
      type="button"
    >
      ＋ プレイリストに追加
    </button>`;


  document
  .getElementById(
    "likeButton"
  )
  .addEventListener(
    "click",
    toggleLike
  );


  document
  .getElementById(
    "playlistButton"
  )
  .addEventListener(
    "click",
    openPlaylistModal
  );


  const audio =
    document.getElementById(
      "audioPlayer"
    );


  audio
  .play()
  .catch(
    ()=>{}
  );


  await updateLikeButton();

}


/* =========================
   PLAYLIST MODAL
========================= */

async function openPlaylistModal(){

  if(
    !currentSong ||
    !currentSession
  ){
    return;
  }


  playlistModal.classList.add(
    "show"
  );


  createPlaylistArea.classList.remove(
    "show"
  );


  newPlaylistName.value =
    "";


  await loadPlaylistChoices();

}


async function loadPlaylistChoices(){

  playlistList.innerHTML =
    `<div class="empty">
      プレイリストを読み込んでいます…
    </div>`;


  const {
    data,
    error
  } =
  await sb
  .from("playlists")
  .select("*")
  .eq(
    "user_id",
    currentSession.user.id
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(error){

    playlistList.innerHTML =
      `<div class="empty">
        プレイリストを取得できませんでした。<br><br>
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;
  }


  playlistList.innerHTML =
    "";


  if(
    !data ||
    !data.length
  ){

    playlistList.innerHTML =
      `<div class="empty">
        まだプレイリストがありません。<br>
        下のボタンから作成できます 🎧
      </div>`;

    return;
  }


  data.forEach(
    playlist=>{

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "playlist-choice";


      button.textContent =
        "📚 " +
        (
          playlist.name ||
          "無題のプレイリスト"
        );


      button.addEventListener(
        "click",
        async ()=>{

          await addSongToPlaylist(
            playlist
          );

        }
      );


      playlistList.appendChild(
        button
      );

    }
  );

}


/* =========================
   NEW PLAYLIST
========================= */

document
.getElementById(
  "showCreatePlaylist"
)
.addEventListener(
  "click",
  ()=>{

    createPlaylistArea.classList.add(
      "show"
    );


    setTimeout(
      ()=>{

        newPlaylistName.focus();

      },
      100
    );

  }
);


document
.getElementById(
  "cancelCreatePlaylist"
)
.addEventListener(
  "click",
  ()=>{

    createPlaylistArea.classList.remove(
      "show"
    );


    newPlaylistName.value =
      "";

  }
);


document
.getElementById(
  "saveNewPlaylist"
)
.addEventListener(
  "click",
  createPlaylistAndAddSong
);


newPlaylistName.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Enter"
    ){

      createPlaylistAndAddSong();

    }

  }
);


async function createPlaylistAndAddSong(){

  if(
    !currentSong ||
    !currentSession
  ){
    return;
  }


  const name =
    newPlaylistName.value.trim();


  if(!name){

    alert(
      "プレイリスト名を入力してください。"
    );

    return;
  }


  const {
    data,
    error
  } =
  await sb
  .from("playlists")
  .insert({

    user_id:
      currentSession.user.id,

    name:
      name

  })
  .select("*")
  .single();


  if(error){

    alert(
      "プレイリスト作成に失敗しました：" +
      error.message
    );

    return;
  }


  if(!data){

    alert(
      "プレイリスト情報を取得できませんでした。"
    );

    return;
  }


  const {
    error:addError
  } =
  await sb
  .from("playlist_songs")
  .insert({

    playlist_id:
      data.id,

    song_id:
      currentSong.id,

    user_id:
      currentSession.user.id

  });


  if(addError){

    alert(
      "プレイリストは作成できましたが、曲の追加に失敗しました：" +
      addError.message
    );

    return;
  }


  alert(
    `「${data.name}」を作成して「${currentSong.title}」を追加しました！`
  );


  playlistModal.classList.remove(
    "show"
  );


  createPlaylistArea.classList.remove(
    "show"
  );


  newPlaylistName.value =
    "";

}


/* =========================
   ADD EXISTING PLAYLIST
========================= */

async function addSongToPlaylist(
  playlist
){

  if(
    !currentSong ||
    !currentSession
  ){
    return;
  }


  const {
    data:existing,
    error:checkError
  } =
  await sb
  .from("playlist_songs")
  .select("id")
  .eq(
    "playlist_id",
    playlist.id
  )
  .eq(
    "song_id",
    currentSong.id
  )
  .eq(
    "user_id",
    currentSession.user.id
  )
  .limit(1);


  if(checkError){

    alert(
      "確認に失敗しました：" +
      checkError.message
    );

    return;
  }


  if(
    existing &&
    existing.length
  ){

    alert(
      "この曲はすでにそのプレイリストに入っています。"
    );

    return;
  }


  const {
    error
  } =
  await sb
  .from("playlist_songs")
  .insert({

    playlist_id:
      playlist.id,

    song_id:
      currentSong.id,

    user_id:
      currentSession.user.id

  });


  if(error){

    alert(
      "プレイリストへの追加に失敗しました：" +
      error.message
    );

    return;
  }


  alert(
    `「${currentSong.title}」を「${playlist.name}」に追加しました！`
  );


  playlistModal.classList.remove(
    "show"
  );

}

/* =========================
   RANDOM PLAY
========================= */

document
.getElementById(
  "play"
)
.addEventListener(
  "click",
  async ()=>{

    const now =
      document.getElementById(
        "now"
      );


    now.innerHTML =
      `<div class="now-label">
        NOVARADIO
      </div>

      <div class="empty">
        曲を選んでいます… 🎧
      </div>`;


    const {
      data,
      error
    } =
    await sb
    .from("songs")
    .select("*");


    if(error){

      now.innerHTML =
        `<div class="now-label">
          ERROR
        </div>

        <div class="empty">
          曲の取得に失敗しました。<br><br>
          ${escapeHtml(
            error.message
          )}
        </div>`;

      return;
    }


    let songs =
      data || [];


    songs =
      songs.filter(
        songMatches
      );


    if(
      !songs.length
    ){

      now.innerHTML =
        `<div class="now-label">
          NOVARADIO
        </div>

        <div class="empty">
          この条件に合う曲は<br>
          まだありません 🎧
        </div>`;

      return;
    }


    const randomSong =
      songs[
        Math.floor(
          Math.random() *
          songs.length
        )
      ];


    await playSong(
      randomSong
    );

  }
);


/* =========================
   ARTIST SEARCH
========================= */

document
.getElementById(
  "artistSearchButton"
)
.addEventListener(
  "click",
  searchArtist
);


document
.getElementById(
  "artistSearch"
)
.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Enter"
    ){

      searchArtist();

    }

  }
);


async function searchArtist(){

  const query =
    document
    .getElementById(
      "artistSearch"
    )
    .value
    .trim();


  const results =
    document
    .getElementById(
      "artistResults"
    );


  if(
    !query
  ){

    results.innerHTML =
      `<div class="empty">
        アーティスト名を入力してください。
      </div>`;

    return;
  }


  results.innerHTML =
    `<div class="empty">
      「${escapeHtml(
        query
      )}」を探しています…
    </div>`;


  const {
    data,
    error
  } =
  await sb
  .from("songs")
  .select("*")
  .ilike(
    "artist",
    `%${query}%`
  );


  if(error){

    results.innerHTML =
      `<div class="empty">
        検索に失敗しました。<br><br>
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;
  }


  if(
    !data ||
    !data.length
  ){

    results.innerHTML =
      `<div class="empty">
        「${escapeHtml(
          query
        )}」の曲は<br>
        見つかりませんでした。
      </div>`;

    return;
  }


  results.innerHTML =
    "";


  data.forEach(
    song=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "artist-result";


      const genres =
        splitTags(
          song.genre
        )
        .join(" / ");


      const moods =
        splitTags(
          song.mood
        )
        .join(" / ");


      item.innerHTML =
        `<div class="artist-name">
          ${escapeHtml(
            song.title ||
            "Untitled"
          )}
        </div>

        <div class="artist-meta">
          ${escapeHtml(
            song.artist ||
            "Unknown Artist"
          )}

          ${
            genres
              ? " · " +
                escapeHtml(
                  genres
                )
              : ""
          }

          ${
            moods
              ? " · " +
                escapeHtml(
                  moods
                )
              : ""
          }
        </div>

        <div
          style="
            margin-top:12px;
            font-weight:700;
          "
        >
          ▶️ この曲を再生
        </div>`;


      item.addEventListener(
        "click",
        async ()=>{

          await playSong(
            song
          );


          document
          .getElementById(
            "now"
          )
          .scrollIntoView({
            behavior:"smooth",
            block:"center"
          });

        }
      );


      results.appendChild(
        item
      );

    }
  );

}


/* =========================
   HELPERS
========================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}
