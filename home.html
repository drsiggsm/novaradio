<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NovaRadio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% 0,
      #211b50,
      #07091a 55%,
      #050611
    );

  color:#fff;
}

.wrap{
  width:min(1000px,92vw);
  margin:auto;
  padding:30px 0 80px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:60px;
}

.logo{
  font-size:34px;
  font-weight:800;
}

.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.account{
  padding:10px 14px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#ddd;
  font-size:13px;
}

.settings{
  width:44px;
  height:44px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#101228;
  color:#fff;
  font-size:21px;
  cursor:pointer;
}

.hero{
  text-align:center;
  margin-bottom:38px;
}

.hero h1{
  font-size:44px;
  margin:0 0 10px;
}

.hero p{
  color:#aeb0c8;
  margin:0;
  font-size:17px;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
  margin-bottom:25px;
}

.field{
  margin-bottom:30px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:13px;
  font-size:18px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.option{
  padding:12px 18px;
  border-radius:999px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#bfc2d8;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.option:hover{
  border-color:#7b25ff;
  color:#fff;
}

.option.selected{
  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );

  border-color:transparent;
  color:#fff;

  box-shadow:
    0 5px 20px #6425ff55;
}

.conditions{
  margin-top:8px;
  padding:16px 18px;
  border-radius:16px;
  background:#080b1d;
  border:1px solid #30355e;
  color:#aeb0c8;
  font-size:14px;
  line-height:1.7;
}

.conditions strong{
  color:#fff;
}

.play{
  width:100%;
  margin-top:25px;
  padding:19px;
  border:0;
  border-radius:18px;

  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );

  color:#fff;
  font-size:19px;
  font-weight:800;
  cursor:pointer;
}

.play:disabled{
  opacity:.45;
  cursor:not-allowed;
}


/* =========================
   ARTIST SEARCH
========================= */

.artist-search{
  display:flex;
  gap:10px;
}

.artist-search input{
  flex:1;
  min-width:0;
  padding:16px;
  border-radius:15px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

.artist-search button{
  padding:0 22px;
  border:0;
  border-radius:15px;

  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );

  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.artist-results{
  margin-top:20px;
}

.artist-result{
  padding:18px;
  border-radius:17px;
  background:#080b1d;
  border:1px solid #30355e;
  margin-top:10px;
  cursor:pointer;
}

.artist-result:hover{
  border-color:#7b25ff;
}

.artist-result-inner{
  display:flex;
  align-items:center;
  gap:14px;
}

.artist-result-avatar{
  width:58px;
  height:58px;
  flex:0 0 58px;

  border-radius:50%;
  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      135deg,
      #7b25ff,
      #159df5
    );

  font-size:24px;
}

.artist-result-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.artist-result-body{
  min-width:0;
  flex:1;
}

.artist-name{
  font-size:19px;
  font-weight:800;
}

.artist-bio-preview{
  margin-top:7px;
  color:#858baa;
  font-size:13px;
  line-height:1.5;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.artist-open{
  margin-top:9px;
  color:#cfd3ff;
  font-size:13px;
  font-weight:800;
}


/* =========================
   PLAYER
========================= */

.now{
  margin-top:30px;
  padding:28px;
  border-radius:22px;
  background:#080b1d;
  border:1px solid #30355e;
  text-align:center;
}


.now-cover{
  width:min(320px,78vw);
  aspect-ratio:1 / 1;
  margin:0 auto 22px;
  border-radius:24px;
  overflow:hidden;
  border:1px solid #30355e;
  background:
    linear-gradient(
      135deg,
      #171a31,
      #080b1d
    );
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:72px;
  color:#8f95b5;
  box-shadow:0 18px 50px #0006;
}

.now-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.now-label{
  color:#9da2c0;
  font-size:13px;
  letter-spacing:1px;
  margin-bottom:12px;
}

.now-title{
  font-size:27px;
  font-weight:800;
  margin-bottom:7px;
}

.now-artist{
  color:#aeb0c8;
}

.now-artist.clickable{
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:4px;
}

.artist-meta{
  margin-top:8px;
  color:#9da2c0;
  font-size:13px;
}

.player-nav{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.player-nav button{
  padding:14px;
  border-radius:14px;
  border:1px solid #343b67;
  background:#171a31;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.player-nav button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.like-button,
.playlist-button{
  width:100%;
  margin-top:14px;
  padding:15px;
  border-radius:16px;
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.like-button{
  border:1px solid #4a3558;
  background:#171325;
}

.like-button.liked{
  background:#542237;
  border-color:#a34b6a;
}

.playlist-button{
  border:1px solid #35527a;
  background:#17223a;
}

.empty{
  text-align:center;
  color:#8f93ad;
  padding:25px 10px;
}


/* =========================
   MENU
========================= */

.menu{
  display:none;
  position:absolute;
  right:4vw;
  top:88px;
  width:260px;

  background:#101228;
  border:1px solid #30355e;
  border-radius:20px;

  padding:10px;

  z-index:10;

  box-shadow:
    0 20px 60px #0008;
}

.menu.show{
  display:block;
}

.menu a,
.menu button{
  display:block;
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#fff;
  text-align:left;
  text-decoration:none;
  font-size:15px;
  cursor:pointer;
}

.menu a:hover,
.menu button:hover{
  background:#1c2040;
}

audio{
  width:100%;
  margin-top:22px;
}


/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  z-index:100;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(520px,95vw);
  background:#101228;
  border:1px solid #30355e;
  border-radius:24px;
  padding:25px;
}

.modal-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:18px;
}

.playlist-list{
  display:grid;
  gap:10px;
}

.playlist-choice{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #343b67;
  background:#080b1d;
  color:#fff;
  text-align:left;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.playlist-choice:hover{
  border-color:#7b25ff;
}

.new-playlist-button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:14px;

  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );

  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.modal-close{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#242842;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.create-area{
  display:none;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #30355e;
}

.create-area.show{
  display:block;
}

.create-input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

.create-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.create-buttons button{
  padding:13px;
  border:0;
  border-radius:13px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.cancel-create{
  background:#242842;
}

.save-create{
  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );
}



/* =========================
   FIXED MINI PLAYER
========================= */

body{
  padding-bottom:118px;
}

.fixed-player{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  width:min(940px,94vw);
  z-index:90;

  display:none;

  padding:10px 14px 8px;

  border:1px solid #3a3f70;
  border-radius:20px;

  background:#0b0e20f2;

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  box-shadow:
    0 18px 60px #000a;
}

.fixed-player.show{
  display:block;
}

.fixed-player-main{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:14px;
  align-items:center;
}

.fixed-track{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.fixed-cover{
  width:54px;
  height:54px;
  flex:0 0 54px;

  border-radius:11px;
  overflow:hidden;

  border:1px solid #343b67;

  background:#15182e;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;
}

.fixed-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.fixed-info{
  min-width:0;
}

.fixed-title{
  font-size:14px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.fixed-artist{
  margin-top:3px;

  color:#9ba0bd;
  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.fixed-controls{
  display:flex;
  align-items:center;
  gap:7px;
}

.fixed-control{
  width:38px;
  height:38px;

  border:1px solid #343b67;
  border-radius:50%;

  background:#171a31;
  color:#fff;

  font-size:15px;
  font-weight:800;

  cursor:pointer;
}

.fixed-control.main{
  width:44px;
  height:44px;

  border:0;

  background:
    linear-gradient(
      135deg,
      #7b25ff,
      #159df5
    );

  font-size:18px;
}

.fixed-progress-row{
  display:grid;
  grid-template-columns:42px 1fr 42px;
  gap:9px;
  align-items:center;

  margin-top:6px;
}

.fixed-time{
  color:#8f94b2;
  font-size:11px;
  text-align:center;
}

.fixed-seek{
  width:100%;
  cursor:pointer;
  accent-color:#7b25ff;
}

/* NOW PLAYING内の標準audioバーは使わない */
#audioPlayer{
  display:none !important;
}

@media(max-width:600px){

  body{
    padding-bottom:132px;
  }

  .fixed-player{
    bottom:8px;
    padding:9px 10px 8px;
    border-radius:16px;
  }

  .fixed-player-main{
    gap:8px;
  }

  .fixed-cover{
    width:46px;
    height:46px;
    flex-basis:46px;
  }

  .fixed-control{
    width:34px;
    height:34px;
  }

  .fixed-control.main{
    width:40px;
    height:40px;
  }

}

/* =========================
   MOBILE
========================= */

@media(
  max-width:600px
){

  .hero h1{
    font-size:34px;
  }

  .logo{
    font-size:28px;
  }

  .account{
    display:none;
  }

  .artist-search{
    flex-direction:column;
  }

  .artist-search button{
    padding:16px;
  }

  .player-nav{
    grid-template-columns:1fr 1fr;
  }

  .now-cover{
    width:min(260px,76vw);
    border-radius:20px;
  }

  .card{
    padding:22px;
  }

}

</style>

</head>


<body>


<main class="wrap">


<header>

  <div class="logo">
    NovaRadio
  </div>


  <div class="header-right">

    <div
      class="account"
      id="account"
    >
      確認中...
    </div>


    <button
      class="settings"
      id="settings"
      type="button"
    >
      ⚙️
    </button>

  </div>

</header>


<div
  class="menu"
  id="menu"
>

  <a href="mypage.html">
    👤 マイページ
  </a>

  <a href="dashboard.html">
    🎵 Artist Studio
  </a>

  <button
    id="logout"
    type="button"
  >
    🚪 ログアウト
  </button>

</div>


<section class="hero">

  <h1>
    🎧 今日は何を聴く？
  </h1>

  <p>
    ジャンルと気分を選んで、<br>
    あとはNovaRadioにおまかせ。
  </p>

</section>


<section class="card">


  <div class="field">

    <label>
      🎵 ジャンル
    </label>


    <div
      class="options"
      id="genreOptions"
    >

      <button
        type="button"
        class="option"
        data-value="Hip Hop"
      >
        Hip Hop
      </button>


      <button
        type="button"
        class="option"
        data-value="R&B"
      >
        R&B
      </button>


      <button
        type="button"
        class="option"
        data-value="Pop"
      >
        Pop
      </button>


      <button
        type="button"
        class="option"
        data-value="Trap"
      >
        Trap
      </button>


      <button
        type="button"
        class="option"
        data-value="Rock"
      >
        Rock
      </button>


      <button
        type="button"
        class="option"
        data-value="Lo-Fi"
      >
        Lo-Fi
      </button>


      <button
        type="button"
        class="option"
        data-value="Electronic"
      >
        Electronic
      </button>


      <button
        type="button"
        class="option"
        data-value="Pluggnb"
      >
        Pluggnb
      </button>


      <button
        type="button"
        class="option"
        data-value="Other"
      >
        Other
      </button>

    </div>

  </div>


  <div class="field">

    <label>
      🌙 Mood
    </label>


    <div
      class="options"
      id="moodOptions"
    >

      <button
        type="button"
        class="option"
        data-value="Chill"
      >
        Chill
      </button>


      <button
        type="button"
        class="option"
        data-value="Dark"
      >
        Dark
      </button>


      <button
        type="button"
        class="option"
        data-value="Happy"
      >
        Happy
      </button>


      <button
        type="button"
        class="option"
        data-value="Emotional"
      >
        Emotional
      </button>


      <button
        type="button"
        class="option"
        data-value="Energetic"
      >
        Energetic
      </button>

    </div>

  </div>


  <div
    class="conditions"
    id="conditions"
  >
    <strong>
      選択中：
    </strong>

    まだ条件が選択されていません
  </div>


  <button
    class="play"
    id="play"
    disabled
  >
    ▶️ この条件で再生
  </button>


  <div
    class="now"
    id="now"
  >

    <div class="now-label">
      NOVARADIO
    </div>

    <div class="empty">
      ジャンルとMoodを選んで<br>
      「この条件で再生」を押してね 🎧
    </div>

  </div>


</section>


<section class="card">


  <div class="field">

    <label>
      🔎 アーティストを探す
    </label>


    <div class="artist-search">

      <input
        id="artistSearch"
        type="text"
        placeholder="アーティスト名を入力"
      >


      <button
        id="artistSearchButton"
        type="button"
      >
        探す
      </button>

    </div>

  </div>


  <div
    class="artist-results"
    id="artistResults"
  >

    <div class="empty">
      アーティスト名を入力して探してみよう。
    </div>

  </div>


</section>


</main>


<!-- 画面下固定プレイヤー -->
<div
  class="fixed-player"
  id="fixedPlayer"
>
  <div class="fixed-player-main">

    <div class="fixed-track">

      <div
        class="fixed-cover"
        id="fixedCover"
      >
        🎵
      </div>

      <div class="fixed-info">

        <div
          class="fixed-title"
          id="fixedTitle"
        >
          曲を選択
        </div>

        <div
          class="fixed-artist"
          id="fixedArtist"
        >
          NovaRadio
        </div>

      </div>

    </div>


    <div class="fixed-controls">

      <button
        type="button"
        class="fixed-control"
        id="fixedPrev"
        title="前の曲"
      >
        ⏮
      </button>

      <button
        type="button"
        class="fixed-control main"
        id="fixedPlayPause"
        title="再生 / 一時停止"
      >
        ▶
      </button>

      <button
        type="button"
        class="fixed-control"
        id="fixedNext"
        title="次の曲"
      >
        ⏭
      </button>

    </div>

  </div>


  <div class="fixed-progress-row">

    <div
      class="fixed-time"
      id="fixedCurrentTime"
    >
      0:00
    </div>

    <input
      class="fixed-seek"
      id="fixedSeek"
      type="range"
      min="0"
      max="100"
      value="0"
      step="0.1"
      aria-label="再生位置"
    >

    <div
      class="fixed-time"
      id="fixedDuration"
    >
      0:00
    </div>

  </div>


  <audio
    id="globalAudio"
    preload="metadata"
  ></audio>

</div>


<div
  class="modal"
  id="playlistModal"
>

  <div class="modal-box">


    <div class="modal-title">
      📚 プレイリストに追加
    </div>


    <div
      class="playlist-list"
      id="playlistList"
    >

      <div class="empty">
        読み込んでいます…
      </div>

    </div>


    <button
      class="new-playlist-button"
      id="showCreatePlaylist"
      type="button"
    >
      ＋ 新しいプレイリストを作る
    </button>


    <div
      class="create-area"
      id="createPlaylistArea"
    >

      <input
        class="create-input"
        id="newPlaylistName"
        type="text"
        maxlength="50"
        placeholder="プレイリスト名"
      >


      <div class="create-buttons">

        <button
          class="cancel-create"
          id="cancelCreatePlaylist"
          type="button"
        >
          キャンセル
        </button>


        <button
          class="save-create"
          id="saveNewPlaylist"
          type="button"
        >
          作成して追加
        </button>

      </div>

    </div>


    <button
      class="modal-close"
      id="closePlaylistModal"
      type="button"
    >
      閉じる
    </button>


  </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =

function toggleSelection(
  button,
  array
){

  const value =
    button.dataset.value;


  const index =
    array.indexOf(
      value
    );


  if(
    index === -1
  ){

    array.push(
      value
    );


    button.classList.add(
      "selected"
    );

  }
  else{

    array.splice(
      index,
      1
    );


    button.classList.remove(
      "selected"
    );

  }


  updateConditions();

}


/* =========================
   TAGS
========================= */

function splitTags(
  value
){

  if(!value){

    return [];

  }


  return String(
    value
  )
  .split(
    ","
  )
  .map(
    value=>
      value.trim()
  )
  .filter(
    Boolean
  );

}


/* =========================
   SONG MATCH
========================= */

function songMatches(
  song
){

  const genres =
    splitTags(
      song.genre
    );


  const moods =
    splitTags(
      song.mood
    );


  const genreMatches =
    !selectedGenres.length ||
    selectedGenres.some(
      genre=>
        genres.includes(
          genre
        )
    );


  const moodMatches =
    !selectedMoods.length ||
    selectedMoods.some(
      mood=>
        moods.includes(
          mood
        )
    );


  return (
    genreMatches &&
    moodMatches
  );

}

function pushHistory(
  song
){

  if(
    historyIndex <
    historySongs.length - 1

    historySongs =
      historySongs.slice(
        0,
        historyIndex + 1
      );

  }


  historySongs.push(
    song
  );


  historyIndex =
    historySongs.length - 1;

}

/* =========================
   NEXT
========================= */

async function playNextSong(){

  if(
    !currentQueue.length
  ){

    return;

  }


  if(
    currentQueue.length === 1
  ){

    await playSong(
      currentQueue[0]
    );

    return;

  }


  let candidates =
    currentQueue.filter(
      song=>
        !currentSong ||
        Number(
          song.id
        ) !==
        Number(
          currentSong.id
        )
    );


  if(
    !candidates.length
  ){

    candidates =
      currentQueue;

  }


  const nextSong =
    candidates[
      Math.floor(
        Math.random() *
        candidates.length
      )
    ];


  await playSong(
    nextSong
  );

}



/* =========================
   FIXED PLAYER
========================= */

function formatTime(
  seconds
){

  if(
    !Number.isFinite(
      seconds
    )
  ){
    return "0:00";
  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    Math.floor(
      seconds % 60
    );

  return (
    minutes +
    ":" +
    String(secs)
    .padStart(
      2,
      "0"
    )
  );

}


function playSongInFixedPlayer(
  song,
  restoreTime=null
){

  if(
    !song ||
    !song.audio_url
  ){
    return;
  }


  fixedPlayer.classList.add(
    "show"
  );


  const coverUrl =
    safeHttpUrl(
      song.cover_url
    );


  fixedCover.innerHTML =
    coverUrl
      ? `<img
          src="${escapeHtml(
            coverUrl
          )}"
          alt="${escapeHtml(
            (song.title || "ジャケット") +
            " のジャケット"
          )}"
        >`
      : "🎵";


  fixedTitle.textContent =
    song.title ||
    "Untitled";


  fixedArtist.textContent =
    song.artist ||
    "Unknown Artist";


  const currentSrc =
    globalAudio.getAttribute(
      "src"
    );


  if(
    currentSrc !==
    song.audio_url
  ){

    globalAudio.src =
      song.audio_url;

    globalAudio.load();

  }


  if(
    restoreTime !== null &&
    Number.isFinite(
      restoreTime
    ) &&
    restoreTime > 0
  ){

    const setRestoreTime =
      ()=>{

        if(
          Number.isFinite(
            globalAudio.duration
          )
        ){

          globalAudio.currentTime =
            Math.min(
              restoreTime,
              Math.max(
                0,
                globalAudio.duration - 0.25
              )
            );

        }

      };


    if(
      globalAudio.readyState >= 1
    ){
      setRestoreTime();
    }
    else{

      globalAudio.addEventListener(
        "loadedmetadata",
        setRestoreTime,
        {
          once:true
        }
      );

    }

  }


  globalAudio
  .play()
  .then(
    ()=>{
      fixedPlayPause.textContent =
        "⏸";
    }
  )
  .catch(
    ()=>{
      fixedPlayPause.textContent =
        "▶";
    }
  );


  savePlayerState();

}


function savePlayerState(){

  if(!currentSong){
    return;
  }


  const state = {

    song:
      currentSong,

    queue:
      currentQueue,

    history:
      historySongs,

    historyIndex:
      historyIndex,

    currentTime:
      Number(
        globalAudio.currentTime ||
        0
      ),

    wasPlaying:
      !globalAudio.paused,

    savedAt:
      Date.now()

  };


  try{

    localStorage.setItem(
      "novaradio_player_state",
      JSON.stringify(
        state
      )
    );

  }
  catch(error){

    console.warn(
      "Player state save failed:",
      error
    );

  }

}


async function restorePlayerState(){

  let raw;

  try{

    raw =
      localStorage.getItem(
        "novaradio_player_state"
      );

  }
  catch{

    return;

  }


  if(!raw){
    return;
  }


  try{

    const state =
      JSON.parse(
        raw
      );


    if(
      !state ||
      !state.song ||
      !state.song.audio_url
    ){
      return;
    }


    currentSong =
      state.song;


    currentQueue =
      Array.isArray(
        state.queue
      )
        ? state.queue
        : [];


    historySongs =
      Array.isArray(
        state.history
      )
        ? state.history
        : [];


    historyIndex =
      Number.isInteger(
        state.historyIndex
      )
        ? state.historyIndex
        : historySongs.length - 1;


    await playSong(
      currentSong,
      false
    );


    if(
      Number.isFinite(
        state.currentTime
      )
    ){

      const applyTime =
        ()=>{

          globalAudio.currentTime =
            Math.min(
              state.currentTime,
              Number.isFinite(
                globalAudio.duration
              )
                ? Math.max(
                    0,
                    globalAudio.duration - 0.25
                  )
                : state.currentTime
            );

        };


      if(
        globalAudio.readyState >= 1
      ){
        applyTime();
      }
      else{

        globalAudio.addEventListener(
          "loadedmetadata",
          applyTime,
          {
            once:true
          }
        );

      }

    }


    if(!state.wasPlaying){

      globalAudio.pause();

      fixedPlayPause.textContent =
        "▶";

    }


    updateNavigationButtons();

  }
  catch(error){

    console.warn(
      "Player state restore failed:",
      error
    );

  }

}


fixedPlayPause.addEventListener(
  "click",
  ()=>{

    if(!currentSong){
      return;
    }


    if(globalAudio.paused){

      globalAudio
      .play()
      .catch(()=>{});

    }
    else{

      globalAudio.pause();

    }

  }
);


fixedPrev.addEventListener(

fixedNext.addEventListener(

  playNextSong

globalAudio.addEventListener(
  "play",
  ()=>{

    fixedPlayPause.textContent =
      "⏸";

    savePlayerState();

  }
);


globalAudio.addEventListener(
  "pause",
  ()=>{

    fixedPlayPause.textContent =
      "▶";

    savePlayerState();

  }
);


globalAudio.addEventListener(
  "loadedmetadata",
  ()=>{

    fixedDuration.textContent =
      formatTime(
        globalAudio.duration
      );

  }
);


globalAudio.addEventListener(
  "timeupdate",
  ()=>{

    fixedCurrentTime.textContent =
      formatTime(
        globalAudio.currentTime
      );


    if(
      Number.isFinite(
        globalAudio.duration
      ) &&
      globalAudio.duration > 0
    ){

      fixedSeek.value =
        (
          globalAudio.currentTime /
          globalAudio.duration
        ) * 100;

    }


    if(
      Math.floor(
        globalAudio.currentTime
      ) % 2 === 0
    ){
      savePlayerState();
    }

  }
);


globalAudio.addEventListener(
  "ended",
  async ()=>{

    savePlayerState();

    await playNextSong();

  }
);


fixedSeek.addEventListener(
  "input",
  ()=>{

    if(
      !Number.isFinite(
        globalAudio.duration
      ) ||
      globalAudio.duration <= 0
    ){
      return;
    }


    globalAudio.currentTime =
      (
        Number(
          fixedSeek.value
        ) / 100
      ) *
      globalAudio.duration;

  }
);


window.addEventListener(
  "beforeunload",
  savePlayerState
);

    error:checkError
  } =
  await sb
  .from(
    "playlist_songs"
  )
  .select(
    "id"
  )
  .eq(
    "playlist_id",
    playlist.id
  )
  .eq(
    "song_id",
    currentSong.id
  )
  .eq(
    "user_id",
    currentSession.user.id
  )
  .limit(
    1
  );


  if(checkError){

    alert(
      "確認に失敗しました：" +
      checkError.message
    );

    return;

  }


  if(
    existing &&
    existing.length
  ){

    alert(
      "この曲はすでにそのプレイリストに入っています。"
    );

    return;

  }


  const {
    error
  } =
  await sb
  .from(
    "playlist_songs"
  )
  .insert({

    playlist_id:
      playlist.id,

    song_id:
      currentSong.id,

    user_id:
      currentSession.user.id

  });


  if(error){

    alert(
      "プレイリストへの追加に失敗しました：" +
      error.message
    );

    return;

  }


  alert(
    `「${currentSong.title}」を「${playlist.name}」に追加しました！`
  );


  playlistModal.classList.remove(
    "show"
  );

}

async function searchArtist(){

  const query =
    document
    .getElementById(
      "artistSearch"
    )
    .value
    .trim();


  const results =
    document.getElementById(
      "artistResults"
    );


  if(!query){

    results.innerHTML =
      `<div class="empty">
        アーティスト名を入力してください。
      </div>`;

    return;

  }


  results.innerHTML =
    `<div class="empty">
      「${escapeHtml(
        query
      )}」を探しています…
    </div>`;


  const {
    data,
    error
  } =
  await sb
  .from(
    "profiles"
  )
  .select(
    "user_id,artist_name,avatar_url,bio"
  )
  .ilike(
    "artist_name",
    `%${query}%`
  )
  .order(
    "artist_name",
    {
      ascending:true
    }
  );


  if(error){

    results.innerHTML =
      `<div class="empty">
        検索に失敗しました。
        <br><br>

        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;

  }


  if(
    !data ||
    !data.length
  ){

    results.innerHTML =
      `<div class="empty">
        「${escapeHtml(
          query
        )}」のアーティストは
        <br>
        見つかりませんでした。
      </div>`;

    return;

  }


  results.innerHTML =
    "";


  data.forEach(
    profile=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "artist-result";


      const avatar =
        safeHttpUrl(
          profile.avatar_url
        );


      const bio =
        String(
          profile.bio ||
          ""
        )
        .trim();


      item.innerHTML =
        `<div class="artist-result-inner">


          <div class="artist-result-avatar">

            ${
              avatar
                ? `<img
                    src="${escapeHtml(
                      avatar
                    )}"
                    alt=""
                  >`
                : "👤"
            }

          </div>


          <div class="artist-result-body">


            <div class="artist-name">

              ${escapeHtml(
                profile.artist_name ||
                "Unknown Artist"
              )}

            </div>


            ${
              bio
                ? `<div class="artist-bio-preview">
                    ${escapeHtml(
                      bio
                    )}
                  </div>`
                : ""
            }


            <div class="artist-open">
              👤 アーティストページを見る
            </div>


          </div>


        </div>`;


      item.addEventListener(
        "click",
        ()=>{

          location.href =
            `artist.html?id=${encodeURIComponent(
              profile.user_id
            )}`;

        }
      );


      results.appendChild(
        item
      );

    }
  );

}


/* =========================
   HELPERS
========================= */

function safeHttpUrl(
  value
){

  const raw =
    String(
      value ||
      ""
    )
    .trim();


  if(!raw){

    return null;

  }


  try{

    const url =
      new URL(
        raw
      );


    if(
      url.protocol === "http:" ||
      url.protocol === "https:"
    ){

      return url.href;

    }


    return null;

  }
  catch{

    return null;

  }

}


function escapeHtml(
  value
){

  return String(
    value ??
    ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}
