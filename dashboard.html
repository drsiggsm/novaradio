<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio - Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#080a18;
  color:#fff;
}

.wrap{
  width:min(900px,94vw);
  margin:auto;
  padding:50px 0 80px;
}

.brand{
  text-align:center;
  font-size:42px;
  font-weight:800;
  margin-bottom:8px;
}

.sub{
  text-align:center;
  color:#aeb0c8;
  margin-bottom:35px;
}

.card{
  background:#101228;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
  margin-bottom:24px;
}

h2{
  margin-top:0;
  font-size:24px;
}

.user{
  color:#aeb0c8;
  margin-bottom:25px;
}

.field{
  margin:20px 0;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

input,select{
  width:100%;
  padding:16px;
  border-radius:15px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  margin-top:15px;
  padding:17px;
  border:0;
  border-radius:18px;
  font-size:17px;
  font-weight:800;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(90deg,#7b25ff,#159df5);
}

.logout{
  background:#242842;
}

.status{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  border:1px solid #385d55;
  color:#bfffe8;
  background:#101b2b;
}

.error{
  border-color:#8d4050;
  color:#ffd6dc;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:60px 0;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">NovaRadioへ。</div>
  <div class="sub">あなたの音源を設定してください。</div>

  <div id="loading" class="loading">
    ログイン状態を確認しています…
  </div>

  <main id="dashboard" style="display:none">

    <section class="card">
      <h2>🎧 アカウント</h2>
      <div class="user">
        ログイン中：<span id="userEmail"></span>
      </div>

      <button class="logout" id="logout">
        ログアウト
      </button>
    </section>

    <section class="card">
      <h2>🎵 曲の設定</h2>

      <div class="field">
        <label>曲名</label>
        <input id="songTitle" type="text" placeholder="曲名を入力">
      </div>

      <div class="field">
        <label>アーティスト名</label>
        <input id="artistName" type="text" value="Dr.SIG">
      </div>

      <div class="field">
        <label>BPM</label>
        <input id="bpm" type="number" placeholder="例：90">
      </div>

      <div class="field">
        <label>キー</label>
        <input id="songKey" type="text" placeholder="例：B Major">
      </div>

      <div class="field">
        <label>ジャンル</label>
        <select id="genre">
          <option value="">選択してください</option>
          <option>Hip Hop</option>
          <option>R&B</option>
          <option>Pluggnb</option>
          <option>Trap</option>
          <option>Pop</option>
          <option>Other</option>
        </select>
      </div>

      <button id="save">
        曲の設定を保存
      </button>

      <div id="status" class="status"></div>
    </section>

  </main>

</div>

<script>

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3s1D8w_31mBaUdm";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loading = document.getElementById("loading");
const dashboard = document.getElementById("dashboard");
const userEmail = document.getElementById("userEmail");

async function init(){

  const {
    data: { session },
    error
  } = await sb.auth.getSession();

  if(error){
    loading.textContent =
      "ログイン状態の確認に失敗しました。";
    console.error(error);
    return;
  }

  if(!session){
    loading.textContent =
      "ログインしていません。ログイン画面へ戻ります…";

    setTimeout(()=>{
      location.href = "index.html";
    },1500);

    return;
  }

  userEmail.textContent =
    session.user.email || "";

  loading.style.display = "none";
  dashboard.style.display = "block";
}

document.getElementById("logout").addEventListener(
  "click",
  async ()=>{

    await sb.auth.signOut();

    location.href = "index.html";
  }
);

document.getElementById("save").addEventListener(
  "click",
  ()=>{

    const title =
      document.getElementById("songTitle").value;

    const artist =
      document.getElementById("artistName").value;

    const bpm =
      document.getElementById("bpm").value;

    const key =
      document.getElementById("songKey").value;

    const genre =
      document.getElementById("genre").value;

    if(!title){
      showStatus("曲名を入力してください。",true);
      return;
    }

    const settings = {
      title,
      artist,
      bpm,
      key,
      genre
    };

    localStorage.setItem(
      "novaradio_song_settings",
      JSON.stringify(settings)
    );

    showStatus(
      "曲の設定を保存しました！🔥",
      false
    );
  }
);

function showStatus(message,isError){

  const status =
    document.getElementById("status");

  status.textContent = message;
  status.style.display = "block";

  if(isError){
    status.classList.add("error");
  }else{
    status.classList.remove("error");
  }
}

init();

</script>

</body>
</html>
