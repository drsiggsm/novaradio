<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio - Artist Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at 50% 0,#211b50,#080a18 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(900px,94vw);
  margin:auto;
  padding:45px 0 80px;
}

.brand{
  text-align:center;
  font-size:42px;
  font-weight:800;
  margin-bottom:8px;
}

.sub{
  text-align:center;
  color:#aeb0c8;
  margin-bottom:35px;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
  margin-bottom:24px;
}

h2{
  margin-top:0;
  font-size:24px;
}

.user{
  color:#aeb0c8;
  margin-bottom:20px;
  line-height:1.7;
}

.field{
  margin:24px 0;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:11px;
}

input{
  width:100%;
  padding:16px;
  border-radius:15px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

input[type="file"]{
  padding:14px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.option{
  width:auto;
  margin:0;
  padding:12px 18px;
  border-radius:999px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#bfc2d8;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

.option:hover{
  color:#fff;
  border-color:#7b25ff;
}

.option.selected{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  box-shadow:0 5px 20px #6425ff55;
}

.selected-info{
  margin-top:13px;
  padding:13px 15px;
  border-radius:14px;
  border:1px solid #30355e;
  background:#080b1d;
  color:#9da2c0;
  font-size:13px;
  line-height:1.6;
}

.selected-info strong{
  color:#fff;
}

.main-button{
  width:100%;
  margin-top:15px;
  padding:17px;
  border:0;
  border-radius:18px;
  font-size:17px;
  font-weight:800;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(90deg,#7b25ff,#159df5);
}

.main-button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.logout{
  background:#242842;
}

.back{
  background:#171a31;
  border:1px solid #343b67;
}

.status{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  border:1px solid #385d55;
  color:#bfffe8;
  background:#101b2b;
  line-height:1.6;
}

.status.error{
  border-color:#8d4050;
  color:#ffd6dc;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:60px 0;
}

.file-info{
  color:#9da2c0;
  font-size:13px;
  margin-top:8px;
}

.progress{
  display:none;
  margin-top:18px;
  color:#aeb0c8;
  text-align:center;
}

.song-list{
  display:grid;
  gap:14px;
}

.song-item{
  background:#080b1d;
  border:1px solid #30355e;
  border-radius:20px;
  padding:20px;
}

.song-title{
  font-size:19px;
  font-weight:800;
}

.song-artist{
  margin-top:5px;
  color:#c5c8dd;
}

.song-meta{
  margin-top:8px;
  color:#8f95b5;
  font-size:13px;
  line-height:1.6;
}

.song-actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:16px;
}

.song-actions button{
  border:0;
  border-radius:13px;
  padding:12px 8px;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.play-small{
  background:#242842;
}

.edit-small{
  background:#24426b;
}

.delete-small{
  background:#672b3b;
}

.empty{
  text-align:center;
  color:#8f93ad;
  padding:28px 10px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:100;
  padding:20px;
  overflow:auto;
}

.modal.show{
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

.modal-box{
  width:min(700px,96vw);
  margin:40px 0;
  background:#101228;
  border:1px solid #30355e;
  border-radius:26px;
  padding:28px;
}

.modal-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:20px;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.cancel-button{
  background:#242842;
}


.cover-picker{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:16px;
  align-items:center;
}

.cover-preview{
  width:120px;
  aspect-ratio:1 / 1;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #353b67;
  background:linear-gradient(135deg,#171a31,#080b1d);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8f95b5;
  font-size:34px;
}

.cover-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.song-main{
  display:grid;
  grid-template-columns:88px 1fr;
  gap:15px;
  align-items:start;
}

.song-cover{
  width:88px;
  aspect-ratio:1 / 1;
  border-radius:15px;
  overflow:hidden;
  border:1px solid #30355e;
  background:linear-gradient(135deg,#171a31,#080b1d);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8f95b5;
  font-size:28px;
}

.song-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

@media(max-width:600px){
  .brand{
    font-size:34px;
  }

  .card{
    padding:23px;
  }

  .option{
    padding:11px 15px;
  }

  .song-actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    NovaRadio Artist Studio
  </div>

  <div class="sub">
    あなたの音楽をNovaRadioへ。
  </div>

  <div id="loading" class="loading">
    ログイン状態を確認しています…
  </div>

  <main id="dashboard" style="display:none">

    <section class="card">

      <h2>🎧 アカウント</h2>

      <div class="user">
        ユーザー名・アーティスト名：
        <strong id="displayName"></strong>
        <br>
        ログイン中：
        <span id="userEmail"></span>
      </div>

      <button
        class="main-button back"
        id="backHome"
        type="button"
      >
        ← NovaRadioに戻る
      </button>

      <button
        class="main-button logout"
        id="logout"
        type="button"
      >
        ログアウト
      </button>

    </section>

    <section class="card">

      <h2>🎵 曲をアップロード</h2>

      <div class="field">
        <label>曲名 *</label>
        <input
          id="songTitle"
          type="text"
          placeholder="曲名"
        >
      </div>

      <div class="field">
        <label>アーティスト名 *</label>
        <input
          id="artistName"
          type="text"
          placeholder="アーティスト名"
        >
      </div>

      <div class="field">

        <label>🎵 ジャンル *</label>

        <div
          class="options"
          id="genreOptions"
        >
          <button type="button" class="option" data-value="Hip Hop">Hip Hop</button>
          <button type="button" class="option" data-value="R&B">R&B</button>
          <button type="button" class="option" data-value="Pop">Pop</button>
          <button type="button" class="option" data-value="Trap">Trap</button>
          <button type="button" class="option" data-value="Rock">Rock</button>
          <button type="button" class="option" data-value="Lo-Fi">Lo-Fi</button>
          <button type="button" class="option" data-value="Electronic">Electronic</button>
          <button type="button" class="option" data-value="Pluggnb">Pluggnb</button>
          <button type="button" class="option" data-value="Other">Other</button>
        </div>

        <div
          class="selected-info"
          id="genreSelected"
        >
          <strong>選択中：</strong>
          まだ選択されていません
        </div>

      </div>

      <div class="field">

        <label>🌙 Mood</label>

        <div
          class="options"
          id="moodOptions"
        >
          <button type="button" class="option" data-value="Chill">Chill</button>
          <button type="button" class="option" data-value="Dark">Dark</button>
          <button type="button" class="option" data-value="Happy">Happy</button>
          <button type="button" class="option" data-value="Emotional">Emotional</button>
          <button type="button" class="option" data-value="Energetic">Energetic</button>
        </div>

        <div
          class="selected-info"
          id="moodSelected"
        >
          <strong>選択中：</strong>
          指定なし
        </div>

      </div>

      <div class="field">
        <label>BPM</label>
        <input
          id="bpm"
          type="number"
          placeholder="例：90"
        >
      </div>

      <div class="field">
        <label>Key</label>
        <input
          id="songKey"
          type="text"
          placeholder="例：B Major"
        >
      </div>

      <div class="field">
        <label>🖼️ ジャケット画像</label>

        <div class="cover-picker">
          <div
            class="cover-preview"
            id="coverPreview"
          >
            🎵
          </div>

          <div>
            <input
              id="coverFile"
              type="file"
              accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
            >
            <div class="file-info">
              JPEG / PNG / WebP ・ 最大5MB
            </div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>音源ファイル *</label>
        <input
          id="audioFile"
          type="file"
          accept=".wav,.mp3,audio/wav,audio/mpeg"
        >
        <div class="file-info">
          WAV / MP3
        </div>
      </div>

      <button
        class="main-button"
        id="upload"
        type="button"
      >
        🚀 NovaRadioにアップロード
      </button>

      <div
        id="progress"
        class="progress"
      >
        アップロードしています… 🎧
      </div>

      <div
        id="status"
        class="status"
      ></div>

    </section>

    <section class="card">

      <h2>📚 あなたの曲</h2>

      <div
        id="songList"
        class="song-list"
      >
        <div class="empty">
          曲を読み込んでいます…
        </div>
      </div>

    </section>

  </main>

</div>

<div
  class="modal"
  id="editModal"
>

  <div class="modal-box">

    <div class="modal-title">
      ✏️ 曲を編集
    </div>

    <input
      type="hidden"
      id="editSongId"
    >

    <div class="field">
      <label>曲名</label>
      <input
        id="editTitle"
        type="text"
      >
    </div>

    <div class="field">
      <label>アーティスト名</label>
      <input
        id="editArtist"
        type="text"
      >
    </div>

    <div class="field">
      <label>ジャンル</label>
      <input
        id="editGenre"
        type="text"
        placeholder="Hip Hop,R&B"
      >
      <div class="file-info">
        複数の場合はカンマ区切り
      </div>
    </div>

    <div class="field">
      <label>Mood</label>
      <input
        id="editMood"
        type="text"
        placeholder="Chill,Emotional"
      >
      <div class="file-info">
        複数の場合はカンマ区切り
      </div>
    </div>

    <div class="field">
      <label>BPM</label>
      <input
        id="editBpm"
        type="number"
      >
    </div>

    <div class="field">
      <label>Key</label>
      <input
        id="editKey"
        type="text"
      >
    </div>

    <div class="modal-actions">

      <button
        class="main-button cancel-button"
        id="cancelEdit"
        type="button"
      >
        キャンセル
      </button>

      <button
        class="main-button"
        id="saveEdit"
        type="button"
      >
        保存
      </button>

    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentSession = null;

const selectedGenres = [];
const selectedMoods = [];

const loading =
  document.getElementById("loading");

const dashboard =
  document.getElementById("dashboard");

const userEmail =
  document.getElementById("userEmail");

const displayName =
  document.getElementById("displayName");

const uploadButton =
  document.getElementById("upload");

const progress =
  document.getElementById("progress");

const songList =
  document.getElementById("songList");

const coverFile =
  document.getElementById("coverFile");

const coverPreview =
  document.getElementById("coverPreview");

const editModal =
  document.getElementById("editModal");

async function init(){

  const {
    data:{session},
    error
  } =
  await sb.auth.getSession();

  if(error){

    loading.textContent =
      "ログイン状態の確認に失敗しました。";

    console.error(error);

    return;

  }

  if(!session){

    location.href =
      "index.html";

    return;

  }

  currentSession =
    session;

  const name =
    session.user.user_metadata?.artist_name ||
    "";

  userEmail.textContent =
    session.user.email || "";

  displayName.textContent =
    name || "未設定";

  document
  .getElementById("artistName")
  .value =
    name;

  loading.style.display =
    "none";

  dashboard.style.display =
    "block";

  await loadMySongs();

}

init();

document
.querySelectorAll(
  "#genreOptions .option"
)
.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      toggleSelection(
        button,
        selectedGenres
      );

      updateSelectedText();

    }
  );

});

document
.querySelectorAll(
  "#moodOptions .option"
)
.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      toggleSelection(
        button,
        selectedMoods
      );

      updateSelectedText();

    }
  );

});

function toggleSelection(
  button,
  array
){

  const value =
    button.dataset.value;

  const index =
    array.indexOf(value);

  if(index === -1){

    array.push(value);

    button.classList.add(
      "selected"
    );

  }
  else{

    array.splice(
      index,
      1
    );

    button.classList.remove(
      "selected"
    );

  }

}

function updateSelectedText(){

  document
  .getElementById("genreSelected")
  .innerHTML =
    `<strong>選択中：</strong>${
      selectedGenres.length
        ? selectedGenres.join(" / ")
        : "まだ選択されていません"
    }`;

  document
  .getElementById("moodSelected")
  .innerHTML =
    `<strong>選択中：</strong>${
      selectedMoods.length
        ? selectedMoods.join(" / ")
        : "指定なし"
    }`;

}


coverFile.addEventListener(
  "change",
  ()=>{

    const file =
      coverFile.files[0];

    coverPreview.innerHTML = "";

    if(!file){
      coverPreview.textContent = "🎵";
      return;
    }

    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];

    if(!allowedTypes.includes(file.type)){
      coverFile.value = "";
      coverPreview.textContent = "🎵";

      showStatus(
        "ジャケット画像はJPEG / PNG / WebPを選択してください。",
        true
      );

      return;
    }

    if(file.size > 5 * 1024 * 1024){
      coverFile.value = "";
      coverPreview.textContent = "🎵";

      showStatus(
        "ジャケット画像は5MB以下にしてください。",
        true
      );

      return;
    }

    const img =
      document.createElement("img");

    img.alt =
      "ジャケットプレビュー";

    const objectUrl =
      URL.createObjectURL(file);

    img.src =
      objectUrl;

    img.onload = ()=>{
      URL.revokeObjectURL(objectUrl);
    };

    coverPreview.appendChild(img);

  }
);

uploadButton.addEventListener(
  "click",
  async ()=>{

    const title =
      document
      .getElementById("songTitle")
      .value
      .trim();

    const artist =
      document
      .getElementById("artistName")
      .value
      .trim();

    const bpmValue =
      document
      .getElementById("bpm")
      .value;

    const key =
      document
      .getElementById("songKey")
      .value
      .trim();

    const file =
      document
      .getElementById("audioFile")
      .files[0];

    const cover =
      coverFile.files[0] || null;

    if(!title){

      return showStatus(
        "曲名を入力してください。",
        true
      );

    }

    if(!artist){

      return showStatus(
        "アーティスト名を入力してください。",
        true
      );

    }

    if(!selectedGenres.length){

      return showStatus(
        "ジャンルを1つ以上選択してください。",
        true
      );

    }

    if(!file){

      return showStatus(
        "音源ファイルを選択してください。",
        true
      );

    }

    if(!currentSession){

      return showStatus(
        "ログイン情報を確認できません。",
        true
      );

    }

    if(cover){

      const allowedCoverTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      if(!allowedCoverTypes.includes(cover.type)){

        return showStatus(
          "ジャケット画像はJPEG / PNG / WebPを選択してください。",
          true
        );

      }

      if(cover.size > 5 * 1024 * 1024){

        return showStatus(
          "ジャケット画像は5MB以下にしてください。",
          true
        );

      }

    }

    uploadButton.disabled =
      true;

    progress.style.display =
      "block";

    hideStatus();

    try{

      const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();

      if(
        extension !== "wav" &&
        extension !== "mp3"
      ){

        throw new Error(
          "WAVまたはMP3を選択してください。"
        );

      }

      const safeFileName =
        `${currentSession.user.id}_${Date.now()}.${extension}`;

      const {
        data:uploadData,
        error:uploadError
      } =
      await sb
      .storage
      .from("songs")
      .upload(
        safeFileName,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:
            file.type ||
            (
              extension === "mp3"
                ? "audio/mpeg"
                : "audio/wav"
            )
        }
      );

      if(uploadError){

        throw new Error(
          "音源アップロード失敗：" +
          uploadError.message
        );

      }

      const {
        data:publicUrlData
      } =
      sb
      .storage
      .from("songs")
      .getPublicUrl(
        uploadData.path
      );

      const audioUrl =
        publicUrlData.publicUrl;

      let coverUrl = null;

      if(cover){

        const coverExtension =
          cover.name
          .split(".")
          .pop()
          .toLowerCase();

        const safeCoverName =
          `${currentSession.user.id}_${Date.now()}_${crypto.randomUUID()}.${coverExtension}`;

        const {
          data:coverUploadData,
          error:coverUploadError
        } =
        await sb
        .storage
        .from("covers")
        .upload(
          safeCoverName,
          cover,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:cover.type
          }
        );

        if(coverUploadError){

          throw new Error(
            "ジャケット画像アップロード失敗：" +
            coverUploadError.message
          );

        }

        const {
          data:coverPublicUrlData
        } =
        sb
        .storage
        .from("covers")
        .getPublicUrl(
          coverUploadData.path
        );

        coverUrl =
          coverPublicUrlData.publicUrl;

      }

      const songData = {

        title:title,

        artist:artist,

        genre:
          selectedGenres.join(","),

        mood:
          selectedMoods.length
            ? selectedMoods.join(",")
            : null,

        bpm:
          bpmValue
            ? Number(bpmValue)
            : null,

        key:
          key || null,

        audio_url:
          audioUrl,

        cover_url:
          coverUrl,

        user_id:
          currentSession.user.id

      };

      const {
        error:databaseError
      } =
      await sb
      .from("songs")
      .insert(songData);

      if(databaseError){

        throw new Error(
          "曲情報の登録失敗：" +
          databaseError.message
        );

      }

      showStatus(
        "アップロード完了！🔥 NovaRadioに曲が登録されました。",
        false
      );

      resetUploadForm();

      await loadMySongs();

    }
    catch(error){

      console.error(error);

      showStatus(
        error.message ||
        "アップロード中にエラーが発生しました。",
        true
      );

    }
    finally{

      uploadButton.disabled =
        false;

      progress.style.display =
        "none";

    }

  }
);

async function loadMySongs(){

  if(!currentSession){
    return;
  }

  songList.innerHTML =
    '<div class="empty">曲を読み込んでいます…</div>';

  const {
    data,
    error
  } =
  await sb
  .from("songs")
  .select("*")
  .eq(
    "user_id",
    currentSession.user.id
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );

  if(error){

    songList.innerHTML =
      `<div class="empty">
        曲一覧を取得できませんでした。<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;

  }

  if(
    !data ||
    !data.length
  ){

    songList.innerHTML =
      '<div class="empty">まだあなたがアップロードした曲はありません。</div>';

    return;

  }

  songList.innerHTML =
    "";

  data.forEach(song=>{

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "song-item";

    item.innerHTML =
      `<div class="song-main">

        <div class="song-cover">
          ${
            song.cover_url
              ? `<img
                  src="${escapeHtml(song.cover_url)}"
                  alt="${escapeHtml(song.title || "ジャケット")}"
                >`
              : "🎵"
          }
        </div>

        <div>
          <div class="song-title">
            ${escapeHtml(song.title || "Untitled")}
          </div>

          <div class="song-artist">
            ${escapeHtml(song.artist || "")}
          </div>

          <div class="song-meta">
            ${escapeHtml(formatTags(song.genre))}
            ${
              song.mood
                ? " · " +
                  escapeHtml(formatTags(song.mood))
                : ""
            }
            ${
              song.bpm
                ? " · " +
                  song.bpm +
                  " BPM"
                : ""
            }
            ${
              song.key
                ? " · " +
                  escapeHtml(song.key)
                : ""
            }
          </div>
        </div>

      </div>

      <div class="song-actions">
        <button type="button" class="play-small">
          ▶️ 再生
        </button>

        <button type="button" class="edit-small">
          ✏️ 編集
        </button>

        <button type="button" class="delete-small">
          🗑️ 削除
        </button>
      </div>`;

    item
    .querySelector(
      ".play-small"
    )
    .addEventListener(
      "click",
      ()=>{

        playManagedSong(
          song,
          item
        );

      }
    );

    item
    .querySelector(
      ".edit-small"
    )
    .addEventListener(
      "click",
      ()=>{

        openEditModal(
          song
        );

      }
    );

    item
    .querySelector(
      ".delete-small"
    )
    .addEventListener(
      "click",
      ()=>{

        deleteSong(
          song
        );

      }
    );

    songList.appendChild(
      item
    );

  });

}

function playManagedSong(
  song,
  item
){

  const old =
    item.querySelector(
      "audio"
    );

  if(old){

    old.remove();

    return;

  }

  if(!song.audio_url){

    alert(
      "この曲には音源URLが登録されていません。"
    );

    return;

  }

  const audio =
    document.createElement(
      "audio"
    );

  audio.controls =
    true;

  audio.autoplay =
    true;

  audio.src =
    song.audio_url;

  audio.style.width =
    "100%";

  audio.style.marginTop =
    "15px";

  item.appendChild(
    audio
  );

  audio.play().catch(
    ()=>{}
  );

}

function openEditModal(
  song
){

  document
  .getElementById("editSongId")
  .value =
    song.id;

  document
  .getElementById("editTitle")
  .value =
    song.title || "";

  document
  .getElementById("editArtist")
  .value =
    song.artist || "";

  document
  .getElementById("editGenre")
  .value =
    song.genre || "";

  document
  .getElementById("editMood")
  .value =
    song.mood || "";

  document
  .getElementById("editBpm")
  .value =
    song.bpm || "";

  document
  .getElementById("editKey")
  .value =
    song.key || "";

  editModal.classList.add(
    "show"
  );

}

document
.getElementById("cancelEdit")
.addEventListener(
  "click",
  ()=>{

    editModal.classList.remove(
      "show"
    );

  }
);

document
.getElementById("saveEdit")
.addEventListener(
  "click",
  async ()=>{

    if(!currentSession){

      alert(
        "ログイン情報を確認できません。"
      );

      return;

    }

    const id =
      document
      .getElementById("editSongId")
      .value;

    const title =
      document
      .getElementById("editTitle")
      .value
      .trim();

    const artist =
      document
      .getElementById("editArtist")
      .value
      .trim();

    const genre =
      document
      .getElementById("editGenre")
      .value
      .trim();

    const mood =
      document
      .getElementById("editMood")
      .value
      .trim();

    const bpm =
      document
      .getElementById("editBpm")
      .value;

    const key =
      document
      .getElementById("editKey")
      .value
      .trim();

    if(
      !title ||
      !artist ||
      !genre
    ){

      alert(
        "曲名・アーティスト名・ジャンルは必須です。"
      );

      return;

    }

    const {
      error
    } =
    await sb
    .from("songs")
    .update({

      title:title,

      artist:artist,

      genre:genre,

      mood:
        mood || null,

      bpm:
        bpm
          ? Number(bpm)
          : null,

      key:
        key || null

    })
    .eq(
      "id",
      id
    )
    .eq(
      "user_id",
      currentSession.user.id
    );

    if(error){

      alert(
        "編集に失敗しました：" +
        error.message
      );

      return;

    }

    editModal.classList.remove(
      "show"
    );

    await loadMySongs();

  }
);

async function deleteSong(
  song
){

  if(!currentSession){

    alert(
      "ログイン情報を確認できません。"
    );

    return;

  }

  const ok =
    confirm(
      `「${song.title}」を削除しますか？`
    );

  if(!ok){
    return;
  }

  const {
    error
  } =
  await sb
  .from("songs")
  .delete()
  .eq(
    "id",
    song.id
  )
  .eq(
    "user_id",
    currentSession.user.id
  );

  if(error){

    alert(
      "削除に失敗しました：" +
      error.message
    );

    return;

  }

  await loadMySongs();

}

function resetUploadForm(){

  document
  .getElementById("songTitle")
  .value =
    "";

  document
  .getElementById("bpm")
  .value =
    "";

  document
  .getElementById("songKey")
  .value =
    "";

  document
  .getElementById("audioFile")
  .value =
    "";

  coverFile.value =
    "";

  coverPreview.innerHTML =
    "";

  coverPreview.textContent =
    "🎵";

  selectedGenres.length =
    0;

  selectedMoods.length =
    0;

  document
  .querySelectorAll(
    "#genreOptions .option, #moodOptions .option"
  )
  .forEach(button=>{

    button.classList.remove(
      "selected"
    );

  });

  updateSelectedText();

}

function showStatus(
  message,
  isError
){

  const status =
    document.getElementById(
      "status"
    );

  status.textContent =
    message;

  status.style.display =
    "block";

  if(isError){

    status.classList.add(
      "error"
    );

  }
  else{

    status.classList.remove(
      "error"
    );

  }

}

function hideStatus(){

  document
  .getElementById("status")
  .style.display =
    "none";

}

function formatTags(
  value
){

  if(!value){
    return "";
  }

  return value
    .split(",")
    .map(v=>v.trim())
    .filter(Boolean)
    .join(" / ");

}

function escapeHtml(
  value
){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

document
.getElementById("backHome")
.addEventListener(
  "click",
  ()=>{

    location.href =
      "home.html";

  }
);

document
.getElementById("logout")
.addEventListener(
  "click",
  async ()=>{

    await sb.auth.signOut();

    location.href =
      "index.html";

  }
);

</script>
