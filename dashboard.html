<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio - Artist Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0,#211b50,#080a18 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(900px,94vw);
  margin:auto;
  padding:45px 0 80px;
}

.brand{
  text-align:center;
  font-size:42px;
  font-weight:800;
  margin-bottom:8px;
}

.sub{
  text-align:center;
  color:#aeb0c8;
  margin-bottom:35px;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
  margin-bottom:24px;
}

h2{
  margin-top:0;
  font-size:24px;
}

.user{
  color:#aeb0c8;
  margin-bottom:20px;
}

.field{
  margin:24px 0;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:11px;
}

input{
  width:100%;
  padding:16px;
  border-radius:15px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

input[type="file"]{
  padding:14px;
}


/* 複数選択ボタン */

.options{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.option{
  width:auto;
  margin:0;
  padding:12px 18px;
  border-radius:999px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#bfc2d8;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

.option:hover{
  color:#fff;
  border-color:#7b25ff;
}

.option.selected{
  color:#fff;
  border-color:transparent;
  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );

  box-shadow:
    0 5px 20px #6425ff55;
}

.selected-info{
  margin-top:13px;
  padding:13px 15px;
  border-radius:14px;
  border:1px solid #30355e;
  background:#080b1d;
  color:#9da2c0;
  font-size:13px;
  line-height:1.6;
}

.selected-info strong{
  color:#fff;
}


/* 通常ボタン */

.main-button{
  width:100%;
  margin-top:15px;
  padding:17px;
  border:0;
  border-radius:18px;
  font-size:17px;
  font-weight:800;
  color:#fff;
  cursor:pointer;
  background:
    linear-gradient(
      90deg,
      #7b25ff,
      #159df5
    );
}

.main-button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.logout{
  background:#242842;
}

.back{
  background:#171a31;
  border:1px solid #343b67;
}

.status{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  border:1px solid #385d55;
  color:#bfffe8;
  background:#101b2b;
  line-height:1.6;
}

.status.error{
  border-color:#8d4050;
  color:#ffd6dc;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:60px 0;
}

.file-info{
  color:#9da2c0;
  font-size:13px;
  margin-top:8px;
}

.progress{
  display:none;
  margin-top:18px;
  color:#aeb0c8;
  text-align:center;
}

@media(max-width:600px){

  .brand{
    font-size:34px;
  }

  .card{
    padding:23px;
  }

  .option{
    padding:11px 15px;
  }

}
</style>
</head>


<body>

<div class="wrap">

  <div class="brand">
    NovaRadio Artist Studio
  </div>

  <div class="sub">
    あなたの音楽をNovaRadioへ。
  </div>


  <div id="loading" class="loading">
    ログイン状態を確認しています…
  </div>


  <main id="dashboard" style="display:none">


    <!-- アカウント -->

    <section class="card">

      <h2>🎧 アカウント</h2>

      <div class="user">
        ログイン中：
        <span id="userEmail"></span>
      </div>

      <button
        class="main-button back"
        id="backHome"
        type="button"
      >
        ← NovaRadioに戻る
      </button>

      <button
        class="main-button logout"
        id="logout"
        type="button"
      >
        ログアウト
      </button>

    </section>


    <!-- 曲アップロード -->

    <section class="card">

      <h2>🎵 曲をアップロード</h2>


      <!-- 曲名 -->

      <div class="field">

        <label>
          曲名 *
        </label>

        <input
          id="songTitle"
          type="text"
          placeholder="例：world feat.BOY MELO WORLD"
        >

      </div>


      <!-- アーティスト -->

      <div class="field">

        <label>
          アーティスト名 *
        </label>

        <input
          id="artistName"
          type="text"
          value="Dr.SIG"
          placeholder="アーティスト名"
        >

      </div>


      <!-- ジャンル -->

      <div class="field">

        <label>
          🎵 ジャンル *
        </label>

        <div
          class="options"
          id="genreOptions"
        >

          <button
            type="button"
            class="option"
            data-value="Hip Hop"
          >
            Hip Hop
          </button>

          <button
            type="button"
            class="option"
            data-value="R&B"
          >
            R&B
          </button>

          <button
            type="button"
            class="option"
            data-value="Pop"
          >
            Pop
          </button>

          <button
            type="button"
            class="option"
            data-value="Trap"
          >
            Trap
          </button>

          <button
            type="button"
            class="option"
            data-value="Rock"
          >
            Rock
          </button>

          <button
            type="button"
            class="option"
            data-value="Lo-Fi"
          >
            Lo-Fi
          </button>

          <button
            type="button"
            class="option"
            data-value="Electronic"
          >
            Electronic
          </button>

          <button
            type="button"
            class="option"
            data-value="Pluggnb"
          >
            Pluggnb
          </button>

          <button
            type="button"
            class="option"
            data-value="Other"
          >
            Other
          </button>

        </div>


        <div
          class="selected-info"
          id="genreSelected"
        >
          <strong>選択中：</strong>
          まだ選択されていません
        </div>

      </div>


      <!-- Mood -->

      <div class="field">

        <label>
          🌙 Mood
        </label>

        <div
          class="options"
          id="moodOptions"
        >

          <button
            type="button"
            class="option"
            data-value="Chill"
          >
            Chill
          </button>

          <button
            type="button"
            class="option"
            data-value="Dark"
          >
            Dark
          </button>

          <button
            type="button"
            class="option"
            data-value="Happy"
          >
            Happy
          </button>

          <button
            type="button"
            class="option"
            data-value="Emotional"
          >
            Emotional
          </button>

          <button
            type="button"
            class="option"
            data-value="Energetic"
          >
            Energetic
          </button>

        </div>


        <div
          class="selected-info"
          id="moodSelected"
        >
          <strong>選択中：</strong>
          指定なし
        </div>

      </div>


      <!-- BPM -->

      <div class="field">

        <label>
          BPM
        </label>

        <input
          id="bpm"
          type="number"
          placeholder="例：90"
        >

      </div>


      <!-- Key -->

      <div class="field">

        <label>
          Key
        </label>

        <input
          id="songKey"
          type="text"
          placeholder="例：B Major"
        >

      </div>


      <!-- 音源 -->

      <div class="field">

        <label>
          音源ファイル *
        </label>

        <input
          id="audioFile"
          type="file"
          accept=".wav,.mp3,audio/wav,audio/mpeg"
        >

        <div class="file-info">
          WAV / MP3
        </div>

      </div>


      <button
        class="main-button"
        id="upload"
        type="button"
      >
        🚀 NovaRadioにアップロード
      </button>


      <div
        id="progress"
        class="progress"
      >
        アップロードしています… 🎧
      </div>


      <div
        id="status"
        class="status"
      ></div>

    </section>

  </main>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";


const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ELEMENTS
========================= */

const loading =
  document.getElementById("loading");

const dashboard =
  document.getElementById("dashboard");

const userEmail =
  document.getElementById("userEmail");

const uploadButton =
  document.getElementById("upload");

const progress =
  document.getElementById("progress");


/* =========================
   MULTI SELECT
========================= */

const selectedGenres = [];
const selectedMoods = [];


/* ジャンル */

document
.querySelectorAll(
  "#genreOptions .option"
)
.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      toggleSelection(
        button,
        selectedGenres
      );

      updateSelectedText();

    }
  );

});


/* Mood */

document
.querySelectorAll(
  "#moodOptions .option"
)
.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      toggleSelection(
        button,
        selectedMoods
      );

      updateSelectedText();

    }
  );

});


function toggleSelection(
  button,
  array
){

  const value =
    button.dataset.value;


  const index =
    array.indexOf(value);


  if(index === -1){

    array.push(value);

    button.classList.add(
      "selected"
    );

  }
  else{

    array.splice(
      index,
      1
    );

    button.classList.remove(
      "selected"
    );

  }

}


function updateSelectedText(){

  const genreBox =
    document.getElementById(
      "genreSelected"
    );


  const moodBox =
    document.getElementById(
      "moodSelected"
    );


  genreBox.innerHTML = `

    <strong>選択中：</strong>

    ${
      selectedGenres.length
        ? selectedGenres.join(" / ")
        : "まだ選択されていません"
    }

  `;


  moodBox.innerHTML = `

    <strong>選択中：</strong>

    ${
      selectedMoods.length
        ? selectedMoods.join(" / ")
        : "指定なし"
    }

  `;

}


/* =========================
   LOGIN
========================= */

async function init(){

  const {
    data:{session},
    error
  } =
  await sb.auth.getSession();


  if(error){

    loading.textContent =
      "ログイン状態の確認に失敗しました。";

    console.error(error);

    return;

  }


  if(!session){

    loading.textContent =
      "ログインしていません。ログイン画面へ戻ります…";


    setTimeout(()=>{

      location.href =
        "index.html";

    },1200);


    return;

  }


  userEmail.textContent =
    session.user.email || "";


  loading.style.display =
    "none";


  dashboard.style.display =
    "block";

}

init();


/* =========================
   UPLOAD
========================= */

uploadButton.addEventListener(
  "click",
  async ()=>{


    const title =
      document
      .getElementById("songTitle")
      .value
      .trim();


    const artist =
      document
      .getElementById("artistName")
      .value
      .trim();


    const bpmValue =
      document
      .getElementById("bpm")
      .value;


    const key =
      document
      .getElementById("songKey")
      .value
      .trim();


    const file =
      document
      .getElementById("audioFile")
      .files[0];


    /* =========================
       VALIDATION
    ========================= */

    if(!title){

      showStatus(
        "曲名を入力してください。",
        true
      );

      return;

    }


    if(!artist){

      showStatus(
        "アーティスト名を入力してください。",
        true
      );

      return;

    }


    if(!selectedGenres.length){

      showStatus(
        "ジャンルを1つ以上選択してください。",
        true
      );

      return;

    }


    if(!file){

      showStatus(
        "音源ファイルを選択してください。",
        true
      );

      return;

    }


    /* =========================
       SESSION
    ========================= */

    const {
      data:{session}
    } =
    await sb.auth.getSession();


    if(!session){

      showStatus(
        "ログイン情報が確認できません。",
        true
      );

      return;

    }


    uploadButton.disabled =
      true;


    progress.style.display =
      "block";


    hideStatus();


    try{


      /* =========================
         FILE NAME
      ========================= */

      const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


      if(
        extension !== "wav" &&
        extension !== "mp3"
      ){

        throw new Error(
          "WAVまたはMP3を選択してください。"
        );

      }


      const safeFileName =
        `${session.user.id}_${Date.now()}.${extension}`;


      /* =========================
         STORAGE
      ========================= */

      const {
        data:uploadData,
        error:uploadError
      } =
      await sb
      .storage
      .from("songs")
      .upload(
        safeFileName,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:
            file.type ||
            (
              extension === "mp3"
                ? "audio/mpeg"
                : "audio/wav"
            )
        }
      );


      if(uploadError){

        throw new Error(
          "音源アップロード失敗：" +
          uploadError.message
        );

      }


      /* =========================
         PUBLIC URL
      ========================= */

      const {
        data:publicUrlData
      } =
      sb
      .storage
      .from("songs")
      .getPublicUrl(
        uploadData.path
      );


      const audioUrl =
        publicUrlData.publicUrl;


      /* =========================
         複数ジャンル/Moodを保存
      ========================= */

      const genreValue =
        selectedGenres.join(",");


      const moodValue =
        selectedMoods.length
          ? selectedMoods.join(",")
          : null;


      /* =========================
         DATABASE
      ========================= */

      const songData = {

        title:title,

        artist:artist,

        genre:
          genreValue,

        mood:
          moodValue,

        bpm:
          bpmValue
            ? Number(bpmValue)
            : null,

        key:
          key || null,

        audio_url:
          audioUrl

      };


      const {
        error:databaseError
      } =
      await sb
      .from("songs")
      .insert(songData);


      if(databaseError){

        throw new Error(
          "曲情報の登録失敗：" +
          databaseError.message
        );

      }


      /* =========================
         SUCCESS
      ========================= */

      showStatus(
        "アップロード完了！🔥 NovaRadioに曲が登録されました。",
        false
      );


      resetForm();


    }
    catch(error){

      console.error(error);


      showStatus(
        error.message ||
        "アップロード中にエラーが発生しました。",
        true
      );

    }
    finally{

      uploadButton.disabled =
        false;


      progress.style.display =
        "none";

    }

  }
);


/* =========================
   RESET
========================= */

function resetForm(){

  document
  .getElementById("songTitle")
  .value = "";


  document
  .getElementById("bpm")
  .value = "";


  document
  .getElementById("songKey")
  .value = "";


  document
  .getElementById("audioFile")
  .value = "";


  selectedGenres.length = 0;
  selectedMoods.length = 0;


  document
  .querySelectorAll(".option")
  .forEach(button=>{

    button.classList.remove(
      "selected"
    );

  });


  updateSelectedText();

}


/* =========================
   STATUS
========================= */

function showStatus(
  message,
  isError
){

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.style.display =
    "block";


  if(isError){

    status
    .classList
    .add("error");

  }
  else{

    status
    .classList
    .remove("error");

  }

}


function hideStatus(){

  document
  .getElementById("status")
  .style
  .display = "none";

}


/* =========================
   BACK
========================= */

document
.getElementById("backHome")
.addEventListener(
  "click",
  ()=>{

    location.href =
      "home.html";

  }
);


/* =========================
   LOGOUT
========================= */

document
.getElementById("logout")
.addEventListener(
  "click",
  async ()=>{

    await sb.auth.signOut();

    location.href =
      "index.html";

  }
);

</script>

</body>
</html>
