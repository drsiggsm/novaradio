<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio - Artist Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0,#211b50,#080a18 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(900px,94vw);
  margin:auto;
  padding:45px 0 80px;
}

.brand{
  text-align:center;
  font-size:42px;
  font-weight:800;
  margin-bottom:8px;
}

.sub{
  text-align:center;
  color:#aeb0c8;
  margin-bottom:35px;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
  margin-bottom:24px;
}

h2{
  margin-top:0;
  font-size:24px;
}

.user{
  color:#aeb0c8;
  margin-bottom:20px;
}

.field{
  margin:20px 0;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

input,
select{
  width:100%;
  padding:16px;
  border-radius:15px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

input[type="file"]{
  padding:14px;
}

button{
  width:100%;
  margin-top:15px;
  padding:17px;
  border:0;
  border-radius:18px;
  font-size:17px;
  font-weight:800;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(90deg,#7b25ff,#159df5);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.logout{
  background:#242842;
}

.back{
  background:#171a31;
  border:1px solid #343b67;
}

.status{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  border:1px solid #385d55;
  color:#bfffe8;
  background:#101b2b;
  line-height:1.6;
}

.status.error{
  border-color:#8d4050;
  color:#ffd6dc;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:60px 0;
}

.file-info{
  color:#9da2c0;
  font-size:13px;
  margin-top:8px;
}

.progress{
  display:none;
  margin-top:18px;
  color:#aeb0c8;
  text-align:center;
}

@media(max-width:600px){

  .brand{
    font-size:34px;
  }

  .card{
    padding:23px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">NovaRadio Artist Studio</div>

  <div class="sub">
    あなたの音楽をNovaRadioへ。
  </div>


  <div id="loading" class="loading">
    ログイン状態を確認しています…
  </div>


  <main id="dashboard" style="display:none">


    <!-- アカウント -->

    <section class="card">

      <h2>🎧 アカウント</h2>

      <div class="user">
        ログイン中：
        <span id="userEmail"></span>
      </div>

      <button class="back" id="backHome">
        ← NovaRadioに戻る
      </button>

      <button class="logout" id="logout">
        ログアウト
      </button>

    </section>


    <!-- 曲アップロード -->

    <section class="card">

      <h2>🎵 曲をアップロード</h2>


      <div class="field">

        <label>曲名 *</label>

        <input
          id="songTitle"
          type="text"
          placeholder="例：world feat.BOY MELO WORLD"
        >

      </div>


      <div class="field">

        <label>アーティスト名 *</label>

        <input
          id="artistName"
          type="text"
          value="Dr.SIG"
          placeholder="アーティスト名"
        >

      </div>


      <div class="field">

        <label>ジャンル *</label>

        <select id="genre">

          <option value="">
            選択してください
          </option>

          <option value="Hip Hop">
            Hip Hop
          </option>

          <option value="R&B">
            R&B
          </option>

          <option value="Pop">
            Pop
          </option>

          <option value="Trap">
            Trap
          </option>

          <option value="Rock">
            Rock
          </option>

          <option value="Lo-Fi">
            Lo-Fi
          </option>

          <option value="Electronic">
            Electronic
          </option>

          <option value="Pluggnb">
            Pluggnb
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <div class="field">

        <label>Mood</label>

        <select id="mood">

          <option value="">
            指定なし
          </option>

          <option value="Chill">
            Chill
          </option>

          <option value="Dark">
            Dark
          </option>

          <option value="Happy">
            Happy
          </option>

          <option value="Emotional">
            Emotional
          </option>

          <option value="Energetic">
            Energetic
          </option>

        </select>

      </div>


      <div class="field">

        <label>BPM</label>

        <input
          id="bpm"
          type="number"
          placeholder="例：90"
        >

      </div>


      <div class="field">

        <label>Key</label>

        <input
          id="songKey"
          type="text"
          placeholder="例：B Major"
        >

      </div>


      <div class="field">

        <label>音源ファイル *</label>

        <input
          id="audioFile"
          type="file"
          accept=".wav,.mp3,audio/wav,audio/mpeg"
        >

        <div class="file-info">
          WAV / MP3
        </div>

      </div>


      <button id="upload">
        🚀 NovaRadioにアップロード
      </button>


      <div
        id="progress"
        class="progress"
      >
        アップロードしています… 🎧
      </div>


      <div
        id="status"
        class="status"
      ></div>

    </section>

  </main>

</div>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";


const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   Elements
========================= */

const loading =
  document.getElementById("loading");

const dashboard =
  document.getElementById("dashboard");

const userEmail =
  document.getElementById("userEmail");

const uploadButton =
  document.getElementById("upload");

const progress =
  document.getElementById("progress");


/* =========================
   Login
========================= */

async function init(){

  const {
    data:{session},
    error
  } = await sb.auth.getSession();


  if(error){

    loading.textContent =
      "ログイン状態の確認に失敗しました。";

    console.error(error);

    return;
  }


  if(!session){

    loading.textContent =
      "ログインしていません。ログイン画面へ戻ります…";

    setTimeout(()=>{

      location.href="index.html";

    },1200);

    return;
  }


  userEmail.textContent =
    session.user.email || "";


  loading.style.display="none";

  dashboard.style.display="block";

}

init();


/* =========================
   Upload
========================= */

uploadButton.addEventListener(
  "click",
  async ()=>{


    const title =
      document
      .getElementById("songTitle")
      .value
      .trim();


    const artist =
      document
      .getElementById("artistName")
      .value
      .trim();


    const genre =
      document
      .getElementById("genre")
      .value;


    const mood =
      document
      .getElementById("mood")
      .value;


    const bpmValue =
      document
      .getElementById("bpm")
      .value;


    const key =
      document
      .getElementById("songKey")
      .value
      .trim();


    const file =
      document
      .getElementById("audioFile")
      .files[0];


    /* Validation */

    if(!title){

      showStatus(
        "曲名を入力してください。",
        true
      );

      return;
    }


    if(!artist){

      showStatus(
        "アーティスト名を入力してください。",
        true
      );

      return;
    }


    if(!genre){

      showStatus(
        "ジャンルを選択してください。",
        true
      );

      return;
    }


    if(!file){

      showStatus(
        "音源ファイルを選択してください。",
        true
      );

      return;
    }


    /* Login check */

    const {
      data:{session}
    } = await sb.auth.getSession();


    if(!session){

      showStatus(
        "ログイン情報が確認できません。",
        true
      );

      return;
    }


    uploadButton.disabled=true;

    progress.style.display="block";

    hideStatus();


    try{


      /* =========================
         Safe filename
      ========================= */

      const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


      const safeFileName =
        `${session.user.id}_${Date.now()}.${extension}`;


      /* =========================
         Storage Upload
      ========================= */

      const {
        data:uploadData,
        error:uploadError
      } =
      await sb
      .storage
      .from("songs")
      .upload(
        safeFileName,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:file.type
        }
      );


      if(uploadError){

        throw new Error(
          "音源アップロード失敗："+
          uploadError.message
        );

      }


      /* =========================
         Public URL
      ========================= */

      const {
        data:publicUrlData
      } =
      sb
      .storage
      .from("songs")
      .getPublicUrl(
        uploadData.path
      );


      const audioUrl =
        publicUrlData.publicUrl;


      /* =========================
         Database
      ========================= */

      const songData = {

        title:title,

        artist:artist,

        genre:genre,

        mood:
          mood || null,

        bpm:
          bpmValue
            ? Number(bpmValue)
            : null,

        key:
          key || null,

        audio_url:
          audioUrl

      };


      const {
        error:databaseError
      } =
      await sb
      .from("songs")
      .insert(songData);


      if(databaseError){

        /*
        DB登録に失敗した場合、
        Storageに残ったファイルを削除する
        */

        await sb
        .storage
        .from("songs")
        .remove([
          uploadData.path
        ]);


        throw new Error(
          "曲情報の登録失敗："+
          databaseError.message
        );

      }


      /* =========================
         Success
      ========================= */

      showStatus(
        "アップロード完了！🔥 NovaRadioに曲が登録されました。",
        false
      );


      document
      .getElementById("songTitle")
      .value="";


      document
      .getElementById("bpm")
      .value="";


      document
      .getElementById("songKey")
      .value="";


      document
      .getElementById("audioFile")
      .value="";


    }
    catch(error){

      console.error(error);

      showStatus(
        error.message ||
        "アップロード中にエラーが発生しました。",
        true
      );

    }
    finally{

      uploadButton.disabled=false;

      progress.style.display="none";

    }

  }
);


/* =========================
   Status
========================= */

function showStatus(
  message,
  isError
){

  const status =
    document.getElementById("status");


  status.textContent =
    message;


  status.style.display =
    "block";


  if(isError){

    status
    .classList
    .add("error");

  }
  else{

    status
    .classList
    .remove("error");

  }

}


function hideStatus(){

  document
  .getElementById("status")
  .style
  .display="none";

}


/* =========================
   Back
========================= */

document
.getElementById("backHome")
.addEventListener(
  "click",
  ()=>{

    location.href="home.html";

  }
);


/* =========================
   Logout
========================= */

document
.getElementById("logout")
.addEventListener(
  "click",
  async ()=>{

    await sb.auth.signOut();

    location.href="index.html";

  }
);

</script>

</body>
</html>
