<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio - Artist</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at 50% 0,#211b50,#080a18 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(980px,94vw);
  margin:auto;
  padding:40px 0 90px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:34px;
}

.logo{
  font-size:32px;
  font-weight:800;
}

.back{
  color:#fff;
  text-decoration:none;
  padding:11px 16px;
  background:#101228;
  border:1px solid #343b67;
  border-radius:14px;
}

.profile{
  text-align:center;
  padding:42px 24px;
  margin-bottom:24px;
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
}

.avatar{
  width:120px;
  height:120px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  overflow:hidden;
  background:linear-gradient(135deg,#7b25ff,#159df5);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.artist-name{
  margin-top:18px;
  font-size:32px;
  font-weight:800;
}

.artist-name-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

.artist-name-row .artist-name{
  margin-top:0;
}

.pro-badge{
  display:none;
  align-items:center;
  justify-content:center;
  padding:5px 10px;
  border-radius:999px;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border:1px solid #9d67ff;
  color:#fff;
  font-size:12px;
  font-weight:900;
  letter-spacing:.4px;
  box-shadow:0 0 18px #6f38ff55;
}

.pro-badge.show{ display:inline-flex; }

.bio{
  max-width:620px;
  margin:14px auto 0;
  color:#aeb0c8;
  line-height:1.7;
  white-space:pre-wrap;
}

.links{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  margin-top:18px;
}

.link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 14px;
  border-radius:999px;
  border:1px solid #343b67;
  background:#171a31;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.link:hover{
  border-color:#7b25ff;
}

.follow-area{
  display:flex;
  justify-content:center;
  margin-top:18px;
}

.follow-button{
  min-width:160px;
  padding:12px 20px;
  border-radius:999px;
  border:1px solid #5a61a0;
  background:#171a31;
  color:#fff;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  transition:.18s ease;
}

.follow-button:hover{
  border-color:#8c55ff;
  transform:translateY(-1px);
}

.follow-button.following{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border-color:#8f68ff;
}

.follow-button:disabled{
  opacity:.65;
  cursor:default;
  transform:none;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:24px;
  padding:25px;
  margin-bottom:18px;
}

.card h2{
  margin:0 0 18px;
  font-size:22px;
}

.song-list{
  display:grid;
  gap:12px;
}

.song{
  padding:18px;
  border-radius:18px;
  background:#080b1d;
  border:1px solid #30355e;
}


.song-main{
  display:grid;
  grid-template-columns:92px 1fr;
  gap:16px;
  align-items:center;
}

.song-cover{
  width:92px;
  height:92px;
  border-radius:16px;
  overflow:hidden;
  border:1px solid #30355e;
  background:linear-gradient(135deg,#171a31,#080b1d);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8f95b5;
  font-size:30px;
}

.song-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.song-title{
  font-size:18px;
  font-weight:800;
}

.song-meta{
  margin-top:7px;
  font-size:13px;
  color:#858baa;
}

.song-buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.song-buttons button{
  padding:12px;
  border:0;
  border-radius:13px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.play-song{
  background:#242842;
}

.like-song{
  background:#171325;
  border:1px solid #4a3558 !important;
}

.like-song.liked{
  background:#542237;
  border-color:#a34b6a !important;
}

.playlist-song{
  background:#17223a;
  border:1px solid #35527a !important;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  z-index:100;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(520px,95vw);
  max-height:82vh;
  overflow:auto;
  background:#101228;
  border:1px solid #30355e;
  border-radius:24px;
  padding:25px;
}

.modal-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:18px;
}

.playlist-list{
  display:grid;
  gap:10px;
}

.playlist-choice{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #343b67;
  background:#080b1d;
  color:#fff;
  text-align:left;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.playlist-choice:hover{
  border-color:#7b25ff;
}

.new-playlist-button{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:14px;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.modal-close{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#242842;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.create-area{
  display:none;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid #30355e;
}

.create-area.show{
  display:block;
}

.create-input{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

.create-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.create-buttons button{
  padding:13px;
  border:0;
  border-radius:13px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.cancel-create{
  background:#242842;
}

.save-create{
  background:linear-gradient(90deg,#7b25ff,#159df5);
}

.song-audio{
  width:100%;
  margin-top:14px;
}

.empty,
.loading{
  padding:28px;
  text-align:center;
  color:#8f93ad;
}

.error{
  padding:20px;
  border-radius:16px;
  background:#351c28;
  border:1px solid #633846;
  color:#ffd7e5;
  text-align:center;
}

@media(max-width:600px){

  .logo{
    font-size:27px;
  }

  .artist-name{
    font-size:27px;
  }

  .avatar{
    width:100px;
    height:100px;
  }

  .song-buttons{
    grid-template-columns:1fr;
  }

  .song-main{
    grid-template-columns:74px 1fr;
  }

  .song-cover{
    width:74px;
    height:74px;
  }

}
</style>
</head>

<body>

<main class="wrap">

<header>

  <div class="logo">
    NovaRadio
  </div>

  <a
    class="back"
    href="home.html"
  >
    ← Home
  </a>

</header>


<div
  id="loading"
  class="loading"
>
  アーティスト情報を読み込んでいます…
</div>


<div
  id="content"
  style="display:none"
>

  <section class="profile">

    <div
      class="avatar"
      id="artistAvatar"
    >
      👤
    </div>

    <div class="artist-name-row">
      <div
        class="artist-name"
        id="artistName"
      >
        Artist
      </div>
      <span class="pro-badge" id="artistProBadge">PRO</span>
    </div>

    <div
      class="bio"
      id="artistBio"
      style="display:none"
    ></div>

    <div
      class="links"
      id="artistLinks"
      style="display:none"
    ></div>

    <div
      class="follow-area"
      id="followArea"
      style="display:none"
    >
      <button
        class="follow-button"
        id="followButton"
        type="button"
      >
        ＋ フォロー
      </button>
    </div>

  </section>


  <section class="card">

    <h2>
      🎵 このアーティストの曲
    </h2>

    <div
      class="song-list"
      id="songList"
    >
      <div class="empty">
        曲を読み込んでいます…
      </div>
    </div>

  </section>

</div>

</main>

<div
  class="modal"
  id="playlistModal"
>
  <div class="modal-box">

    <div class="modal-title">
      📚 プレイリストに追加
    </div>

    <div
      class="playlist-list"
      id="playlistList"
    >
      <div class="empty">
        読み込んでいます…
      </div>
    </div>

    <button
      class="new-playlist-button"
      id="showCreatePlaylist"
      type="button"
    >
      ＋ 新しいプレイリストを作る
    </button>

    <div
      class="create-area"
      id="createPlaylistArea"
    >
      <input
        class="create-input"
        id="newPlaylistName"
        type="text"
        maxlength="50"
        placeholder="プレイリスト名"
      >

      <div class="create-buttons">
        <button
          class="cancel-create"
          id="cancelCreatePlaylist"
          type="button"
        >
          キャンセル
        </button>

        <button
          class="save-create"
          id="saveNewPlaylist"
          type="button"
        >
          作成して追加
        </button>
      </div>
    </div>

    <button
      class="modal-close"
      id="closePlaylistModal"
      type="button"
    >
      閉じる
    </button>

  </div>
</div>


<script>

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentSession =
  null;

let artistUserId =
  null;

let playlistTargetSong =
  null;


const loading =
  document.getElementById(
    "loading"
  );

const content =
  document.getElementById(
    "content"
  );

const artistAvatar =
  document.getElementById(
    "artistAvatar"
  );

const artistName =
  document.getElementById(
    "artistName"
  );

const artistProBadge =
  document.getElementById(
    "artistProBadge"
  );

const artistBio =
  document.getElementById(
    "artistBio"
  );

const artistLinks =
  document.getElementById(
    "artistLinks"
  );

const songList =
  document.getElementById(
    "songList"
  );

const followArea =
  document.getElementById(
    "followArea"
  );

const followButton =
  document.getElementById(
    "followButton"
  );

const playlistModal =
  document.getElementById(
    "playlistModal"
  );

const playlistList =
  document.getElementById(
    "playlistList"
  );

const createPlaylistArea =
  document.getElementById(
    "createPlaylistArea"
  );

const newPlaylistName =
  document.getElementById(
    "newPlaylistName"
  );


async function init(){

  const params =
    new URLSearchParams(
      location.search
    );


  artistUserId =
    params.get(
      "id"
    );


  if(!artistUserId){

    loading.innerHTML =
      `<div class="error">
        アーティストIDが指定されていません。
      </div>`;

    return;
  }


  const {
    data:{
      session
    }
  } =
  await sb.auth.getSession();


  currentSession =
    session || null;


  const success =
    await loadArtistProfile();


  if(!success){
    return;
  }


  await setupFollowButton();


  await loadArtistSongs();


  loading.style.display =
    "none";

  content.style.display =
    "block";

}


/* =========================
   プロフィール
========================= */

async function loadArtistProfile(){

  const {
    data,
    error
  } =
  await sb
  .from("profiles")
  .select(
    "artist_name,avatar_url,bio,instagram_url,x_url,tiktok_url,youtube_url,website_url,plan,pro_until,is_lifetime_pro"
  )
  .eq(
    "user_id",
    artistUserId
  )
  .limit(1);


  if(error){

    loading.innerHTML =
      `<div class="error">
        プロフィール取得に失敗しました。<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return false;
  }


  if(
    !data ||
    !data.length
  ){

    loading.innerHTML =
      `<div class="error">
        このアーティストのプロフィールはまだありません。
      </div>`;

    return false;
  }


  const profile =
    data[0];


  artistName.textContent =
    profile.artist_name ||
    "Unknown Artist";


  const isPro =
    profile.is_lifetime_pro === true ||
    (
      String(profile.plan || "").toLowerCase() === "pro" &&
      (
        !profile.pro_until ||
        new Date(profile.pro_until).getTime() > Date.now()
      )
    );

  artistProBadge.classList.toggle(
    "show",
    isPro
  );


  renderAvatar(
    profile.avatar_url ||
    null
  );


  const bioText =
    String(
      profile.bio || ""
    )
    .trim();


  if(bioText){

    artistBio.textContent =
      bioText;

    artistBio.style.display =
      "block";

  }


  renderLinks(
    profile
  );


  return true;

}


function renderAvatar(
  url
){

  artistAvatar.innerHTML =
    "";


  if(!url){

    artistAvatar.textContent =
      "👤";

    return;
  }


  const image =
    document.createElement(
      "img"
    );


  image.src =
    url;


  image.alt =
    "プロフィール画像";


  image.addEventListener(
    "error",
    ()=>{

      artistAvatar.innerHTML =
        "";

      artistAvatar.textContent =
        "👤";

    }
  );


  artistAvatar.appendChild(
    image
  );

}


function renderLinks(
  profile
){

  artistLinks.innerHTML =
    "";


  const links = [

    {
      label:"Instagram",
      emoji:"📸",
      url:profile.instagram_url
    },

    {
      label:"X",
      emoji:"𝕏",
      url:profile.x_url
    },

    {
      label:"TikTok",
      emoji:"🎵",
      url:profile.tiktok_url
    },

    {
      label:"YouTube",
      emoji:"▶️",
      url:profile.youtube_url
    },

    {
      label:"Website",
      emoji:"🌐",
      url:profile.website_url
    }

  ];


  links.forEach(
    link=>{

      const url =
        safeHttpUrl(
          link.url
        );


      if(!url){
        return;
      }


      const anchor =
        document.createElement(
          "a"
        );


      anchor.className =
        "link";


      anchor.href =
        url;


      anchor.target =
        "_blank";


      anchor.rel =
        "noopener noreferrer";


      anchor.textContent =
        `${link.emoji} ${link.label}`;


      artistLinks.appendChild(
        anchor
      );

    }
  );


  artistLinks.style.display =
    artistLinks.children.length
      ? "flex"
      : "none";

}


/* =========================
   フォロー
========================= */

async function setupFollowButton(){

  if(!currentSession){

    followArea.style.display =
      "flex";

    followButton.textContent =
      "🔒 ログインでフォロー";

    followButton.classList.remove(
      "following"
    );

    followButton.onclick =
      ()=>{
        location.href =
          "index.html";
      };

    return;
  }


  if(
    currentSession.user.id ===
    artistUserId
  ){

    // 自分自身のアーティストページでは
    // フォローボタンを表示しない
    followArea.style.display =
      "none";

    return;
  }


  followArea.style.display =
    "flex";

  followButton.onclick =
    toggleArtistFollow;

  await updateFollowButton();

}


async function isFollowingArtist(){

  if(
    !currentSession ||
    !artistUserId
  ){
    return false;
  }


  const {
    data,
    error
  } =
  await sb
  .from("artist_follows")
  .select("id")
  .eq(
    "follower_user_id",
    currentSession.user.id
  )
  .eq(
    "artist_user_id",
    artistUserId
  )
  .limit(1);


  if(error){

    console.error(
      "Follow check error:",
      error
    );

    return false;
  }


  return !!(
    data &&
    data.length
  );

}


async function updateFollowButton(){

  if(
    !currentSession ||
    currentSession.user.id === artistUserId
  ){
    return;
  }


  const following =
    await isFollowingArtist();


  if(following){

    followButton.textContent =
      "✓ フォロー中";

    followButton.classList.add(
      "following"
    );

  }else{

    followButton.textContent =
      "＋ フォロー";

    followButton.classList.remove(
      "following"
    );

  }

}


async function toggleArtistFollow(){

  if(!currentSession){

    location.href =
      "index.html";

    return;
  }


  if(
    currentSession.user.id ===
    artistUserId
  ){
    return;
  }


  followButton.disabled =
    true;


  try{

    const following =
      await isFollowingArtist();


    if(following){

      const {
        error
      } =
      await sb
      .from("artist_follows")
      .delete()
      .eq(
        "follower_user_id",
        currentSession.user.id
      )
      .eq(
        "artist_user_id",
        artistUserId
      );


      if(error){
        throw error;
      }

    }else{

      const {
        error
      } =
      await sb
      .from("artist_follows")
      .insert({

        follower_user_id:
          currentSession.user.id,

        artist_user_id:
          artistUserId

      });


      if(error){
        throw error;
      }

    }


    await updateFollowButton();

  }
  catch(error){

    console.error(
      "Follow toggle error:",
      error
    );

    alert(
      "フォロー操作に失敗しました：" +
      (
        error?.message ||
        "Unknown error"
      )
    );

  }
  finally{

    followButton.disabled =
      false;

  }

}


/* =========================
   曲一覧
========================= */

async function loadArtistSongs(){

  songList.innerHTML =
    `<div class="empty">
      曲を読み込んでいます…
    </div>`;


  const {
    data:profileData,
    error:profileError
  } =
  await sb
  .from("profiles")
  .select("artist_name")
  .eq(
    "user_id",
    artistUserId
  )
  .limit(1);


  if(profileError){

    songList.innerHTML =
      `<div class="error">
        アーティスト情報を取得できませんでした。
      </div>`;

    return;
  }


  const targetArtistName =
    profileData?.[0]?.artist_name;


  if(!targetArtistName){

    songList.innerHTML =
      `<div class="empty">
        まだ曲はありません。
      </div>`;

    return;
  }


  const {
    data:songs,
    error
  } =
  await sb
  .from("songs")
  .select("*")
  .eq(
    "artist",
    targetArtistName
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(error){

    songList.innerHTML =
      `<div class="error">
        曲の取得に失敗しました。<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if(
    !songs ||
    !songs.length
  ){

    songList.innerHTML =
      `<div class="empty">
        このアーティストの曲はまだありません。
      </div>`;

    return;
  }


  songList.innerHTML =
    "";


  for(
    const song
    of songs
  ){

    const item =
      await createSongItem(
        song
      );


    songList.appendChild(
      item
    );

  }

}


/* =========================
   曲カード
========================= */

async function createSongItem(
  song
){

  const item =
    document.createElement(
      "div"
    );


  item.className =
    "song";


  const genreText =
    formatTags(
      song.genre
    );


  const moodText =
    formatTags(
      song.mood
    );


  const coverUrl =
    safeHttpUrl(
      song.cover_url
    );


  item.innerHTML =
    `<div class="song-main">

      <div class="song-cover">
        ${
          coverUrl
            ? `<img
                src="${escapeHtml(
                  coverUrl
                )}"
                alt="${escapeHtml(
                  (song.title || "ジャケット") + " のジャケット"
                )}"
              >`
            : "🎵"
        }
      </div>

      <div>
        <div class="song-title">
          ${escapeHtml(
            song.title ||
            "Untitled"
          )}
        </div>

        <div class="song-meta">
          ${escapeHtml(
            genreText
          )}

          ${
            moodText
              ? " · " +
                escapeHtml(
                  moodText
                )
              : ""
          }
        </div>
      </div>

    </div>

    <div class="song-buttons">

      <button
        type="button"
        class="play-song"
      >
        ▶️ 再生
      </button>

      <button
        type="button"
        class="like-song"
      >
        🤍 いいね
      </button>

      <button
        type="button"
        class="playlist-song"
      >
        ＋ プレイリスト
      </button>

    </div>`;


  item
  .querySelector(
    ".play-song"
  )
  .addEventListener(
    "click",
    ()=>{

      toggleAudio(
        item,
        song
      );

    }
  );


  const likeButton =
    item.querySelector(
      ".like-song"
    );


  const playlistButton =
    item.querySelector(
      ".playlist-song"
    );


  if(!currentSession){

    playlistButton.textContent =
      "🔒 ログインで追加";

    playlistButton.addEventListener(
      "click",
      ()=>{
        location.href =
          "index.html";
      }
    );

    likeButton.textContent =
      "🔒 ログインでいいね";

    likeButton.addEventListener(
      "click",
      ()=>{

        location.href =
          "index.html";

      }
    );


    return item;

  }


  playlistButton.addEventListener(
    "click",
    ()=>{
      openPlaylistModal(
        song
      );
    }
  );


  await updateLikeButton(
    likeButton,
    song.id
  );


  likeButton.addEventListener(
    "click",
    async ()=>{

      await toggleLike(
        likeButton,
        song.id
      );

    }
  );


  return item;

}


/* =========================
   いいね
========================= */

async function isLiked(
  songId
){

  if(!currentSession){
    return false;
  }


  const {
    data,
    error
  } =
  await sb
  .from("likes")
  .select("id")
  .eq(
    "user_id",
    currentSession.user.id
  )
  .eq(
    "song_id",
    songId
  )
  .limit(1);


  if(error){

    console.error(
      "Like check error:",
      error
    );

    return false;
  }


  return !!(
    data &&
    data.length
  );

}


async function updateLikeButton(
  button,
  songId
){

  const liked =
    await isLiked(
      songId
    );


  if(liked){

    button.textContent =
      "❤️ いいね済み";

    button.classList.add(
      "liked"
    );

  }else{

    button.textContent =
      "🤍 いいね";

    button.classList.remove(
      "liked"
    );

  }

}


async function toggleLike(
  button,
  songId
){

  if(!currentSession){
    return;
  }


  const liked =
    await isLiked(
      songId
    );


  if(liked){

    const {
      error
    } =
    await sb
    .from("likes")
    .delete()
    .eq(
      "user_id",
      currentSession.user.id
    )
    .eq(
      "song_id",
      songId
    );


    if(error){

      alert(
        "いいね解除に失敗しました：" +
        error.message
      );

      return;
    }

  }else{

    const {
      error
    } =
    await sb
    .from("likes")
    .insert({

      user_id:
        currentSession.user.id,

      song_id:
        songId

    });


    if(error){

      alert(
        "いいねに失敗しました：" +
        error.message
      );

      return;
    }

  }


  await updateLikeButton(
    button,
    songId
  );

}


/* =========================
   プレイリスト
========================= */

async function openPlaylistModal(
  song
){

  if(!currentSession){
    location.href =
      "index.html";
    return;
  }

  playlistTargetSong =
    song;

  playlistModal.classList.add(
    "show"
  );

  createPlaylistArea.classList.remove(
    "show"
  );

  newPlaylistName.value =
    "";

  await loadPlaylistChoices();

}


async function loadPlaylistChoices(){

  playlistList.innerHTML =
    `<div class="empty">
      プレイリストを読み込んでいます…
    </div>`;

  const {
    data,
    error
  } =
  await sb
  .from("playlists")
  .select("*")
  .eq(
    "user_id",
    currentSession.user.id
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );

  if(error){

    playlistList.innerHTML =
      `<div class="error">
        プレイリストを取得できませんでした。<br><br>
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;
  }

  playlistList.innerHTML =
    "";

  if(
    !data ||
    !data.length
  ){

    playlistList.innerHTML =
      `<div class="empty">
        まだプレイリストがありません。<br>
        下のボタンから作成できます 🎧
      </div>`;

    return;
  }

  data.forEach(
    playlist=>{

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "playlist-choice";

      button.textContent =
        "📚 " +
        (
          playlist.name ||
          "無題のプレイリスト"
        );

      button.addEventListener(
        "click",
        ()=>{
          addSongToPlaylist(
            playlist
          );
        }
      );

      playlistList.appendChild(
        button
      );

    }
  );

}


async function addSongToPlaylist(
  playlist
){

  if(
    !playlistTargetSong ||
    !currentSession
  ){
    return;
  }

  const {
    data:existing,
    error:checkError
  } =
  await sb
  .from("playlist_songs")
  .select("id")
  .eq(
    "playlist_id",
    playlist.id
  )
  .eq(
    "song_id",
    playlistTargetSong.id
  )
  .eq(
    "user_id",
    currentSession.user.id
  )
  .limit(1);

  if(checkError){

    alert(
      "確認に失敗しました：" +
      checkError.message
    );

    return;
  }

  if(
    existing &&
    existing.length
  ){

    alert(
      "この曲はすでにそのプレイリストに入っています。"
    );

    return;
  }

  const {
    error
  } =
  await sb
  .from("playlist_songs")
  .insert({

    playlist_id:
      playlist.id,

    song_id:
      playlistTargetSong.id,

    user_id:
      currentSession.user.id

  });

  if(error){

    alert(
      "プレイリストへの追加に失敗しました：" +
      error.message
    );

    return;
  }

  alert(
    `「${playlistTargetSong.title}」を「${playlist.name}」に追加しました！`
  );

  playlistModal.classList.remove(
    "show"
  );

}


async function createPlaylistAndAddSong(){

  if(
    !playlistTargetSong ||
    !currentSession
  ){
    return;
  }

  const name =
    newPlaylistName
    .value
    .trim();

  if(!name){

    alert(
      "プレイリスト名を入力してください。"
    );

    return;
  }

  const {
    data,
    error
  } =
  await sb
  .from("playlists")
  .insert({

    user_id:
      currentSession.user.id,

    name:
      name

  })
  .select("*")
  .single();

  if(error){

    alert(
      "プレイリスト作成に失敗しました：" +
      error.message
    );

    return;
  }

  const {
    error:addError
  } =
  await sb
  .from("playlist_songs")
  .insert({

    playlist_id:
      data.id,

    song_id:
      playlistTargetSong.id,

    user_id:
      currentSession.user.id

  });

  if(addError){

    alert(
      "プレイリストは作成できましたが、曲の追加に失敗しました：" +
      addError.message
    );

    return;
  }

  alert(
    `「${data.name}」を作成して「${playlistTargetSong.title}」を追加しました！`
  );

  playlistModal.classList.remove(
    "show"
  );

  createPlaylistArea.classList.remove(
    "show"
  );

  newPlaylistName.value =
    "";

}


document
.getElementById(
  "showCreatePlaylist"
)
.addEventListener(
  "click",
  ()=>{

    createPlaylistArea.classList.add(
      "show"
    );

    setTimeout(
      ()=>{
        newPlaylistName.focus();
      },
      100
    );

  }
);


document
.getElementById(
  "cancelCreatePlaylist"
)
.addEventListener(
  "click",
  ()=>{

    createPlaylistArea.classList.remove(
      "show"
    );

    newPlaylistName.value =
      "";

  }
);


document
.getElementById(
  "saveNewPlaylist"
)
.addEventListener(
  "click",
  createPlaylistAndAddSong
);


newPlaylistName.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Enter"
    ){
      createPlaylistAndAddSong();
    }

  }
);


document
.getElementById(
  "closePlaylistModal"
)
.addEventListener(
  "click",
  ()=>{

    playlistModal.classList.remove(
      "show"
    );

  }
);


playlistModal.addEventListener(
  "click",
  event=>{

    if(
      event.target ===
      playlistModal
    ){

      playlistModal.classList.remove(
        "show"
      );

    }

  }
);


/* =========================
   再生
========================= */

function toggleAudio(
  item,
  song
){

  const old =
    item.querySelector(
      "audio"
    );


  if(old){

    old.pause();
    old.remove();

    return;
  }


  if(!song.audio_url){

    alert(
      "この曲には音源がありません。"
    );

    return;
  }


  document
  .querySelectorAll(
    ".song-audio"
  )
  .forEach(
    audio=>{

      audio.pause();
      audio.remove();

    }
  );


  const audio =
    document.createElement(
      "audio"
    );


  audio.className =
    "song-audio";


  audio.controls =
    true;


  audio.autoplay =
    true;


  audio.src =
    song.audio_url;


  item.appendChild(
    audio
  );


  audio
  .play()
  .catch(()=>{});

}


/* =========================
   Helpers
========================= */

function formatTags(
  value
){

  if(!value){
    return "";
  }


  return String(
    value
  )
  .split(",")
  .map(
    value=>value.trim()
  )
  .filter(Boolean)
  .join(" / ");

}


function safeHttpUrl(
  value
){

  const raw =
    String(
      value || ""
    )
    .trim();


  if(!raw){
    return null;
  }


  try{

    const url =
      new URL(
        raw
      );


    if(
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ){

      return null;

    }


    return url.href;

  }
  catch{

    return null;

  }

}


function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


init();

</script>
