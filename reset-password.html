<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>パスワード再設定 | NovaRadio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial;
  color:#fff;
  background:radial-gradient(circle at 50% 0,#211b50,#090b1b 55%,#050611);
  display:flex;
  justify-content:center;
  align-items:center;
}

.wrap{
  width:min(560px,94vw);
  padding:40px 0;
}

.brand{
  text-align:center;
  font-size:42px;
  font-weight:800;
  margin-bottom:8px;
}

.sub{
  text-align:center;
  color:#aeb0c8;
  line-height:1.7;
  margin-bottom:24px;
}

.card{
  background:#101228d9;
  border:1px solid #30355e;
  border-radius:28px;
  padding:32px;
}

.title{
  font-size:23px;
  font-weight:900;
  margin-bottom:8px;
}

.description{
  color:#aeb0c8;
  font-size:14px;
  line-height:1.7;
  margin-bottom:24px;
}

.field{
  margin:18px 0;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

.field input{
  width:100%;
  padding:17px;
  border-radius:15px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:17px;
}

.submit{
  width:100%;
  margin-top:20px;
  padding:18px;
  border:0;
  border-radius:18px;
  font-weight:800;
  font-size:18px;
  cursor:pointer;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  color:#fff;
}

.submit:disabled{
  opacity:.6;
  cursor:wait;
}

.status{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  background:#10152b;
  border:1px solid #39755d;
  line-height:1.6;
}

.status.show{
  display:block;
}

.status.error{
  border-color:#8d4050;
  color:#ffd6dc;
}

.back{
  display:block;
  margin-top:20px;
  text-align:center;
  color:#aeb5ff;
  text-decoration:none;
  font-size:14px;
}

.back:hover{
  color:#fff;
}

@media(max-width:600px){
  .brand{
    font-size:36px;
  }

  .card{
    padding:22px;
  }
}
</style>
</head>

<body>

<main class="wrap">

  <div class="brand">
    NovaRadio
  </div>

  <div class="sub">
    パスワードを再設定します。
  </div>

  <section class="card">

    <div class="title">
      新しいパスワード
    </div>

    <div class="description">
      新しく使用するパスワードを入力してください。<br>
      パスワードは8文字以上にしてください。
    </div>

    <div class="field">
      <label>新しいパスワード</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        placeholder="8文字以上"
      >
    </div>

    <div class="field">
      <label>新しいパスワード（確認）</label>
      <input
        id="passwordConfirm"
        type="password"
        autocomplete="new-password"
        placeholder="もう一度入力"
      >
    </div>

    <button
      type="button"
      class="submit"
      id="updatePassword"
    >
      パスワードを変更
    </button>

    <div
      id="status"
      class="status"
    ></div>

    <a
      href="index.html?mode=login"
      class="back"
    >
      ログイン画面へ戻る
    </a>

  </section>

</main>

<script>

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const password =
  document.getElementById("password");

const passwordConfirm =
  document.getElementById("passwordConfirm");

const updatePassword =
  document.getElementById("updatePassword");

const status =
  document.getElementById("status");

function msg(
  text,
  error=false
){

  status.textContent =
    text;

  status.className =
    "status show" +
    (error ? " error" : "");

}

/*
  Supabaseのパスワード回復リンクからこのページへ来ると、
  回復用セッションがブラウザに設定される。
*/
sb.auth.onAuthStateChange(
  (event)=>{

    if(
      event ===
      "PASSWORD_RECOVERY"
    ){

      msg(
        "本人確認が完了しました。新しいパスワードを設定してください。"
      );

    }

  }
);

updatePassword.addEventListener(
  "click",
  async ()=>{

    const p =
      password.value;

    const pc =
      passwordConfirm.value;

    if(
      !p ||
      !pc
    ){

      return msg(
        "新しいパスワードを2か所に入力してください。",
        true
      );

    }

    if(
      p.length < 8
    ){

      return msg(
        "パスワードは8文字以上にしてください。",
        true
      );

    }

    if(
      p !== pc
    ){

      return msg(
        "2つのパスワードが一致していません。",
        true
      );

    }

    updatePassword.disabled =
      true;

    updatePassword.textContent =
      "変更中…";

    try{

      const {
        data:{
          session
        }
      } =
      await sb.auth.getSession();

      if(!session){

        throw new Error(
          "再設定リンクが無効または期限切れです。ログイン画面からもう一度再設定メールを送信してください。"
        );

      }

      const {
        error
      } =
      await sb.auth.updateUser({

        password:p

      });

      if(error){
        throw error;
      }

      password.value = "";
      passwordConfirm.value = "";

      msg(
        "パスワードを変更しました。ログイン画面から新しいパスワードでログインしてください。"
      );

      updatePassword.disabled =
        true;

      updatePassword.textContent =
        "変更完了";

    }
    catch(x){

      msg(
        x.message ||
        "パスワードの変更に失敗しました。",
        true
      );

      updatePassword.disabled =
        false;

      updatePassword.textContent =
        "パスワードを変更";

    }

  }
);

</script>

</body>
</html>
