<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio - My Page</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at 50% 0,#211b50,#080a18 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(900px,94vw);
  margin:auto;
  padding:40px 0 80px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.logo{
  font-size:32px;
  font-weight:800;
}

.back{
  color:#fff;
  text-decoration:none;
  padding:11px 16px;
  background:#101228;
  border:1px solid #343b67;
  border-radius:14px;
}

.profile{
  text-align:center;
  padding:40px 20px;
  margin-bottom:25px;
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
}

.avatar{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  background:linear-gradient(135deg,#7b25ff,#159df5);
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.username{
  margin-top:18px;
  font-size:28px;
  font-weight:800;
}

.profile-bio{
  max-width:620px;
  margin:12px auto 0;
  color:#aeb0c8;
  line-height:1.7;
  white-space:pre-wrap;
}

.profile-links{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  margin-top:18px;
}

.profile-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 13px;
  border-radius:999px;
  border:1px solid #343b67;
  background:#171a31;
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.profile-link:hover{
  border-color:#7b25ff;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:24px;
  padding:25px;
  margin-bottom:18px;
}

.card h2{
  margin:0 0 18px;
  font-size:21px;
}

.empty{
  padding:22px;
  text-align:center;
  border-radius:16px;
  background:#080b1d;
  color:#8f93ad;
}

.liked-list,
.playlist-list,
.playlist-song-list{
  display:grid;
  gap:12px;
}

.liked-song,
.playlist-item,
.playlist-song{
  padding:18px;
  border-radius:18px;
  background:#080b1d;
  border:1px solid #30355e;
}

.liked-title,
.playlist-name,
.playlist-song-title{
  font-size:18px;
  font-weight:800;
}

.liked-artist,
.playlist-song-artist{
  margin-top:5px;
  color:#adb1c9;
}

.liked-meta,
.playlist-meta,
.playlist-song-meta{
  margin-top:7px;
  font-size:13px;
  color:#858baa;
}

.song-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.song-buttons button{
  padding:12px;
  border:0;
  border-radius:13px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.play-song{
  background:#242842;
}

.remove-like,
.remove-playlist-song{
  background:#56283a;
}

.song-audio{
  width:100%;
  margin-top:14px;
}

.action{
  display:block;
  width:100%;
  margin-top:12px;
  padding:16px;
  border:0;
  border-radius:16px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  background:#171a31;
  border:1px solid #343b67;
}

.primary{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border:0;
}

.logout{
  background:#35202a;
  border:1px solid #633846;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:80px 0;
}

/* プレイリスト */

.playlist-item{
  cursor:pointer;
  transition:.15s;
}

.playlist-item:hover{
  border-color:#7b25ff;
}

.playlist-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.playlist-quick-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.playlist-quick-actions button{
  flex:1;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid #343b67;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.quick-play{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border:0 !important;
}

.quick-shuffle{
  background:#171a31;
}

.playlist-open{
  flex:1;
  min-width:0;
}

.delete-playlist{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  background:#56283a;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.playlist-detail{
  display:none;
}

.playlist-detail.show{
  display:block;
}

.detail-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.detail-title{
  font-size:23px;
  font-weight:800;
}

.close-detail{
  border:1px solid #343b67;
  background:#171a31;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}

/* モーダル */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  z-index:100;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(520px,95vw);
  background:#101228;
  border:1px solid #30355e;
  border-radius:24px;
  padding:25px;
}

.modal-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:18px;
}

.modal-input{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid #353b67;
  background:#080b1d;
  color:#fff;
  font-size:16px;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.modal-actions button{
  padding:14px;
  border:0;
  border-radius:14px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.cancel{
  background:#242842;
}

.save{
  background:linear-gradient(90deg,#7b25ff,#159df5);
}


/* プレイリスト連続再生コントロール */
.playlist-player-controls{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr;
  gap:10px;
  margin:0 0 18px;
}

.playlist-player-controls button{
  padding:13px 10px;
  border:1px solid #343b67;
  border-radius:14px;
  background:#171a31;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.playlist-player-controls .playlist-play-all{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border:0;
}

.playlist-player-controls button.active{
  border-color:#8b36ff;
  box-shadow:0 0 0 1px #8b36ff inset;
  background:#24204a;
}

.playlist-now-playing{
  margin:-5px 0 16px;
  padding:13px 14px;
  border:1px solid #343b67;
  border-radius:16px;
  background:#080b1d;
  color:#adb1c9;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:14px;
}

.playlist-now-cover{
  width:70px;
  height:70px;
  flex:0 0 70px;
  border-radius:14px;
  object-fit:cover;
  display:block;
  border:1px solid #343b67;
  background:#11152a;
}

.playlist-now-cover-placeholder{
  width:70px;
  height:70px;
  flex:0 0 70px;
  border-radius:14px;
  border:1px solid #343b67;
  background:#11152a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.playlist-now-meta{
  min-width:0;
  flex:1;
}

.playlist-now-label{
  color:#8f94b2;
  font-size:12px;
  margin-bottom:5px;
}

.playlist-now-title{
  color:#fff;
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.playlist-now-artist{
  margin-top:4px;
  color:#adb1c9;
  font-size:13px;
}

.playlist-song.is-playing{
  border-color:#7b25ff;
  box-shadow:0 0 0 1px #7b25ff inset;
}

.playlist-song.is-playing .playlist-song-title::before{
  content:"▶ ";
  color:#a96cff;
}

@media(max-width:600px){
  .playlist-player-controls{
    grid-template-columns:1fr;
  }
}


/* =========================
   画面下固定ミニプレイヤー
========================= */

body{
  padding-bottom:118px;
}

.mini-player{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  width:min(920px,94vw);
  z-index:90;
  padding:10px 14px 8px;
  border:1px solid #3a3f70;
  border-radius:20px;
  background:#0b0e20f2;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 60px #000a;
  display:none;
}

.mini-player.show{
  display:block;
}

.mini-main{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;
  gap:14px;
  align-items:center;
}

.mini-track{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.mini-cover{
  width:54px;
  height:54px;
  flex:0 0 54px;
  border-radius:11px;
  overflow:hidden;
  border:1px solid #343b67;
  background:#15182e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.mini-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.mini-info{
  min-width:0;
}

.mini-title{
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-artist{
  margin-top:3px;
  color:#9ba0bd;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-controls{
  display:flex;
  align-items:center;
  gap:6px;
}

.mini-button{
  width:38px;
  height:38px;
  border:1px solid #343b67;
  border-radius:50%;
  background:#171a31;
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.mini-button.main{
  width:44px;
  height:44px;
  border:0;
  background:linear-gradient(135deg,#7b25ff,#159df5);
  font-size:18px;
}

.mini-modes{
  display:flex;
  gap:6px;
}

.mini-mode{
  min-width:42px;
  height:36px;
  padding:0 10px;
  border:1px solid #343b67;
  border-radius:11px;
  background:#171a31;
  color:#fff;
  cursor:pointer;
  font-weight:800;
}

.mini-mode.active{
  border-color:#8b36ff;
  background:#24204a;
  box-shadow:0 0 0 1px #8b36ff inset;
}

.mini-progress-row{
  display:grid;
  grid-template-columns:42px 1fr 42px;
  gap:9px;
  align-items:center;
  margin-top:6px;
}

.mini-time{
  color:#8f94b2;
  font-size:11px;
  text-align:center;
}

.mini-seek{
  width:100%;
  accent-color:#7b25ff;
  cursor:pointer;
}

/* 曲カード内には大きいaudioバーを出さない */
.song-audio{
  display:none !important;
}

@media(max-width:600px){
  body{
    padding-bottom:144px;
  }

  .mini-player{
    bottom:8px;
    padding:9px 10px 8px;
    border-radius:16px;
  }

  .mini-main{
    grid-template-columns:minmax(0,1fr) auto;
    gap:8px;
  }

  .mini-modes{
    grid-column:1 / -1;
    justify-content:flex-end;
  }

  .mini-cover{
    width:46px;
    height:46px;
    flex-basis:46px;
  }

  .mini-button{
    width:34px;
    height:34px;
  }

  .mini-button.main{
    width:40px;
    height:40px;
  }
}

@media(max-width:600px){

  .logo{
    font-size:27px;
  }

  .username{
    font-size:24px;
  }

  .song-buttons{
    grid-template-columns:1fr;
  }

  .playlist-top{
    align-items:flex-start;
  }

}


/* =========================
   app.html 内で表示している時は
   My Page 側の旧ミニプレイヤーを隠す
   再生本体は親 app.html に一本化
========================= */
body.inside-nova-app{
  padding-bottom:40px !important;
}

body.inside-nova-app .mini-player{
  display:none !important;
}

</style>
</head>

<body>

<script>
/* app.html の中で開かれている時だけ、ページ内の旧プレイヤー表示を消す */
if(
  window.parent &&
  window.parent !== window
){
  document.body.classList.add(
    "inside-nova-app"
  );
}
</script>

<main class="wrap">

<header>

  <div class="logo">
    NovaRadio
  </div>

  <a
    class="back"
    href="home.html"
  >
    ← Home
  </a>

</header>


<div
  id="loading"
  class="loading"
>
  マイページを読み込んでいます…
</div>


<div
  id="mypage"
  style="display:none"
>

  <section class="profile">

    <div
      class="avatar"
      id="profileAvatar"
    >
      👤
    </div>

    <div
      class="username"
      id="username"
    >
      User
    </div>

    <div
      class="profile-bio"
      id="profileBio"
      style="display:none"
    ></div>

    <div
      class="profile-links"
      id="profileLinks"
      style="display:none"
    ></div>

  </section>


  <!-- いいね -->

  <section class="card">

    <h2>
      ❤️ いいねした曲
    </h2>

    <div
      id="likedSongs"
      class="liked-list"
    >
      <div class="empty">
        読み込んでいます…
      </div>
    </div>

  </section>


  <!-- プレイリスト -->

  <section
    class="card"
    id="playlistSection"
  >

    <h2>
      📚 マイプレイリスト
    </h2>

    <div
      id="playlistList"
      class="playlist-list"
    >
      <div class="empty">
        プレイリストを読み込んでいます…
      </div>
    </div>

    <button
      class="action primary"
      type="button"
      id="createPlaylist"
    >
      ＋ プレイリストを作る
    </button>

  </section>


  <!-- プレイリスト詳細 -->

  <section
    class="card playlist-detail"
    id="playlistDetail"
  >

    <div class="detail-header">

      <div
        class="detail-title"
        id="playlistDetailTitle"
        style="display:none"
      >
        プレイリスト
      </div>

      <button
        class="close-detail"
        id="closePlaylistDetail"
        type="button"
      >
        閉じる
      </button>

    </div>

    <div
      class="playlist-player-controls"
      id="playlistPlayerControls"
      style="display:none"
    >
      <button
        type="button"
        class="playlist-play-all"
        id="playlistPlayAll"
      >
        ▶️ 全曲再生
      </button>

      <button
        type="button"
        id="playlistShuffle"
      >
        🔀 シャッフル OFF
      </button>

      <button
        type="button"
        id="playlistRepeat"
      >
        🔁 リピート OFF
      </button>
    </div>

    <div
      class="playlist-now-playing"
      id="playlistNowPlaying"
      style="display:none"
    ></div>

    <div
      id="playlistSongs"
      class="playlist-song-list"
    >
    </div>

  </section>


  <!-- アカウント -->

  <section class="card">

    <h2>
      ⚙️ アカウント
    </h2>

    <button
      class="action"
      type="button"
      id="accountSettings"
    >
      アカウント設定
    </button>

    <button
      class="action logout"
      type="button"
      id="logout"
    >
      🚪 ログアウト
    </button>

  </section>

</div>

</main>

<!-- 画面下固定ミニプレイヤー -->
<div
  class="mini-player"
  id="miniPlayer"
>
  <div class="mini-main">

    <div class="mini-track">

      <div
        class="mini-cover"
        id="miniCover"
      >
        🎵
      </div>

      <div class="mini-info">
        <div
          class="mini-title"
          id="miniTitle"
        >
          曲を選択
        </div>

        <div
          class="mini-artist"
          id="miniArtist"
        >
          NovaRadio
        </div>
      </div>

    </div>

    <div class="mini-controls">

      <button
        type="button"
        class="mini-button"
        id="miniPrev"
        title="前の曲"
      >
        ⏮
      </button>

      <button
        type="button"
        class="mini-button main"
        id="miniPlayPause"
        title="再生 / 一時停止"
      >
        ▶
      </button>

      <button
        type="button"
        class="mini-button"
        id="miniNext"
        title="次の曲"
      >
        ⏭
      </button>

    </div>

    <div class="mini-modes">

      <button
        type="button"
        class="mini-mode"
        id="miniShuffle"
        title="シャッフル"
      >
        🔀
      </button>

      <button
        type="button"
        class="mini-mode"
        id="miniRepeat"
        title="リピート"
      >
        🔁
      </button>

    </div>

  </div>

  <div class="mini-progress-row">
    <div
      class="mini-time"
      id="miniCurrentTime"
    >
      0:00
    </div>

    <input
      class="mini-seek"
      id="miniSeek"
      type="range"
      min="0"
      max="100"
      value="0"
      step="0.1"
      aria-label="再生位置"
    >

    <div
      class="mini-time"
      id="miniDuration"
    >
      0:00
    </div>
  </div>

  <audio
    id="globalAudio"
    preload="metadata"
  ></audio>
</div>


<!-- プレイリスト作成モーダル -->

<div
  class="modal"
  id="playlistModal"
>

  <div class="modal-box">

    <div class="modal-title">
      📚 新しいプレイリスト
    </div>

    <input
      class="modal-input"
      id="playlistNameInput"
      type="text"
      maxlength="50"
      placeholder="プレイリスト名"
    >

    <div class="modal-actions">

      <button
        class="cancel"
        id="cancelPlaylist"
        type="button"
      >
        キャンセル
      </button>

      <button
        class="save"
        id="savePlaylist"
        type="button"
      >
        作成
      </button>

    </div>

  </div>

</div>


<script>

/* app.html 内のナビゲーション補助 */
document.addEventListener(
  "DOMContentLoaded",
  ()=>{
    const homeLink =
      document.querySelector("a.back");

    if(
      homeLink &&
      window.parent &&
      window.parent !== window
    ){
      homeLink.addEventListener(
        "click",
        event=>{
          event.preventDefault();
          window.parent.postMessage(
            {
              type:"NOVARADIO_NAV",
              page:"home"
            },
            "*"
          );
        }
      );
    }
  }
);

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentSession =
  null;

let currentPlaylistId =
  null;

/* プレイリストプレイヤー状態 */
let currentPlaylistSongs = [];
let playlistPlayOrder = [];
let playlistPlayIndex = -1;
let playlistShuffleEnabled = false;
/* "off" → "all" → "one" */
let playlistRepeatMode = "off";
let activePlaylistAudio = null;

let currentMiniSong = null;
let standaloneQueue = [];


const loading =
  document.getElementById(
    "loading"
  );

const mypage =
  document.getElementById(
    "mypage"
  );

const likedSongs =
  document.getElementById(
    "likedSongs"
  );

const playlistList =
  document.getElementById(
    "playlistList"
  );

const playlistModal =
  document.getElementById(
    "playlistModal"
  );

const playlistNameInput =
  document.getElementById(
    "playlistNameInput"
  );

const playlistDetail =
  document.getElementById(
    "playlistDetail"
  );

const playlistDetailTitle =
  document.getElementById(

  if(error){

      "ログイン状態を確認できませんでした。";

    return;

  loading.style.display =

async function loadProfile(){

  const fallbackName =
    currentSession.user.user_metadata?.artist_name ||
    "ユーザー";

  document
  .getElementById("username")
  .textContent =
    fallbackName;

  renderProfileAvatar(null);

  profileBio.style.display =
    "none";

  profileLinks.style.display =
    "none";

  profileLinks.innerHTML =
    "";


  const {
    data,
    error
  } =
  await sb
  .from("profiles")
  .select(
    "artist_name,avatar_url,bio,instagram_url,x_url,tiktok_url,youtube_url,website_url"
  )
  .eq(
    "user_id",
    currentSession.user.id
  )
  .limit(1);


  if(error){

    console.error(
      "Profile load error:",
      error
    );

    return;
  }


  if(
    !data ||
    !data.length
  ){
    return;
  }


  const profile =
    data[0];


  document
  .getElementById("username")
  .textContent =
    profile.artist_name ||
    fallbackName;


  renderProfileAvatar(
    profile.avatar_url ||
    null
  );


  const bioText =
    String(
      profile.bio || ""
    )
    .trim();


  if(bioText){

    profileBio.textContent =
      bioText;

    profileBio.style.display =
      "block";

  }else{

    profileBio.textContent =
      "";

    profileBio.style.display =
      "none";

  }


  renderProfileLinks(
    profile
  );

}


function renderProfileAvatar(
  url
){

  profileAvatar.innerHTML =
    "";


  if(!url){

    profileAvatar.textContent =
      "👤";

    return;
  }


  const image =
    document.createElement(
      "img"
    );


  image.src =
    url;


  image.alt =
    "プロフィール画像";


  image.referrerPolicy =
    "no-referrer";


  image.addEventListener(
    "error",
    ()=>{

      profileAvatar.innerHTML =
        "";

      profileAvatar.textContent =
        "👤";

    }
  );


  profileAvatar.appendChild(
    image
  );

}


function renderProfileLinks(
  profile
){

  profileLinks.innerHTML =
    "";


  const links = [

    {
      label:"Instagram",
      emoji:"📸",
      url:profile.instagram_url
    },

    {
      label:"X",
      emoji:"𝕏",
      url:profile.x_url
    },

    {
      label:"TikTok",
      emoji:"🎵",
      url:profile.tiktok_url
    },

    {
      label:"YouTube",
      emoji:"▶️",
      url:profile.youtube_url
    },

    {
      label:"Website",
      emoji:"🌐",
      url:profile.website_url
    }

  ];


  links.forEach(
    link=>{

      const url =
        safeHttpUrl(
          link.url
        );


      if(!url){
        return;
      }


      const anchor =
        document.createElement(
          "a"
        );


      anchor.className =
        "profile-link";


      anchor.href =
        url;


      anchor.target =
        "_blank";


      anchor.rel =
        "noopener noreferrer";


      anchor.textContent =
        `${link.emoji} ${link.label}`;


      profileLinks.appendChild(
        anchor
      );

    }
  );


  profileLinks.style.display =
    profileLinks.children.length
      ? "flex"
      : "none";

}


function safeHttpUrl(
  value
){

  const raw =
    String(
      value || ""
    )
    .trim();


  if(!raw){
    return null;
  }


  try{

    const url =
      new URL(
        raw
      );


    if(
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ){

      return null;

    }


    return url.href;

  }
  catch{

    return null;

  }

}

async function loadLikedSongs(){

  likedSongs.innerHTML =
    `<div class="empty">
      いいねした曲を読み込んでいます…
    </div>`;


  const {
    data:likes,
    error:likesError
  } =
  await sb
  .from("likes")
  .select("song_id")
  .eq(
    "user_id",
    currentSession.user.id
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(likesError){

    likedSongs.innerHTML =
      `<div class="empty">
        いいねした曲を取得できませんでした。<br><br>
        ${escapeHtml(likesError.message)}
      </div>`;

    return;
  }


  if(
    !likes ||
    !likes.length
  ){

    likedSongs.innerHTML =
      `<div class="empty">
        まだいいねした曲はありません。
      </div>`;

    return;
  }


  const songIds =
    [
      ...new Set(
        likes.map(
          like=>like.song_id
        )
      )
    ];


  const {
    data:songs,
    error:songsError
  } =
  await sb
  .from("songs")
  .select("*")
  .in(
    "id",
    songIds
  );


  if(songsError){

    likedSongs.innerHTML =
      `<div class="empty">
        曲情報を取得できませんでした。<br><br>
        ${escapeHtml(songsError.message)}
      </div>`;

    return;
  }


  const songMap =
    new Map(
      (songs || []).map(
        song=>[
          Number(song.id),
          song
        ]
      )
    );


  likedSongs.innerHTML =
    "";


  songIds.forEach(
    songId=>{

      const song =
        songMap.get(
          Number(songId)
        );


      if(!song){
        return;
      }


      const item =
        createSongItem(
          song,
          "like"
        );


      likedSongs.appendChild(
        item
      );

    }
  );


  if(
    !likedSongs.children.length
  ){

    likedSongs.innerHTML =
      `<div class="empty">
        まだいいねした曲はありません。
      </div>`;

  }

}

async function openPlaylist(
  playlist
){

  currentPlaylistId =
    playlist.id;

  currentPlaylistSongs = [];
  playlistPlayOrder = [];
  playlistPlayIndex = -1;
  playlistPlayerControls.style.display = "none";
  playlistNowPlaying.style.display = "none";


  playlistDetailTitle.textContent =
    "📚 " +
    (
      playlist.name ||
      "無題のプレイリスト"
    );


  playlistSongs.innerHTML =
    `<div class="empty">
      曲を読み込んでいます…
    </div>`;


  playlistDetail.classList.add(
    "show"
  );


  playlistDetail.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });


  const {
    data:relations,
    error
  } =
  await sb
  .from("playlist_songs")
  .select("*")
  .eq(
    "playlist_id",
    playlist.id
  )
  .eq(
    "user_id",
    currentSession.user.id
  )
  .order(
    "created_at",
    {
      ascending:true
    }
  );


  if(error){

    playlistSongs.innerHTML =
      `<div class="empty">
        プレイリストを取得できませんでした。<br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if(
    !relations ||
    !relations.length
  ){

    playlistSongs.innerHTML =
      `<div class="empty">
        このプレイリストにはまだ曲がありません。
      </div>`;

    return;
  }


  const songIds =
    relations.map(
      row=>row.song_id
    );


  const {
    data:songs,
    error:songsError
  } =
  await sb
  .from("songs")
  .select("*")
  .in(
    "id",
    songIds
  );


  if(songsError){

    playlistSongs.innerHTML =
      `<div class="empty">
        曲情報を取得できませんでした。<br><br>
        ${escapeHtml(songsError.message)}
      </div>`;

    return;
  }


  const songMap =
    new Map(
      (songs || []).map(
        song=>[
          Number(song.id),
          song
        ]
      )
    );


  currentPlaylistSongs =
    relations
    .map(relation=>{
      const song = songMap.get(
        Number(relation.song_id)
      );
      return song
        ? {song, relation}
        : null;
    })
    .filter(Boolean);

  playlistPlayOrder =
    currentPlaylistSongs.map(
      (_, index)=>index
    );

  playlistPlayIndex = -1;

  playlistPlayerControls.style.display =
    currentPlaylistSongs.length
      ? "grid"
      : "none";

  updatePlaylistControlLabels();

  playlistSongs.innerHTML =
    "";


  relations.forEach(
    relation=>{

      const song =
        songMap.get(
          Number(
            relation.song_id
          )
        );


      if(!song){
        return;
      }


      const item =
        createSongItem(
          song,
          "playlist",
          relation
        );


      playlistSongs.appendChild(
        item
      );

    }
  );


  if(
    !playlistSongs.children.length
  ){

    playlistSongs.innerHTML =
      `<div class="empty">
        このプレイリストにはまだ曲がありません。
      </div>`;

  }

}

async function deletePlaylist(
  playlist
){

  const ok =
    confirm(
      `「${playlist.name}」を削除しますか？`
    );


  if(!ok){
    return;
  }


  /* 先に中身を削除 */

  const {
    error:relationError
  } =
  await sb
  .from("playlist_songs")
  .delete()
  .eq(
    "playlist_id",
    playlist.id
  )
  .eq(
    "user_id",
    currentSession.user.id
  );


  if(relationError){

    alert(
      "プレイリスト内の曲削除に失敗しました：" +
      relationError.message
    );

    return;
  }


  /* プレイリスト本体削除 */

  const {
    error
  } =
  await sb
  .from("playlists")
  .delete()
  .eq(
    "id",
    playlist.id
  )
  .eq(
    "user_id",
    currentSession.user.id
  );


  if(error){

    alert(
      "プレイリスト削除に失敗しました：" +
      error.message
    );

    return;
  }


  if(
    Number(currentPlaylistId) ===
    Number(playlist.id)
  ){

    currentPlaylistId =
      null;

    playlistDetail.classList.remove(
      "show"
    );

  }


  await loadPlaylists();

}

function createSongItem(
  song,
  type,
  relation=null
){

  const item =
    document.createElement(
      "div"
    );


  item.className =
    type === "playlist"
      ? "playlist-song"
      : "liked-song";


  const genreText =
    formatTags(
      song.genre
    );


  const moodText =
    formatTags(
      song.mood
    );


  item.innerHTML =
    `<div class="${
      type === "playlist"
        ? "playlist-song-title"
        : "liked-title"
    }">
      ${escapeHtml(
        song.title ||
        "Untitled"
      )}
    </div>

    <div class="${
      type === "playlist"
        ? "playlist-song-artist"
        : "liked-artist"
    }">
      ${escapeHtml(
        song.artist ||
        "Unknown Artist"
      )}
    </div>

    <div class="${
      type === "playlist"
        ? "playlist-song-meta"
        : "liked-meta"
    }">
      ${escapeHtml(
        genreText
      )}

      ${
        moodText
          ? " · " +
            escapeHtml(
              moodText
            )
          : ""
      }
    </div>

    <div class="song-buttons">

      <button
        type="button"
        class="play-song"
      >
        ▶️ 再生
      </button>

      <button
        type="button"
        class="${
          type === "playlist"
            ? "remove-playlist-song"
            : "remove-like"
        }"
      >
        ${
          type === "playlist"
            ? "🗑️ プレイリストから外す"
            : "💔 いいね解除"
        }
      </button>

    </div>`;


  item
  .querySelector(
    ".play-song"
  )
  .addEventListener(
    "click",
    ()=>{

      if(type === "playlist"){
        playPlaylistFromSong(song.id);
      }else{
        playStandaloneSong(
          song
        );
      }

    }
  );


  if(
    type ===
    "playlist"
  ){

    item
    .querySelector(
      ".remove-playlist-song"
    )
    .addEventListener(
      "click",
      async ()=>{

        await removePlaylistSong(
          relation
        );

      }
    );

  }
  else{

    item
    .querySelector(
      ".remove-like"
    )
    .addEventListener(
      "click",
      async ()=>{

        await removeLike(
          song
        );

      }
    );

  }


  return item;

}


/* =========================
   再生
========================= */

function toggleAudio(
  item,
  song
){

  const old =
    item.querySelector(
      "audio"
    );


  if(old){

    old.pause();
    old.remove();

    return;
  }


  if(!song.audio_url){

    alert(
      "この曲には音源がありません。"
    );

    return;
  }


  document
  .querySelectorAll(
    ".song-audio"
  )
  .forEach(
    audio=>{

      audio.pause();
      audio.remove();

    }
  );


  const audio =
    document.createElement(
      "audio"
    );


  audio.className =
    "song-audio";


  audio.controls =
    true;


  audio.autoplay =
    true;


  audio.src =
    song.audio_url;


  item.appendChild(
    audio
  );


  audio
  .play()
  .catch(()=>{});

}

    }
    else{

    }

    updatePlaylistControlLabels();
  }
);


function updatePlaylistControlLabels(){

  playlistShuffle.textContent =
    playlistShuffleEnabled
      ? "🔀 シャッフル ON"
      : "🔀 シャッフル OFF";

  playlistShuffle.classList.toggle(
    "active",
    playlistShuffleEnabled
  );

  if(playlistRepeatMode === "all"){
    playlistRepeat.textContent =
      "🔁 全曲リピート";
  }
  else if(playlistRepeatMode === "one"){
    playlistRepeat.textContent =
      "🔂 1曲リピート";
  }
  else{
    playlistRepeat.textContent =
      "🔁 リピート OFF";
  }

  playlistRepeat.classList.toggle(
    "active",
    playlistRepeatMode !== "off"
  );

  miniShuffle.classList.toggle(
    "active",
    playlistShuffleEnabled
  );

  miniRepeat.textContent =
    playlistRepeatMode === "one"
      ? "🔂"
      : "🔁";

  miniRepeat.classList.toggle(
    "active",
    playlistRepeatMode !== "off"
  );

}


function buildPlaylistOrder(){

  playlistPlayOrder =
    currentPlaylistSongs.map(
      (_, index)=>index
    );

  if(playlistShuffleEnabled){

    for(
      let i =
        playlistPlayOrder.length - 1;
      i > 0;
      i--
    ){

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [
        playlistPlayOrder[i],
        playlistPlayOrder[j]
      ] = [
        playlistPlayOrder[j],
        playlistPlayOrder[i]
      ];

    }

  }

}


function playPlaylistFromSong(
  songId
){

  if(!currentPlaylistSongs.length){
    return;
  }

  const clickedIndex =
    currentPlaylistSongs.findIndex(
      entry=>
        Number(entry.song.id) ===
        Number(songId)
    );

  if(clickedIndex < 0){
    return;
  }

  buildPlaylistOrder();

  /* 手動で選んだ曲は必ず最初に再生 */
  playlistPlayOrder =
    playlistPlayOrder.filter(
      index=>index !== clickedIndex
    );

  playlistPlayOrder.unshift(
    clickedIndex
  );

  playlistPlayIndex = 0;

  playPlaylistIndex();

}


function playPlaylistIndex(){

  if(
    playlistPlayIndex < 0 ||
    playlistPlayIndex >=
      playlistPlayOrder.length
  ){
    return;
  }

  const sourceIndex =
    playlistPlayOrder[
      playlistPlayIndex
    ];

  const entry =
    currentPlaylistSongs[
      sourceIndex
    ];

  if(!entry){
    return;
  }

  const song =
    entry.song;

  if(!song.audio_url){

    playlistPlayIndex++;

    if(
      playlistPlayIndex <
      playlistPlayOrder.length
    ){
      playPlaylistIndex();
    }

    return;
  }

  document
  .querySelectorAll(
    ".playlist-song"
  )
  .forEach(
    card=>
      card.classList.remove(
        "is-playing"
      )
  );

  const cards =
    Array.from(
      playlistSongs.children
    );

  if(cards[sourceIndex]){
    cards[sourceIndex]
      .classList.add(
        "is-playing"
      );
  }

  playSongInMiniPlayer(
    song
  );

}


function handlePlaylistEnded(){

  if(playlistRepeatMode === "one"){

    globalAudio.currentTime = 0;

    globalAudio
    .play()
    .catch(()=>{});

    return;
  }

  playlistPlayIndex++;

  if(
    playlistPlayIndex <
    playlistPlayOrder.length
  ){
    playPlaylistIndex();
    return;
  }

  if(playlistRepeatMode === "all"){

    buildPlaylistOrder();

    playlistPlayIndex = 0;

    playPlaylistIndex();

    return;
  }

  miniPlayPause.textContent =
    "▶";

}


function stopPlaylistPlayback(
  clearLabel=true
){

  globalAudio.pause();

  if(clearLabel){

    currentMiniSong = null;

    globalAudio.removeAttribute(
      "src"
    );

    globalAudio.load();

    miniPlayer.classList.remove(
      "show"
    );

    miniSeek.value =
      0;

    miniCurrentTime.textContent =
      "0:00";

    miniDuration.textContent =
      "0:00";

  }

  document
  .querySelectorAll(
    ".playlist-song.is-playing"
  )
  .forEach(
    card=>
      card.classList.remove(
        "is-playing"
      )
  );

}


/* =========================
   共通プレイヤー状態
   Home / My Page 間で共有
========================= */

function saveSharedPlayerState(){

  if(!currentMiniSong){
    return;
  }

  const queue =
    currentPlaylistSongs
    .map(entry=>entry?.song)
    .filter(Boolean);

  const state = {
    song:currentMiniSong,
    queue:queue,
    currentIndex:playlistPlayIndex,
    playOrder:playlistPlayOrder,
    shuffle:playlistShuffleEnabled,
    repeat:playlistRepeatMode,
    currentTime:Number(
      globalAudio.currentTime || 0
    ),
    wasPlaying:!globalAudio.paused,
    savedAt:Date.now()
  };

  try{
    localStorage.setItem(
      "novaradio_player_state",
      JSON.stringify(state)
    );
  }
  catch(error){
    console.warn(
      "Shared player state save failed:",
      error
    );
  }

}


async function restoreSharedPlayerState(){

  let raw;

  try{
    raw =
      localStorage.getItem(
        "novaradio_player_state"
      );
  }
  catch{
    return;
  }

  if(!raw){
    return;
  }

  try{

    const state =
      JSON.parse(raw);

    if(
      !state ||
      !state.song ||
      !state.song.audio_url
    ){
      return;
    }

    currentMiniSong =
      state.song;

    const queue =
      Array.isArray(state.queue) &&
      state.queue.length
        ? state.queue
        : [state.song];

    currentPlaylistSongs =
      queue.map(
        song=>({
          song,
          relation:null
        })
      );

    playlistPlayOrder =
      Array.isArray(state.playOrder) &&
      state.playOrder.length ===
        currentPlaylistSongs.length
        ? state.playOrder
        : currentPlaylistSongs.map(
            (_, index)=>index
          );

    const foundIndex =
      playlistPlayOrder.findIndex(
        index=>
          Number(
            currentPlaylistSongs[
              index
            ]?.song?.id
          ) ===
          Number(
            state.song.id
          )
      );

    playlistPlayIndex =
      Number.isInteger(
        state.currentIndex
      )
        ? Math.max(
            0,
            Math.min(
              state.currentIndex,
              playlistPlayOrder.length - 1
            )
          )
        : Math.max(
            0,
            foundIndex
          );

    playlistShuffleEnabled =
      !!state.shuffle;

    playlistRepeatMode =
      ["off","all","one"].includes(
        state.repeat
      )
        ? state.repeat
        : "off";

    updatePlaylistControlLabels();

    miniPlayer.classList.add(
      "show"
    );

    const coverUrl =
      safeHttpUrl(
        currentMiniSong.cover_url
      );

    miniCover.innerHTML =
      coverUrl
        ? `<img
            src="${escapeHtml(
              coverUrl
            )}"
            alt="${escapeHtml(
              (currentMiniSong.title || "ジャケット") +
              " のジャケット"
            )}"
          >`
        : "🎵";

    miniTitle.textContent =
      currentMiniSong.title ||
      "Untitled";

    miniArtist.textContent =
      currentMiniSong.artist ||
      "Unknown Artist";

    globalAudio.src =
      currentMiniSong.audio_url;

    globalAudio.load();

    const restoreTime =
      Number(
        state.currentTime || 0
      );

    const applyRestoreTime =
      ()=>{

        if(
          Number.isFinite(
            restoreTime
          ) &&
          restoreTime > 0
        ){

          globalAudio.currentTime =
            Math.min(
              restoreTime,
              Number.isFinite(
                globalAudio.duration
              )
                ? Math.max(
                    0,
                    globalAudio.duration - 0.25
                  )
                : restoreTime
            );

        }

      };

    if(
      globalAudio.readyState >= 1
    ){
      applyRestoreTime();
    }
    else{
      globalAudio.addEventListener(
        "loadedmetadata",
        applyRestoreTime,
        {once:true}
      );
    }

    if(state.wasPlaying){

      globalAudio
      .play()
      .catch(
        ()=>{
          miniPlayPause.textContent =
            "▶";
        }
      );

    }
    else{
      miniPlayPause.textContent =
        "▶";
    }

  }
  catch(error){

    console.warn(
      "Shared player state restore failed:",
      error
    );

  }

}


function isInsideNovaApp(){
  return (
    window.parent &&
    window.parent !== window
  );
}

function sendPlayToNovaApp(song){
  if(!isInsideNovaApp()){
    return false;
  }

  const queue =
    currentPlaylistSongs
    .map(entry=>entry?.song)
    .filter(Boolean);

  window.parent.postMessage(
    {
      type:"NOVARADIO_PLAY",
      song:song,
      queue:queue,
      index:queue.findIndex(
        item=>
          Number(item.id) ===
          Number(song.id)
      )
    },
    "*"
  );

  return true;
}

/* =========================
   固定ミニプレイヤー
========================= */

function playSongInMiniPlayer(
  song
){

  const delegatedToApp =
    sendPlayToNovaApp(
      song
    );

  if(
    !song ||
    !song.audio_url
  ){

    alert(
      "この曲には音源がありません。"
    );

    return;
  }

  currentMiniSong =
    song;

  miniPlayer.classList.add(
    "show"
  );

  const coverUrl =
    safeHttpUrl(
      song.cover_url
    );

  miniCover.innerHTML =
    coverUrl
      ? `<img
          src="${escapeHtml(
            coverUrl
          )}"
          alt="${escapeHtml(
            (song.title || "ジャケット") +
            " のジャケット"
          )}"
        >`
      : "🎵";

  miniTitle.textContent =
    song.title ||
    "Untitled";

  miniArtist.textContent =
    song.artist ||
    "Unknown Artist";

  if(delegatedToApp){
    return;
  }

  if(
    globalAudio.src !==
    song.audio_url
  ){

    globalAudio.src =
      song.audio_url;

    globalAudio.load();

  }

  globalAudio
  .play()
  .then(
    ()=>{
      miniPlayPause.textContent =
        "⏸";
      saveSharedPlayerState();
    }
  )
  .catch(
    ()=>{
      miniPlayPause.textContent =
        "▶";
      saveSharedPlayerState();
    }
  );

}


function playStandaloneSong(
  song
){

  currentPlaylistSongs =
    [
      {
        song,
        relation:null
      }
    ];

  playlistPlayOrder =
    [0];

  playlistPlayIndex =
    0;

  playSongInMiniPlayer(
    song
  );

}


function playNextTrack(){

  if(
    !currentPlaylistSongs.length
  ){
    return;
  }

  if(
    playlistRepeatMode ===
    "one"
  ){

    globalAudio.currentTime =
      0;

    globalAudio
    .play()
    .catch(()=>{});

    return;
  }

  playlistPlayIndex++;

  if(
    playlistPlayIndex >=
    playlistPlayOrder.length
  ){

    if(
      playlistRepeatMode ===
      "all"
    ){

      buildPlaylistOrder();

      playlistPlayIndex =
        0;

    }else{

      playlistPlayIndex =
        playlistPlayOrder.length - 1;

      return;
    }

  }

  playPlaylistIndex();

}


function playPreviousTrack(){

  if(
    !currentPlaylistSongs.length
  ){
    return;
  }

  if(
    globalAudio.currentTime >
    3
  ){

    globalAudio.currentTime =
      0;

    return;
  }

  playlistPlayIndex--;

  if(
    playlistPlayIndex < 0
  ){

    if(
      playlistRepeatMode ===
      "all"
    ){

      playlistPlayIndex =
        playlistPlayOrder.length - 1;

    }else{

      playlistPlayIndex =
        0;

      globalAudio.currentTime =
        0;

      return;
    }

  }

  playPlaylistIndex();

}


function formatTime(
  seconds
){

  if(
    !Number.isFinite(
      seconds
    )
  ){
    return "0:00";
  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    Math.floor(
      seconds % 60
    );

  return (
    minutes +
    ":" +
    String(secs)
    .padStart(
      2,
      "0"
    )
  );

}


miniPlayPause.addEventListener(
  "click",
  ()=>{

    if(isInsideNovaApp()){
      window.parent.postMessage(
        {type:"NOVARADIO_TOGGLE"},
        "*"
      );
      return;
    }

    if(!currentMiniSong){
      return;
    }

    if(globalAudio.paused){

      globalAudio
      .play()
      .catch(()=>{});

    }else{

      globalAudio.pause();

    }

  }
);


miniPrev.addEventListener(
  "click",
  ()=>{
    if(isInsideNovaApp()){
      window.parent.postMessage(
        {type:"NOVARADIO_PREV"},
        "*"
      );
      return;
    }
    playPreviousTrack();
  }
);


miniNext.addEventListener(
  "click",
  ()=>{
    if(isInsideNovaApp()){
      window.parent.postMessage(
        {type:"NOVARADIO_NEXT"},
        "*"
      );
      return;
    }
    playNextTrack();
  }
);


miniShuffle.addEventListener(
  "click",
  ()=>{

    playlistShuffleEnabled =
      !playlistShuffleEnabled;

    miniShuffle.classList.toggle(
      "active",
      playlistShuffleEnabled
    );

    updatePlaylistControlLabels();

  }
);


miniRepeat.addEventListener(
  "click",
  ()=>{

    if(
      playlistRepeatMode ===
      "off"
    ){
      playlistRepeatMode =
        "all";
    }
    else if(
      playlistRepeatMode ===
      "all"
    ){
      playlistRepeatMode =
        "one";
    }
    else{
      playlistRepeatMode =
        "off";
    }

    miniRepeat.textContent =
      playlistRepeatMode ===
      "one"
        ? "🔂"
        : "🔁";

    miniRepeat.classList.toggle(
      "active",
      playlistRepeatMode !==
      "off"
    );

    updatePlaylistControlLabels();

  }
);


globalAudio.addEventListener(
  "play",
  ()=>{

    miniPlayPause.textContent =
      "⏸";

    saveSharedPlayerState();

  }
);


globalAudio.addEventListener(
  "pause",
  ()=>{

    miniPlayPause.textContent =
      "▶";

    saveSharedPlayerState();

  }
);


globalAudio.addEventListener(
  "loadedmetadata",
  ()=>{

    miniDuration.textContent =
      formatTime(
        globalAudio.duration
      );

  }
);


globalAudio.addEventListener(
  "timeupdate",
  ()=>{

    miniCurrentTime.textContent =
      formatTime(
        globalAudio.currentTime
      );

    if(
      Number.isFinite(
        globalAudio.duration
      ) &&
      globalAudio.duration > 0
    ){

      miniSeek.value =
        (
          globalAudio.currentTime /
          globalAudio.duration
        ) * 100;

    }

    if(
      Math.floor(
        globalAudio.currentTime
      ) % 2 === 0
    ){
      saveSharedPlayerState();
    }

  }
);


globalAudio.addEventListener(
  "ended",
  handlePlaylistEnded
);


miniSeek.addEventListener(
  "input",
  ()=>{

    if(
      !Number.isFinite(
        globalAudio.duration
      ) ||
      globalAudio.duration <= 0
    ){
      return;
    }

    globalAudio.currentTime =
      (
        Number(
          miniSeek.value
        ) / 100
      ) *
      globalAudio.duration;

    saveSharedPlayerState();

  }
);

/* =========================

========================= */

function formatTags(
  value
){

  if(!value){
    return "";
  }


  return String(value)
    .split(",")
    .map(
      value=>value.trim()
    )
    .filter(Boolean)
    .join(" / ");

}


function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}
