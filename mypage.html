<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio - My Page</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at 50% 0,#211b50,#080a18 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(900px,94vw);
  margin:auto;
  padding:40px 0 80px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.logo{
  font-size:32px;
  font-weight:800;
}

.back{
  color:#fff;
  text-decoration:none;
  padding:11px 16px;
  background:#101228;
  border:1px solid #343b67;
  border-radius:14px;
}

.profile{
  text-align:center;
  padding:40px 20px;
  margin-bottom:25px;
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
}

.avatar{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  background:linear-gradient(135deg,#7b25ff,#159df5);
}

.username{
  margin-top:18px;
  font-size:28px;
  font-weight:800;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:24px;
  padding:25px;
  margin-bottom:18px;
}

.card h2{
  margin:0 0 18px;
  font-size:21px;
}

.empty{
  padding:22px;
  text-align:center;
  border-radius:16px;
  background:#080b1d;
  color:#8f93ad;
}

.liked-list{
  display:grid;
  gap:12px;
}

.liked-song{
  padding:18px;
  border-radius:18px;
  background:#080b1d;
  border:1px solid #30355e;
}

.liked-title{
  font-size:18px;
  font-weight:800;
}

.liked-artist{
  margin-top:5px;
  color:#adb1c9;
}

.liked-meta{
  margin-top:7px;
  font-size:13px;
  color:#858baa;
}

.song-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.song-buttons button{
  padding:12px;
  border:0;
  border-radius:13px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.play-song{
  background:#242842;
}

.remove-like{
  background:#56283a;
}

.song-audio{
  width:100%;
  margin-top:14px;
}

.action{
  display:block;
  width:100%;
  margin-top:12px;
  padding:16px;
  border:0;
  border-radius:16px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  background:#171a31;
  border:1px solid #343b67;
}

.primary{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border:0;
}

.logout{
  background:#35202a;
  border:1px solid #633846;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:80px 0;
}

@media(max-width:600px){

  .logo{
    font-size:27px;
  }

  .username{
    font-size:24px;
  }

  .song-buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<main class="wrap">

<header>

  <div class="logo">
    NovaRadio
  </div>

  <a
    class="back"
    href="home.html"
  >
    ← Home
  </a>

</header>


<div
  id="loading"
  class="loading"
>
  マイページを読み込んでいます…
</div>


<div
  id="mypage"
  style="display:none"
>

  <section class="profile">

    <div class="avatar">
      👤
    </div>

    <div
      class="username"
      id="username"
    >
      User
    </div>

  </section>


  <section class="card">

    <h2>
      ❤️ いいねした曲
    </h2>

    <div
      id="likedSongs"
      class="liked-list"
    >
      <div class="empty">
        読み込んでいます…
      </div>
    </div>

  </section>


  <section class="card">

    <h2>
      📚 マイプレイリスト
    </h2>

    <div class="empty">
      まだプレイリストはありません。
    </div>

    <button
      class="action primary"
      type="button"
      id="createPlaylist"
    >
      ＋ プレイリストを作る
    </button>

  </section>


  <section class="card">

    <h2>
      ⚙️ アカウント
    </h2>

    <button
      class="action"
      type="button"
      id="accountSettings"
    >
      アカウント設定
    </button>

    <button
      class="action logout"
      type="button"
      id="logout"
    >
      🚪 ログアウト
    </button>

  </section>

</div>

</main>


<script>

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentSession = null;

const loading =
  document.getElementById("loading");

const mypage =
  document.getElementById("mypage");

const likedSongs =
  document.getElementById("likedSongs");


async function init(){

  const {
    data:{session},
    error
  } =
  await sb.auth.getSession();

  if(error){

    loading.textContent =
      "ログイン状態を確認できませんでした。";

    console.error(error);

    return;
  }

  if(!session){

    location.href =
      "index.html";

    return;
  }

  currentSession =
    session;

  const name =
    session.user.user_metadata?.artist_name ||
    "ユーザー";

  document
  .getElementById("username")
  .textContent =
    name;

  loading.style.display =
    "none";

  mypage.style.display =
    "block";

  await loadLikedSongs();
}


async function loadLikedSongs(){

  likedSongs.innerHTML =
    `<div class="empty">
      いいねした曲を読み込んでいます…
    </div>`;


  const {
    data:likes,
    error:likesError
  } =
  await sb
  .from("likes")
  .select("song_id")
  .eq(
    "user_id",
    currentSession.user.id
  )
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(likesError){

    likedSongs.innerHTML =
      `<div class="empty">
        いいねした曲を取得できませんでした。<br><br>
        ${escapeHtml(likesError.message)}
      </div>`;

    return;
  }


  if(
    !likes ||
    !likes.length
  ){

    likedSongs.innerHTML =
      `<div class="empty">
        まだいいねした曲はありません。
      </div>`;

    return;
  }


  const songIds =
    [
      ...new Set(
        likes.map(
          like=>like.song_id
        )
      )
    ];


  const {
    data:songs,
    error:songsError
  } =
  await sb
  .from("songs")
  .select("*")
  .in(
    "id",
    songIds
  );


  if(songsError){

    likedSongs.innerHTML =
      `<div class="empty">
        曲情報を取得できませんでした。<br><br>
        ${escapeHtml(songsError.message)}
      </div>`;

    return;
  }


  const songMap =
    new Map(
      (songs || []).map(
        song=>[
          Number(song.id),
          song
        ]
      )
    );


  likedSongs.innerHTML =
    "";


  songIds.forEach(songId=>{

    const song =
      songMap.get(
        Number(songId)
      );

    if(!song){
      return;
    }

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "liked-song";


    const genreText =
      formatTags(song.genre);

    const moodText =
      formatTags(song.mood);


    item.innerHTML =
      `<div class="liked-title">
        ${escapeHtml(song.title || "Untitled")}
      </div>

      <div class="liked-artist">
        ${escapeHtml(song.artist || "Unknown Artist")}
      </div>

      <div class="liked-meta">
        ${escapeHtml(genreText)}
        ${
          moodText
            ? " · " +
              escapeHtml(moodText)
            : ""
        }
      </div>

      <div class="song-buttons">

        <button
          type="button"
          class="play-song"
        >
          ▶️ 再生
        </button>

        <button
          type="button"
          class="remove-like"
        >
          💔 いいね解除
        </button>

      </div>`;


    item
    .querySelector(
      ".play-song"
    )
    .addEventListener(
      "click",
      ()=>{

        toggleAudio(
          item,
          song
        );

      }
    );


    item
    .querySelector(
      ".remove-like"
    )
    .addEventListener(
      "click",
      async ()=>{

        await removeLike(
          song
        );

      }
    );


    likedSongs.appendChild(
      item
    );

  });


  if(
    !likedSongs.children.length
  ){

    likedSongs.innerHTML =
      `<div class="empty">
        まだいいねした曲はありません。
      </div>`;

  }
}


function toggleAudio(
  item,
  song
){

  const old =
    item.querySelector(
      "audio"
    );

  if(old){

    old.pause();
    old.remove();

    return;
  }


  if(!song.audio_url){

    alert(
      "この曲には音源がありません。"
    );

    return;
  }


  document
  .querySelectorAll(
    ".song-audio"
  )
  .forEach(audio=>{

    audio.pause();
    audio.remove();

  });


  const audio =
    document.createElement(
      "audio"
    );

  audio.className =
    "song-audio";

  audio.controls =
    true;

  audio.autoplay =
    true;

  audio.src =
    song.audio_url;

  item.appendChild(
    audio
  );

  audio
  .play()
  .catch(()=>{});
}


async function removeLike(song){

  const ok =
    confirm(
      `「${song.title}」のいいねを解除しますか？`
    );

  if(!ok){
    return;
  }


  const {
    error
  } =
  await sb
  .from("likes")
  .delete()
  .eq(
    "user_id",
    currentSession.user.id
  )
  .eq(
    "song_id",
    song.id
  );


  if(error){

    alert(
      "いいね解除に失敗しました：" +
      error.message
    );

    return;
  }


  await loadLikedSongs();
}


function formatTags(value){

  if(!value){
    return "";
  }

  return String(value)
    .split(",")
    .map(
      value=>value.trim()
    )
    .filter(Boolean)
    .join(" / ");
}


function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


document
.getElementById("createPlaylist")
.addEventListener(
  "click",
  ()=>{

    alert(
      "プレイリスト作成機能は次に追加します 🎧"
    );

  }
);


document
.getElementById("accountSettings")
.addEventListener(
  "click",
  ()=>{

    alert(
      "アカウント設定は次に追加します。"
    );

  }
);


document
.getElementById("logout")
.addEventListener(
  "click",
  async ()=>{

    await sb.auth.signOut();

    location.href =
      "index.html";

  }
);


init();

</script>

</body>
</html>
