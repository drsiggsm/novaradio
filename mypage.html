<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio - My Page</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at 50% 0,#211b50,#080a18 55%,#050611);
  color:#fff;
}

.wrap{
  width:min(900px,94vw);
  margin:auto;
  padding:40px 0 80px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:40px;
}

.logo{
  font-size:32px;
  font-weight:800;
}

.back{
  color:#fff;
  text-decoration:none;
  padding:11px 16px;
  background:#101228;
  border:1px solid #343b67;
  border-radius:14px;
}

.profile{
  text-align:center;
  padding:40px 20px;
  margin-bottom:25px;
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:28px;
}

.avatar{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  background:linear-gradient(135deg,#7b25ff,#159df5);
}

.username{
  margin-top:18px;
  font-size:28px;
  font-weight:800;
}

.card{
  background:#101228e8;
  border:1px solid #30355e;
  border-radius:24px;
  padding:25px;
  margin-bottom:18px;
}

.card h2{
  margin:0 0 18px;
  font-size:21px;
}

.empty{
  padding:22px;
  text-align:center;
  border-radius:16px;
  background:#080b1d;
  color:#8f93ad;
}

.action{
  display:block;
  width:100%;
  margin-top:12px;
  padding:16px;
  border:0;
  border-radius:16px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  background:#171a31;
  border:1px solid #343b67;
}

.primary{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border:0;
}

.logout{
  background:#35202a;
  border:1px solid #633846;
}

.loading{
  text-align:center;
  color:#aaa;
  padding:80px 0;
}

@media(max-width:600px){

  .logo{
    font-size:27px;
  }

  .username{
    font-size:24px;
  }

}
</style>
</head>

<body>

<main class="wrap">

<header>

  <div class="logo">
    NovaRadio
  </div>

  <a
    class="back"
    href="home.html"
  >
    ← Home
  </a>

</header>


<div
  id="loading"
  class="loading"
>
  マイページを読み込んでいます…
</div>


<div
  id="mypage"
  style="display:none"
>

  <section class="profile">

    <div class="avatar">
      👤
    </div>

    <div
      class="username"
      id="username"
    >
      User
    </div>

  </section>


  <section class="card">

    <h2>
      ❤️ いいねした曲
    </h2>

    <div class="empty">
      まだいいねした曲はありません。
    </div>

  </section>


  <section class="card">

    <h2>
      📚 マイプレイリスト
    </h2>

    <div class="empty">
      まだプレイリストはありません。
    </div>

    <button
      class="action primary"
      type="button"
      id="createPlaylist"
    >
      ＋ プレイリストを作る
    </button>

  </section>


  <section class="card">

    <h2>
      ⚙️ アカウント
    </h2>

    <button
      class="action"
      type="button"
      id="accountSettings"
    >
      アカウント設定
    </button>

    <button
      class="action logout"
      type="button"
      id="logout"
    >
      🚪 ログアウト
    </button>

  </section>

</div>

</main>


<script>

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const loading =
  document.getElementById("loading");

const mypage =
  document.getElementById("mypage");


async function init(){

  const {
    data:{session},
    error
  } =
  await sb.auth.getSession();


  if(error){

    loading.textContent =
      "ログイン状態を確認できませんでした。";

    return;
  }


  if(!session){

    location.href =
      "index.html";

    return;
  }


  const name =
    session.user.user_metadata?.artist_name ||
    "ユーザー";


  document
  .getElementById("username")
  .textContent =
    name;


  loading.style.display =
    "none";


  mypage.style.display =
    "block";

}


document
.getElementById("createPlaylist")
.addEventListener(
  "click",
  ()=>{

    alert(
      "プレイリスト作成機能は次に追加します 🎧"
    );

  }
);


document
.getElementById("accountSettings")
.addEventListener(
  "click",
  ()=>{

    alert(
      "アカウント設定は次に追加します。"
    );

  }
);


document
.getElementById("logout")
.addEventListener(
  "click",
  async ()=>{

    await sb.auth.signOut();

    location.href =
      "index.html";

  }
);


init();

</script>

</body>
</html>
