<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio App</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#050611;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{overflow:hidden}

button,input{font:inherit}

.app-shell{
  height:100vh;
  display:grid;
  grid-template-rows:64px 1fr 108px;
  background:radial-gradient(circle at 50% 0,#211b50,#07091a 55%,#050611);
}

.app-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #24294d;
  background:#090c1bee;
  backdrop-filter:blur(16px);
  z-index:10;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.nav-buttons{
  display:flex;
  gap:8px;
}

.nav-btn{
  border:1px solid #343b67;
  background:#11152a;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.nav-btn.active{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border-color:transparent;
}

.view{
  position:relative;
  overflow:hidden;
}

.view iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#050611;
}

/* =========================
   共通プレイヤー
========================= */

.player{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:14px;
  padding:14px 18px 10px;
  border-top:1px solid #343b67;
  background:#0b0e20f2;
  backdrop-filter:blur(18px);
  z-index:50;
}

.track{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.cover{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #343b67;
  background:#15182e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.meta{
  min-width:0;
}

.title{
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  font-size:12px;
  color:#9ba0bd;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time{
  margin-top:6px;
  color:#8f94b2;
  font-size:11px;
  font-variant-numeric:tabular-nums;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.ctrl{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid #343b67;
  background:#171a31;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.ctrl:hover{
  border-color:#646ca5;
}

.ctrl.main{
  width:46px;
  height:46px;
  border:0;
  background:linear-gradient(135deg,#7b25ff,#159df5);
  font-size:18px;
}

.ctrl.mode{
  border-radius:12px;
  width:42px;
}

.ctrl.mode.active{
  border-color:#8b36ff;
  background:#24204a;
  box-shadow:0 0 0 1px #8b36ff inset;
}

.ctrl.more{
  border-radius:12px;
  width:42px;
  font-size:21px;
  line-height:1;
}

/* シークバー */
.progress{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:12px;
  background:#181c35;
  cursor:pointer;
  touch-action:none;
}

.progress-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  pointer-events:none;
}

/* =========================
   その他メニュー
========================= */

.more-menu{
  position:fixed;
  right:18px;
  bottom:118px;
  width:min(300px,calc(100vw - 28px));
  padding:10px;
  border:1px solid #343b67;
  border-radius:16px;
  background:#101328f5;
  box-shadow:0 20px 60px #000b;
  backdrop-filter:blur(18px);
  z-index:1000;
  display:none;
}

.more-menu.show{
  display:grid;
  gap:8px;
}

.menu-btn{
  width:100%;
  border:1px solid #343b67;
  border-radius:12px;
  padding:13px 14px;
  background:#171a31;
  color:#fff;
  text-align:left;
  font-weight:800;
  cursor:pointer;
}

.menu-btn:hover{
  border-color:#7b25ff;
}

.menu-btn.liked{
  background:#442136;
  border-color:#8b415b;
}

/* =========================
   プレイリスト選択モーダル
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1500;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(520px,95vw);
  max-height:min(650px,80vh);
  overflow:auto;
  background:#101228;
  border:1px solid #343b67;
  border-radius:22px;
  padding:20px;
  box-shadow:0 24px 80px #000c;
}

.modal-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:8px;
}

.modal-sub{
  color:#9ba0bd;
  font-size:13px;
  margin-bottom:16px;
}

.playlist-list{
  display:grid;
  gap:9px;

.playlist-choice{
  width:100%;
  border:1px solid #343b67;
  border-radius:13px;
  padding:14px;
  background:#080b1d;
  color:#fff;
  text-align:left;
  cursor:pointer;
  font-weight:800;
}

.playlist-choice:hover{

.modal-empty{
  padding:20px;
  text-align:center;
  color:#9ba0bd;
  border:1px solid #343b67;
  border-radius:13px;
  background:#080b1d;

.modal-close{
  width:100%;
  margin-top:12px;
  border:1px solid #343b67;
  border-radius:13px;
  padding:13px;
  background:#171a31;
  color:#fff;
  font-weight:800;
  cursor:pointer;

/* 再生エラー */
.player-status{
  position:fixed;
  left:50%;
  bottom:122px;
  transform:translateX(-50%);
  width:min(620px,92vw);
  border:1px solid #7f4951;
  border-radius:14px;
  padding:10px 14px;
  background:#381e28f5;
  color:#ffdce2;
  font-size:12px;
  z-index:1200;
  display:none;
}

.player-status.show{

@media(max-width:700px){

  .app-shell{
    grid-template-rows:58px 1fr 126px;

  }

  .player{
    grid-template-columns:minmax(0,1fr);

  }

  .cover{

  }

  .controls{
    justify-content:flex-end;
  }

  }

  .ctrl.main{
    width:40px;

  }

  .ctrl.mode,

    width:36px;
  }

  .more-menu{
    right:10px;
    bottom:136px;
  }

  .player-status{
    bottom:140px;
  }
}
</style>

<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentSession =
  null;


/* =========================
   DOM
========================= */

const frame =
  document.getElementById("appFrame");

const navHome =
  document.getElementById("navHome");

const navMyPage =
  document.getElementById("navMyPage");

const audio =
  document.getElementById("audio");

const fullAudio = new Audio();
fullAudio.preload = "auto";
fullAudio.crossOrigin = "anonymous";


/* =========================
   LOUDNESS NORMALIZATION
   songs.loudness_gain_db の補正値を
   共通プレイヤーへ反映する。

   Web Audio API の GainNode で 1.0 を超える増幅を行う。
   今回はクリック音の原因切り分けテストとして、
   DynamicsCompressorNode（リミッター）は完全に外す。

   AudioContext がブラウザの自動再生制限などで使えない場合は、
   従来どおり HTMLMediaElement.volume へ安全にフォールバックする。
========================= */
const NORMALIZATION_MIN_GAIN_DB = -12;
const NORMALIZATION_MAX_GAIN_DB = 12;

/* Web Audio が使えない時だけ使う安全なフォールバック */
const NORMALIZATION_FALLBACK_BASE_VOLUME = 0.45;
const NORMALIZATION_FALLBACK_MIN_VOLUME = 0.08;
const NORMALIZATION_FALLBACK_MAX_VOLUME = 1.0;

const loudnessGainCache = new Map();

let loudnessAudioContext = null;
let loudnessAudioSource = null;
let loudnessFullAudioSource = null;
let loudnessAudioGainNode = null;
let loudnessFullAudioGainNode = null;
let loudnessCurrentLinearGain = 1;
let loudnessGraphReady = false;
let loudnessGraphFailed = false;

function clampNumber(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function normalizeGainDb(value){
  return clampNumber(
    Number(value) || 0,
    NORMALIZATION_MIN_GAIN_DB,
    NORMALIZATION_MAX_GAIN_DB
  );
}

function gainDbToLinearGain(gainDb){
  return Math.pow(
    10,
    normalizeGainDb(gainDb) / 20
  );
}

function gainDbToFallbackVolume(gainDb){
  const linearGain = gainDbToLinearGain(gainDb);

  return clampNumber(
    NORMALIZATION_FALLBACK_BASE_VOLUME * linearGain,
    NORMALIZATION_FALLBACK_MIN_VOLUME,
    NORMALIZATION_FALLBACK_MAX_VOLUME
  );
}

async function ensureLoudnessAudioGraph(){
  if(loudnessGraphReady){
    if(
      loudnessAudioContext &&
      loudnessAudioContext.state === "suspended"
    ){
      try{
        await loudnessAudioContext.resume();
      }
      catch(error){
        console.warn("AudioContext resume error:",error);
      }
    }

    return (
      loudnessAudioContext &&
      loudnessAudioContext.state === "running"
    );
  }

  if(loudnessGraphFailed){
    return false;
  }

  try{
    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContextClass){
      loudnessGraphFailed = true;
      return false;
    }

    /*
      先にAudioContextだけ開始する。
      ユーザー操作扱いにならずresumeできない環境では、
      MediaElementSourceへ接続せず通常audioの音を残す。
    */
    if(!loudnessAudioContext){
      loudnessAudioContext =
        new AudioContextClass();
    }

    if(
      loudnessAudioContext.state === "suspended"
    ){
      try{
        await loudnessAudioContext.resume();
      }
      catch(error){
        console.warn("AudioContext start blocked:",error);
        return false;
      }
    }

    if(
      loudnessAudioContext.state !== "running"
    ){
      return false;
    }

    loudnessAudioGainNode =
      loudnessAudioContext.createGain();

    loudnessFullAudioGainNode =
      loudnessAudioContext.createGain();

    /*
      重要: Web Audioグラフを接続する前に必ず無音にする。
      GainNodeの初期値は1なので、そのまま接続するとAudioContextの
      初回起動・経路切替の瞬間に1サンプルだけ音が通り、
      「プツッ」と聞こえる環境がある。
    */
    loudnessAudioGainNode.gain.value = 0;
    loudnessFullAudioGainNode.gain.value = 0;

    loudnessAudioSource =
      loudnessAudioContext.createMediaElementSource(
        audio
      );

    loudnessFullAudioSource =
      loudnessAudioContext.createMediaElementSource(
        fullAudio
      );

    /*
      原因切り分け用: GainNode から destination へ直接接続する。
      Limiter / DynamicsCompressorNode は一切通さない。
    */
    loudnessAudioSource
      .connect(loudnessAudioGainNode)
      .connect(loudnessAudioContext.destination);

    loudnessFullAudioSource
      .connect(loudnessFullAudioGainNode)
      .connect(loudnessAudioContext.destination);

    /*
      Web Audio側でゲインを管理するので、
      element自体のvolumeは100%にする。
    */
    audio.volume = 1;
    fullAudio.volume = 1;

    loudnessGraphReady = true;
    return true;
  }
  catch(error){
    console.warn(
      "Web Audio loudness setup failed; using fallback:",
      error
    );

    /*
      createMediaElementSource後の例外など、
      中途半端な状態を再利用しない。
    */
    loudnessGraphFailed = true;
    return false;
  }
}

async function resolveSongLoudnessGain(song){
  if(!song) return 0;

  const directValue = Number(song.loudness_gain_db);
  if(
    song.loudness_gain_db !== null &&
    song.loudness_gain_db !== undefined &&
    Number.isFinite(directValue)
  ){
    return normalizeGainDb(directValue);
  }

  const songId = Number(song.id);
  if(!Number.isFinite(songId)) return 0;

  if(loudnessGainCache.has(songId)){
    return loudnessGainCache.get(songId);
  }

  try{
    const {data,error} = await sb
      .from("songs")
      .select("loudness_gain_db")
      .eq("id",songId)
      .maybeSingle();

    if(error){
      console.warn("Loudness gain load error:",error);
      loudnessGainCache.set(songId,0);
      return 0;
    }

    const value = Number(data?.loudness_gain_db);
    const gainDb = Number.isFinite(value)
      ? normalizeGainDb(value)
      : 0;

    loudnessGainCache.set(songId,gainDb);
    song.loudness_gain_db =
      data?.loudness_gain_db ?? null;

    return gainDb;
  }
  catch(error){
    console.warn("Loudness gain resolve error:",error);
    loudnessGainCache.set(songId,0);
    return 0;
  }
}

async function applyLoudnessForSong(song){
  const gainDb =
    await resolveSongLoudnessGain(song);

  const webAudioReady =
    await ensureLoudnessAudioGraph();

  if(
    webAudioReady &&
    loudnessAudioGainNode &&
    loudnessFullAudioGainNode
  ){
    const linearGain =
      gainDbToLinearGain(gainDb);

    loudnessCurrentLinearGain =
      linearGain;

    const now =
      loudnessAudioContext.currentTime;

    /*
      再生前はここで目的ゲインまで上げない。
      目的値だけ保存し、停止中のプレイヤーは0のまま待機させる。
      実際の立ち上げは audio.play() 後の startLoudnessFadeIn() だけで行う。
      これでAudioContext初回起動時のクリックを避ける。
    */
    loudnessAudioGainNode.gain
      .cancelScheduledValues(now);

    loudnessFullAudioGainNode.gain
      .cancelScheduledValues(now);

    if(audio.paused){
      loudnessAudioGainNode.gain
        .setValueAtTime(0,now);
    }
    else{
      loudnessAudioGainNode.gain
        .setTargetAtTime(linearGain,now,0.015);
    }

    if(fullAudio.paused){
      loudnessFullAudioGainNode.gain
        .setValueAtTime(0,now);
    }
    else{
      loudnessFullAudioGainNode.gain
        .setTargetAtTime(linearGain,now,0.015);
    }

    audio.volume = 1;
    fullAudio.volume = 1;

    return {
      gainDb,
      linearGain,
      mode:"webaudio"
    };
  }

  /*
    AudioContextが使えない環境では従来方式。
    1.0を超えないため増幅量は限定されるが、
    再生不能にはしない。
  */
  const volume =
    gainDbToFallbackVolume(gainDb);

  audio.volume = volume;
  fullAudio.volume = volume;

  return {
    gainDb,
    volume,
    mode:"fallback"
  };
}

/*
  親プレイヤーを直接操作した場合は、
  Safari/iOS等のAudioContext再開チャンスとして使う。
*/
document.addEventListener(
  "pointerdown",
  ()=>{
    if(
      loudnessAudioContext &&
      loudnessAudioContext.state === "suspended"
    ){
      loudnessAudioContext.resume().catch(()=>{});
    }
  },
  {passive:true}
);

const playPause =
  document.getElementById("playPause");

const prev =
  document.getElementById("prev");

const next =
  document.getElementById("next");

const shuffle =
  document.getElementById("shuffle");

const repeat =
  document.getElementById("repeat");

const more =
  document.getElementById("more");

const cover =
  document.getElementById("cover");

const title =
  document.getElementById("title");

const artist =
  document.getElementById("artist");

const timeText =
  document.getElementById("timeText");

const progress =
  document.getElementById("progress");

const progressFill =
  document.getElementById("progressFill");

const moreMenu =
  document.getElementById("moreMenu");

const menuLike =
  document.getElementById("menuLike");

const menuPlaylist =
  document.getElementById("menuPlaylist");

const playlistModal =
  document.getElementById("playlistModal");

const playlistModalSong =
  document.getElementById("playlistModalSong");

const playlistChoices =
  document.getElementById("playlistChoices");

const playlistModalClose =
  document.getElementById("playlistModalClose");

const playerStatus =
  document.getElementById("playerStatus");


/* =========================
   State
========================= */

let state = {

  song:null,

  queue:[],

  index:-1,

  shuffle:false,

  repeat:"off",

  highlight:false,

  /*
    ハイライトモード中に
    「この曲だけフルで聴く」を選んだ状態。
    曲が終わったら自動でfalseに戻り、
    次曲から30秒ハイライトへ復帰する。
  */
  fullTrack:false

};

let playRequestId =
  0;

/*
  Homeから届いた最新のRadio検索セッション番号。
  PLAYER_STATEにもそのまま返し、古い検索状態の逆流を防ぐ。
*/
let activeRadioSessionId =
  0;


/*
  下プレイヤーのいいね状態キャッシュ。
*/
const playerLikeCache =
  new Map();

const playerLikeRequestCache =
  new Map();

/*
  次曲の音源を裏で軽く先読みする。
  実再生用audioとは別なので現在曲は止めない。
*/
const nextTrackPreloader =
  new Audio();

nextTrackPreloader.preload =
  "auto";

let preloadedAudioUrl =
  "";


/*
  ハイライト中の「この曲をフルで聴く」専用プリローダー。
  現在曲の冒頭データを別audioで先にキャッシュへ入れておく。
*/
const fullStartPreloader =
  new Audio();

fullStartPreloader.preload =
  "auto";

let fullStartPreloadedUrl =
  "";

function preloadCurrentTrackStart(){

  if(
    !state.highlight ||
    state.fullTrack ||
    !state.song?.audio_url
  ){
    return;
  }

  const url =
    String(
      state.song.audio_url
    );

  if(
    !url ||
    url === fullStartPreloadedUrl
  ){
    return;
  }

  fullStartPreloadedUrl =
    url;

  /*
    現在のハイライト再生を最優先。
    少し待ってから同じ曲の冒頭側を裏で準備する。
  */
  setTimeout(
    ()=>{

      if(
        !state.highlight ||
        state.fullTrack ||
        String(state.song?.audio_url || "") !== url
      ){
        return;
      }

      try{

        fullStartPreloader.src =
          url;

        fullStartPreloader.load();

        /*
          metadata/data取得後に0秒を明示。
          再生はしないので音は出ない。
        */
        const prepareStart =
          ()=>{

            try{
              fullStartPreloader.currentTime = 0;
            }
            catch(e){}

          };

        if(
          fullStartPreloader.readyState >= 1
        ){
          prepareStart();
        }
        else{
          fullStartPreloader.addEventListener(
            "loadedmetadata",
            prepareStart,
            {once:true}
          );
        }

      }
      catch(error){

        console.warn(
          "Full start preload failed:",
          error
        );

      }

    },
    350
  );

}


/*
  Safariなどで ended が遅れたり取りこぼされた時にも
  「この曲だけフル」から確実にハイライトへ戻すためのガード。
*/
let isReturningFromFullTrack =
  false;

/*
  30秒ハイライト専用タイマー。
  timeupdateだけに頼らず、必ず次曲へ進む。
*/
let highlightSkipTimer =
  null;

function clearHighlightSkipTimer(){

  if(
    highlightSkipTimer !== null
  ){

    clearTimeout(
      highlightSkipTimer
    );

    highlightSkipTimer =
      null;

  }

}

function scheduleHighlightSkip(){

  clearHighlightSkipTimer();

  if(
    !state.highlight ||
    state.fullTrack
  ){
    return;
  }

  highlightSkipTimer =
    setTimeout(
      ()=>{

        highlightSkipTimer =
          null;

        /*
          30秒経過時点でもハイライト状態なら
          強制的に次曲へ。
        */
        if(
          state.highlight &&
          !state.fullTrack
        ){

          analyticsTick();

          maybeSendAnalyticsEvents();

          playNext(
            false
          );

        }

      },
      HIGHLIGHT_SECONDS * 1000
    );

}

/* =========================
   匿名リスナーID
========================= */

const ANONYMOUS_LISTENER_STORAGE_KEY =
  "novaradio_anonymous_listener_id";

function createAnonymousListenerId(){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID === "function"
  ){
    return window.crypto.randomUUID();
  }

  /* randomUUID非対応ブラウザ用フォールバック */
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
  .replace(
    /[xy]/g,
    char=>{

      const random =
        Math.floor(
          Math.random() * 16
        );

      const value =
        char === "x"
          ? random
          : (random & 0x3) | 0x8;

      return value.toString(16);

    }
  );

}

function getAnonymousListenerId(){

  try{

    let value =
      localStorage.getItem(
        ANONYMOUS_LISTENER_STORAGE_KEY
      );

    if(!value){

      value =
        createAnonymousListenerId();

      localStorage.setItem(
        ANONYMOUS_LISTENER_STORAGE_KEY,
        value
      );

    }

    return value;

  }
  catch(error){

    console.warn(
      "Anonymous listener ID error:",
      error
    );

    /*
      localStorageが使えない環境でも
      そのページ内では匿名IDを持たせる。
    */
    if(!getAnonymousListenerId.fallbackId){
      getAnonymousListenerId.fallbackId =
        createAnonymousListenerId();
    }

    return getAnonymousListenerId.fallbackId;

  }

}

const anonymousListenerId =
  getAnonymousListenerId();


/* =========================
   再生分析
========================= */

const ANALYTICS_TOTAL_PLAY_SECONDS =
  10;

const ANALYTICS_FULL_PLAY_SECONDS =
  30;

/*
  1曲の再生中に「実際に流れていた時間」を追跡する。
  currentTimeだけを見るとシークで水増しできるため、
  壁時計の経過時間と音源の進行量の両方を使って判定する。
*/
let analyticsTracker = {
  songId:null,
  totalSeconds:0,
  highlightSeconds:0,
  fullSeconds:0,
  totalSent:false,
  highlightSent:false,
  fullSent:false,
  lastWallMs:null,
  lastMediaTime:null,
  lastMode:null
};


function getAnalyticsMode(){

  return (
    state.highlight &&
    !state.fullTrack
  )
    ? "highlight"
    : "full";

}


function getAnalyticsAudio(){

  return state.fullTrack
    ? fullAudio
    : audio;

}


function resetAnalyticsTracker(
  song,
  force=false
){

  const songId =
    Number(
      song?.id
    );

  if(
    !Number.isFinite(songId)
  ){
    return;
  }

  if(
    !force &&
    Number(analyticsTracker.songId) ===
      songId
  ){
    return;
  }

  analyticsTracker = {
    songId,
    totalSeconds:0,
    highlightSeconds:0,
    fullSeconds:0,
    totalSent:false,
    highlightSent:false,
    fullSent:false,
    lastWallMs:null,
    lastMediaTime:null,
    lastMode:null
  };

}


function resetAnalyticsClock(){

  const activeAudio =
    getAnalyticsAudio();

  analyticsTracker.lastWallMs =
    performance.now();

  analyticsTracker.lastMediaTime =
    Number.isFinite(
      activeAudio.currentTime
    )
      ? activeAudio.currentTime
      : null;

  analyticsTracker.lastMode =
    getAnalyticsMode();

}


async function recordAnalyticsEvent(
  songId,
  eventType
){

  if(
    !Number.isFinite(
      Number(songId)
    )
  ){
    return;
  }

  try{

    const {
      error
    } =
    await sb.rpc(
      "record_play_event",
      {
        p_song_id:
          Number(songId),

        p_event_type:
          eventType,

        /*
          ログイン済みならSupabase側でauth.uid()を使用。
          未ログインならこのブラウザの匿名UUIDを使用。
        */
        p_anonymous_listener_id:
          currentSession
            ? null
            : anonymousListenerId
      }
    );

    if(error){
      throw error;
    }

  }
  catch(error){

    console.warn(
      "Analytics event error:",
      eventType,
      error
    );

  }

}


function maybeSendAnalyticsEvents(){

  const songId =
    Number(
      analyticsTracker.songId
    );

  if(
    !Number.isFinite(songId)
  ){
    return;
  }


  /*
    総再生:
    10秒以上、実際に音が流れたら1再生。
  */
  if(
    !analyticsTracker.totalSent &&
    analyticsTracker.totalSeconds >=
      ANALYTICS_TOTAL_PLAY_SECONDS
  ){

    analyticsTracker.totalSent =
      true;

    recordAnalyticsEvent(
      songId,
      "play_qualified"
    );

  }


  /*
    30秒ハイライト完走:
    ハイライトとして実際に30秒聴かれた場合。
  */
  if(
    !analyticsTracker.highlightSent &&
    analyticsTracker.highlightSeconds >=
      HIGHLIGHT_SECONDS - 0.25
  ){

    analyticsTracker.highlightSent =
      true;

    recordAnalyticsEvent(
      songId,
      "highlight_complete"
    );

  }


  /*
    フル再生:
    通常再生、またはハイライトから
    「この曲をフル」で30秒以上聴かれた場合。
  */
  if(
    !analyticsTracker.fullSent &&
    analyticsTracker.fullSeconds >=
      ANALYTICS_FULL_PLAY_SECONDS
  ){

    analyticsTracker.fullSent =
      true;

    recordAnalyticsEvent(
      songId,
      "full_qualified"
    );

  }

}


function analyticsTick(){

  /*
    再生分析はゲストも対象。
    ログイン有無に関係なく、曲が再生中なら計測する。
    未ログイン時は record_play_event() に匿名UUIDを渡す。
  */
  if(
    !state.song
  ){
    return;
  }

  if(
    Number(analyticsTracker.songId) !==
      Number(state.song.id)
  ){

    resetAnalyticsTracker(
      state.song,
      true
    );

  }

  const activeAudio =
    getAnalyticsAudio();

  const mode =
    getAnalyticsMode();

  const now =
    performance.now();

  const current =
    Number.isFinite(
      activeAudio.currentTime
    )
      ? activeAudio.currentTime
      : null;


  if(
    analyticsTracker.lastWallMs === null ||
    analyticsTracker.lastMediaTime === null ||
    analyticsTracker.lastMode !== mode
  ){

    analyticsTracker.lastWallMs =
      now;

    analyticsTracker.lastMediaTime =
      current;

    analyticsTracker.lastMode =
      mode;

    return;

  }


  const wallDelta =
    Math.max(
      0,
      (
        now -
        analyticsTracker.lastWallMs
      ) / 1000
    );

  const mediaDelta =
    current === null
      ? 0
      : current -
        analyticsTracker.lastMediaTime;


  analyticsTracker.lastWallMs =
    now;

  analyticsTracker.lastMediaTime =
    current;

  analyticsTracker.lastMode =
    mode;


  if(
    activeAudio.paused ||
    activeAudio.ended ||
    current === null ||
    mediaDelta <= 0
  ){
    return;
  }


  /*
    大きなcurrentTimeジャンプはシークとみなし、
    そのジャンプ分は聴取時間として加算しない。
    バックグラウンド再生などでタイマーが遅れても、
    wallDeltaとmediaDeltaが同程度なら正常に加算する。
  */
  if(
    mediaDelta >
      wallDelta * 2 + 1
  ){
    return;
  }


  const creditedSeconds =
    Math.max(
      0,
      Math.min(
        wallDelta,
        mediaDelta
      )
    );


  analyticsTracker.totalSeconds +=
    creditedSeconds;

  if(
    mode === "highlight"
  ){

    analyticsTracker.highlightSeconds +=
      creditedSeconds;

  }
  else{

    analyticsTracker.fullSeconds +=
      creditedSeconds;

  }


  maybeSendAnalyticsEvents();

}


/*
  500msごとに再生状況を確認。
  UIや既存の再生ロジックとは独立しているので、
  プレイヤー挙動を変えずに分析だけ記録する。
*/
setInterval(
  analyticsTick,
  500
);



/* =========================

function formatTime(seconds){

  if(
    !Number.isFinite(seconds) ||
    seconds < 0
  ){
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return (
    minutes +
    ":" +
    String(secs).padStart(2,"0")
  );
}


function showPlayerStatus(message){

  playerStatus.textContent =
    message;

  playerStatus.classList.add(
    "show"
  );

  clearTimeout(
    showPlayerStatus.timer
  );

  showPlayerStatus.timer =
    setTimeout(
      ()=>{
        playerStatus.classList.remove(
          "show"
        );
      },
      3500
    );
}


function escapeAttribute(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll('"',"&quot;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;");

}


function closeMoreMenu(){

  moreMenu.classList.remove(
    "show"
  );

}

function renderSong(song){

  const previousId =
    Number(
      state.song?.id
    );

  state.song =
    song;

  if(!song){
    return;
  }

  title.textContent =
    song.title ||
    "Untitled";

  artist.textContent =
    song.artist ||
    "Unknown Artist";

  const c =
    song.cover_url ||
    "";

  const existingImg =
    cover.querySelector(
      "img"
    );

  const existingSrc =
    existingImg
      ? existingImg.getAttribute(
          "src"
        ) || ""
      : "";

  /*
    同じジャケットならimg DOMを作り直さない。
  */
  if(
    c &&
    existingSrc !== c
  ){

    cover.innerHTML =
      `<img src="${escapeAttribute(c)}" alt="">`;

  }
  else if(
    !c &&
    cover.textContent !== "🎵"
  ){

    cover.innerHTML =
      "🎵";

  }

  if(
    previousId !==
    Number(song.id)
  ){

    timeText.textContent =
      "0:00 / 0:00";

  }

  updateLikeMenu()
  .catch(()=>{});

}


/* =========================
   再生安定化
========================= */

/*
  曲の頭が0以外の波形から始まる場合、
  Web Audioの増幅後に「プツッ」と聞こえることがある。
  再生開始直前に一度0へ落とし、約30msだけフェードインして
  DC/波形の不連続によるクリックノイズを抑える。
*/
function prepareLoudnessFadeIn(){
  if(
    !loudnessGraphReady ||
    !loudnessAudioContext ||
    !loudnessAudioGainNode
  ){
    return;
  }

  const now =
    loudnessAudioContext.currentTime;

  loudnessAudioGainNode.gain
    .cancelScheduledValues(now);

  loudnessAudioGainNode.gain
    .setValueAtTime(0, now);
}

function startLoudnessFadeIn(){
  if(
    !loudnessGraphReady ||
    !loudnessAudioContext ||
    !loudnessAudioGainNode
  ){
    return;
  }

  const now =
    loudnessAudioContext.currentTime;

  loudnessAudioGainNode.gain
    .cancelScheduledValues(now);

  loudnessAudioGainNode.gain
    .setValueAtTime(0, now);

  /*
    初回AudioContext起動も吸収できるよう80msで立ち上げる。
    音楽としてはごく短い長さだが、
    0以外の波形から始まる音源のクリックを抑えやすい。
  */
  loudnessAudioGainNode.gain
    .linearRampToValueAtTime(
      Math.max(0.0001, loudnessCurrentLinearGain),
      now + 0.08
    );
}

/*
  曲の「始まり」で聞こえるプツッが、実際には
  前の曲を波形の途中で急に切った瞬間のクリックであることがある。
  srcを差し替える前に旧曲を約40msだけ0へ落としてから切り替える。
*/
async function fadeOutBeforeSourceChange(){
  if(
    audio.paused ||
    !loudnessGraphReady ||
    !loudnessAudioContext ||
    !loudnessAudioGainNode
  ){
    return;
  }

  const now =
    loudnessAudioContext.currentTime;

  const currentGain =
    Math.max(
      0.0001,
      Number(loudnessAudioGainNode.gain.value) ||
      loudnessCurrentLinearGain ||
      1
    );

  loudnessAudioGainNode.gain
    .cancelScheduledValues(now);

  loudnessAudioGainNode.gain
    .setValueAtTime(
      currentGain,
      now
    );

  loudnessAudioGainNode.gain
    .linearRampToValueAtTime(
      0,
      now + 0.04
    );

  await new Promise(
    resolve=>setTimeout(resolve,45)
  );
}

function waitForPlayable(
  requestId,
  timeoutMs=3000
){

  return new Promise(
    resolve=>{

      if(
        requestId !==
        playRequestId
      ){
        resolve(false);
        return;
      }

      if(
        audio.readyState >= 2
      ){
        resolve(true);
        return;
      }

      let finished =
        false;

      const finish =
        ok=>{

          if(finished){
            return;
          }

          finished =
            true;

          clearTimeout(timer);

          audio.removeEventListener(
            "canplay",
            onCanPlay
          );

          audio.removeEventListener(
            "error",
            onError
          );

          resolve(ok);
        };

      const onCanPlay =
        ()=>finish(true);

      const onError =
        ()=>finish(false);

      const timer =
        setTimeout(
          ()=>finish(
            audio.readyState >= 2
          ),
          timeoutMs
        );

      audio.addEventListener(
        "canplay",
        onCanPlay,
        {once:true}
      );

      audio.addEventListener(
        "error",
        onError,
        {once:true}
      );

    }
  );

}


async function startPlayback(
  requestId
){

  if(
    requestId !==
    playRequestId
  ){
    return;
  }

  /*
    まず即play。
    これが一番ユーザー操作扱いを維持しやすい。
  */
  try{

    prepareLoudnessFadeIn();

    await audio.play();

    startLoudnessFadeIn();

    return;

  }
  catch(firstError){

    console.warn(
      "First play attempt:",
      firstError
    );

  }

  /*
    読み込み待ち後にもう一度。
  */
  const playable =
    await waitForPlayable(
      requestId
    );

  if(
    !playable ||
    requestId !==
    playRequestId
  ){

    showPlayerStatus(
      "音源の読み込みに時間がかかっています。▶をもう一度押してみてください。"
    );

    return;

  }

  try{

    prepareLoudnessFadeIn();

    await audio.play();

    startLoudnessFadeIn();

  }
  catch(secondError){

    console.warn(
      "Second play attempt:",
      secondError
    );

    showPlayerStatus(
      "再生できませんでした。▶を押すと再試行できます。"
    );

  }

}


async function playSong(
  song,
  queue=null,
  index=null,
  restart=false
){

  /*
    前の曲の30秒タイマーを必ず破棄。
  */
  clearHighlightSkipTimer();

  if(
    !song ||
    !song.audio_url
  ){

    showPlayerStatus(
      "この曲には再生できる音源がありません。"
    );

    return;
  }

  if(
    Array.isArray(queue)
  ){

    state.queue =
      queue;

  }

  if(
    Number.isInteger(index)
  ){

    state.index =
      index;

  }

  const previousSongId =
    Number(
      state.song?.id
    );

  const previousSrc =
    audio.getAttribute(
      "src"
    ) || "";

  renderSong(
    song
  );

  const sourceChanged =
    previousSrc !==
    String(song.audio_url);

  /*
    旧曲を波形の途中で即座に切ると、次曲の頭で
    「プツッ」と聞こえることがある。
    新しい補正値を反映したりsrcを差し替えたりする前に、
    旧曲だけ短くフェードアウトしてゼロまで落とす。
  */
  if(
    sourceChanged ||
    restart
  ){
    await fadeOutBeforeSourceChange();
  }

  /*
    曲ごとの保存済み補正値を、実際に再生を始める前に反映する。
    Home/RPC側が loudness_gain_db を返さない場合でも、
    song.id からsongsテーブルを補助取得するため既存導線を壊さない。
  */
  await applyLoudnessForSong(
    song
  );

  resetAnalyticsTracker(
    song
  );

  resetAnalyticsClock();

  const requestId =
    ++playRequestId;

  if(
    sourceChanged ||
    restart
  ){

    /*
      新しい検索からのrestartでは同じ曲が選ばれた場合でも
      srcを再セットして0秒/ハイライト開始位置から確実に再生する。
    */
    audio.src =
      song.audio_url;

    /*
      ここは軽量化より正確さを優先。
      新しいsrc、または明示restartなら必ずloadして、
      この曲自身のmetadataを確実に読み込む。
      先読み済みならブラウザキャッシュが効くので
      ネットワーク負荷は抑えられる。
    */
    audio.load();

  }

  /*
    通常再生は0秒から。
    ハイライト再生はアーティストが指定した
    highlight_startから開始する。
  */
  const requestedStart =
    (
      state.highlight &&
      !state.fullTrack
    )
      ? Math.max(
          0,
          Number(
            song.highlight_start
          ) || 0
        )
      : 0;

  if(
    restart ||
    sourceChanged ||
    previousSongId !==
    Number(song.id)
  ){

    /*
      ハイライト開始位置を正確に反映する。

      sourceChanged直後は、readyStateが一瞬だけ
      前の曲の状態を持つブラウザがあるため、
      requestedStart > 0 の時は「新しい曲のmetadata」を
      必ず待ってからcurrentTimeを設定する。
    */
    if(
      requestedStart > 0
    ){

      if(
        sourceChanged ||
        restart ||
        audio.readyState < 1
      ){

        await new Promise(
          resolve=>{

            let finished =
              false;

            const finish =
              ()=>{

                if(finished){
                  return;
                }

                finished =
                  true;

                clearTimeout(
                  timer
                );

                audio.removeEventListener(
                  "loadedmetadata",
                  onMetadata
                );

                resolve();

              };

            const onMetadata =
              ()=>finish();

            const timer =
              setTimeout(
                finish,
                4000
              );

            audio.addEventListener(
              "loadedmetadata",
              onMetadata,
              {
                once:true
              }
            );

          }
        );

      }

      try{

        const maxStart =
          Number.isFinite(
            audio.duration
          )
            ? Math.max(
                0,
                audio.duration - 0.1
              )
            : requestedStart;

        audio.currentTime =
          Math.min(
            requestedStart,
            maxStart
          );

      }
      catch(error){

        console.warn(
          "Highlight seek error:",
          error
        );

      }

    }
    else{

      try{

        audio.currentTime =
          0;

      }
      catch(error){

        console.warn(
          "Seek reset error:",
          error
        );

      }

    }

  }

  /*
    src切替直後にブラウザ側がcurrentTimeを0へ戻すケースへの保険。
  */
  if(
    requestedStart > 0 &&
    Math.abs(
      audio.currentTime -
      requestedStart
    ) > 0.75
  ){

    try{

      audio.currentTime =
        requestedStart;

    }
    catch(error){

      console.warn(
        "Final highlight seek retry:",
        error
      );

    }

  }

  highlightStartTime =
    requestedStart;

  await startPlayback(
    requestId
  );

  /*
    ハイライト曲なら、再生開始後から30秒で
    必ず次へ進むタイマーをセット。
    「この曲だけフル」の間はセットしない。
  */
  scheduleHighlightSkip();

  notifyFrameState();

  preloadLikelyNextTrack();

  /*
    30秒ハイライト中なら、
    「この曲をフルで聴く」用に冒頭も裏で準備。
  */
  preloadCurrentTrackStart();

}

/* =========================
   次曲の軽量プリロード
========================= */

function preloadLikelyNextTrack(){

  if(
    !state.queue.length ||
    state.shuffle
  ){
    return;
  }

  let currentIndex =
    state.index;

  if(
    currentIndex < 0
  ){

    currentIndex =
      state.queue.findIndex(
        song=>
          Number(song.id) ===
          Number(state.song?.id)
      );

  }

  if(
    currentIndex < 0
  ){
    return;
  }

  const nextIndex =
    (
      currentIndex + 1
    ) %
    state.queue.length;

  const nextSong =
    state.queue[
      nextIndex
    ];

  const url =
    String(
      nextSong?.audio_url ||
      ""
    );

  if(
    !url ||
    url === preloadedAudioUrl ||
    url === audio.getAttribute("src")
  ){
    return;
  }

  preloadedAudioUrl =
    url;

  /*
    少し遅らせて現在曲の再生開始を優先。
  */
  setTimeout(
    ()=>{

      try{

        nextTrackPreloader.src =
          url;

        nextTrackPreloader.load();

      }
      catch(error){

        console.warn(
          "Next track preload failed:",
          error
        );

      }

    },
    250
  );

}


/* =========================
   次の曲
========================= */

function playNext(
  fromEnded=false
){

  if(
    !state.queue.length
  ){
    return;
  }

  /*
    ハイライト中の「この曲だけフル」を手動スキップした時は、
    次曲へ進む前に一時フル状態だけ解除する。
    highlight自体はtrueのままなので、次曲はhighlight_startから30秒再生。
    通常のフル再生には影響しない。
  */
  if(
    state.highlight &&
    state.fullTrack &&
    !fromEnded
  ){
    try{
      fullAudio.pause();
      fullAudio.removeAttribute("src");
      fullAudio.load();
    }catch(e){}

    state.fullTrack = false;
    clearHighlightSkipTimer();
    highlightStartTime = 0;
    isReturningFromFullTrack = false;
    notifyFrameState();
  }

  if(
    fromEnded &&
    state.repeat === "one"
  ){

    audio.currentTime =
      0;

    audio
    .play()
    .catch(
      ()=>startPlayback(
        ++playRequestId
      )
    );

    return;
  }

  if(
    state.index < 0
  ){

    state.index =
      state.queue.findIndex(
        s=>
          Number(s.id) ===
          Number(state.song?.id)
      );

  }

  if(
    state.shuffle &&
    state.queue.length > 1
  ){

    let nextIndex =
      state.index;

    while(
      nextIndex ===
      state.index
    ){

      nextIndex =
        Math.floor(
          Math.random() *
          state.queue.length
        );

    }

    state.index =
      nextIndex;

  }

  else{

    const candidate =
      state.index + 1;

    if(
      candidate >=
      state.queue.length
    ){

      if(
        fromEnded &&
        state.repeat === "off"
      ){
        return;
      }

      state.index =
        0;

    }

    else{

      state.index =
        candidate;

    }

  }

  playSong(
    state.queue[
      state.index
    ],
    state.queue,
    state.index,
    true
  );

}


/* =========================
   前の曲
========================= */

function playPrev(){

  if(
    !state.queue.length
  ){
    return;
  }

  if(
    audio.currentTime > 3
  ){

    audio.currentTime =
      0;

    return;
  }

  if(
    state.index < 0
  ){

    state.index =
      state.queue.findIndex(
        s=>
          Number(s.id) ===
          Number(state.song?.id)
      );

  }

  if(
    state.shuffle &&
    state.queue.length > 1
  ){

    let prevIndex =
      state.index;

    while(
      prevIndex ===
      state.index
    ){

      prevIndex =
        Math.floor(
          Math.random() *
          state.queue.length
        );

    }

    state.index =
      prevIndex;

  }

  else{

    state.index--;

    if(
      state.index < 0
    ){

      state.index =
        state.queue.length - 1;

    }

  }

  playSong(
    state.queue[
      state.index
    ],
    state.queue,
    state.index,
    true
  );

}

/* =========================
   軽量シーク
========================= */

function getSeekRatio(
  event
){

  const rect =
    progress.getBoundingClientRect();

  if(
    rect.width <= 0
  ){
    return 0;
  }

  return Math.max(
    0,
    Math.min(
      1,
      (
        event.clientX -
        rect.left
      ) /
      rect.width
    )
  );

}


function previewSeek(
  event
){

  if(
    !Number.isFinite(
      audio.duration
    ) ||
    audio.duration <= 0
  ){
    return;
  }

  seekRatio =
    getSeekRatio(
      event
    );

  progressFill.style.width =
    (
      seekRatio *
      100
    ) +
    "%";

  timeText.textContent =
    formatTime(
      seekRatio *
      audio.duration
    ) +
    " / " +
    formatTime(
      audio.duration
    );

}


progress.addEventListener(
  "pointerdown",
  event=>{

    if(
      !Number.isFinite(
        audio.duration
      ) ||
      audio.duration <= 0
    ){
      return;
    }

    isSeeking =
      true;

    resetAnalyticsClock();

    previewSeek(
      event
    );

    try{

      progress.setPointerCapture(
        event.pointerId
      );

    }
    catch(e){}

  }
);


progress.addEventListener(
  "pointermove",
  event=>{

    if(
      !isSeeking
    ){
      return;
    }

    previewSeek(
      event
    );

  }
);


progress.addEventListener(
  "pointerup",
  event=>{

    if(
      !isSeeking
    ){
      return;
    }

    previewSeek(
      event
    );

    isSeeking =
      false;

    if(
      Number.isFinite(
        audio.duration
      ) &&
      audio.duration > 0
    ){

      audio.currentTime =
        seekRatio *
        audio.duration;

      resetAnalyticsClock();

    }

    try{

      progress.releasePointerCapture(
        event.pointerId
      );

    }
    catch(e){}

  }
);


progress.addEventListener(
  "pointercancel",
  ()=>{

    isSeeking =
      false;

    updateProgressUI();

  }
);


/* =========================
   この曲だけフル → ハイライト復帰
========================= */

function returnToHighlightAfterFullTrack(){

  if(
    !state.highlight ||
    !state.fullTrack ||
    isReturningFromFullTrack
  ){
    return false;
  }

  isReturningFromFullTrack =
    true;

  /*
    先にfullTrackを解除してから次曲を再生する。
    これで次のplaySongは必ずhighlight_startから始まる。
  */
  try{
    fullAudio.pause();
    fullAudio.removeAttribute("src");
    fullAudio.load();
  }catch(e){}

  state.fullTrack =
    false;

  clearHighlightSkipTimer();

  highlightStartTime =
    0;

  notifyFrameState();

  /*
    今の曲ではなく次の曲へ。
    falseにすることでrepeat one等の影響も受けない。
  */
  playNext(
    false
  );

  /*
    playNext/playSongの開始を待たず、
    少し後にガードだけ解除。
  */
  setTimeout(
    ()=>{
      isReturningFromFullTrack =
        false;
    },
    600
  );

  return true;
}

   フル専用Audioイベント

fullAudio.addEventListener("error",()=>{

/* =========================
   Audioイベント
========================= */

function updateProgressUI(){

  if(
    isSeeking
  ){
    return;
  }

  const activeAudio =
    state.fullTrack
      ? fullAudio
      : audio;

  const duration =
    Number.isFinite(
      activeAudio.duration
    )
      ? activeAudio.duration
      : 0;

  const current =
    Number.isFinite(
      activeAudio.currentTime
    )
      ? activeAudio.currentTime
      : 0;

  if(
    duration > 0
  ){

    progressFill.style.width =
      (
        current /
        duration *
        100
      ) +
      "%";

  }
  else{

    progressFill.style.width =
      "0%";

  }

  timeText.textContent =
    formatTime(current) +
    " / " +
    formatTime(duration);

}


audio.addEventListener(
  "play",
  ()=>{

    playPause.textContent =
      "⏸";

    resetAnalyticsClock();

    if(
      state.highlight &&
      !state.fullTrack
    ){
      highlightStartTime =
        Number.isFinite(
          audio.currentTime
        )
          ? audio.currentTime
          : 0;

      scheduleHighlightSkip();
    }

  }
);


audio.addEventListener(
  "pause",
  ()=>{

    playPause.textContent =
      "▶";

    resetAnalyticsClock();

    if(
      state.highlight &&
      !state.fullTrack
    ){
      clearHighlightSkipTimer();
    }

  }
);


audio.addEventListener(
  "loadedmetadata",
  updateProgressUI
);


audio.addEventListener(
  "durationchange",
  updateProgressUI
);


audio.addEventListener(
  "timeupdate",
  ()=>{

    updateProgressUI();

    /*
      「この曲だけフル」で曲末まで来たら、
      endedイベントを待たずにハイライトへ復帰する保険。
      Safari等でendedが不安定なケース対策。
    */
    if(
      state.highlight &&
      false &&
      state.fullTrack &&
      !isReturningFromFullTrack &&
      Number.isFinite(
        audio.duration
      ) &&
      audio.duration > 0 &&
      Number.isFinite(
        audio.currentTime
      ) &&
      (
        audio.duration -
        audio.currentTime
      ) <= 0.35
    ){

      returnToHighlightAfterFullTrack();

      return;
    }

    /*
      30秒自動スキップは専用setTimeoutで管理。
      timeupdateはUI更新とフル曲終了保険だけ担当する。
    */

  }
);


audio.addEventListener(
  "ended",
  ()=>{

    if(state.fullTrack){
      return;
    }

    playNext(
      true
    );

  }
);


audio.addEventListener(
  "stalled",
  ()=>{

    console.warn(
      "Audio stalled"
    );

  }
);


audio.addEventListener(
  "waiting",
  ()=>{

    /*
      一時的なバッファ待ちは
      エラー扱いにしない。
    */

  }
);


audio.addEventListener(
  "error",
  ()=>{

    const error =
      audio.error;

    console.warn(
      "Audio error:",
      error
    );

    showPlayerStatus(
      "音源の読み込みに失敗しました。次の曲へ進むか、▶で再試行してください。"
    );

  }
);


/* =========================
   いいね
========================= */

async function isSongLiked(
  songId,
  force=false
){

  if(
    !currentSession ||
    !songId
  ){
    return false;
  }

  const cacheKey =
    String(songId);

  if(
    !force &&
    playerLikeCache.has(
      cacheKey
    )
  ){
    return playerLikeCache.get(
      cacheKey
    );
  }

  if(
    !force &&
    playerLikeRequestCache.has(
      cacheKey
    )
  ){
    return playerLikeRequestCache.get(
      cacheKey
    );
  }

  const request =
    (async ()=>{

      const {
        data,
        error
      } =
      await sb
      .from("likes")
      .select("id")
      .eq(
        "user_id",
        currentSession.user.id
      )
      .eq(
        "song_id",
        songId
      )
      .limit(1);

      if(error){

        console.warn(
          "Like check error:",
          error
        );

        return false;
      }

      const liked =
        !!(
          data &&
          data.length
        );

      playerLikeCache.set(
        cacheKey,
        liked
      );

      return liked;

    })();

  playerLikeRequestCache.set(
    cacheKey,
    request
  );

  try{

    return await request;

  }
  finally{

    playerLikeRequestCache.delete(
      cacheKey
    );

  }

}

async function updateLikeMenu(){

  menuLike.classList.remove(
    "liked"
  );

  if(
    !state.song
  ){

    menuLike.textContent =
      "🤍 いいね";

    return;
  }

  if(
    !currentSession
  ){

    menuLike.textContent =
      "🤍 いいね";

    return;
  }

  const songId =
    state.song.id;

  const liked =
    await isSongLiked(
      songId
    );

  /*
    曲が変わっている途中に
    古い問い合わせが返ってきた場合は無視。
  */
  if(
    Number(state.song?.id) !==
    Number(songId)
  ){
    return;
  }

  if(liked){

    menuLike.textContent =
      "❤️ いいね解除";

    menuLike.classList.add(
      "liked"
    );

  }
  else{

    menuLike.textContent =
      "🤍 いいね";

  }

}


async function toggleCurrentLike(){

  if(
    !state.song
  ){

    showPlayerStatus(
      "まず曲を再生してください。"
    );

    return;
  }

  if(
    !currentSession
  ){

    showPlayerStatus(
      "いいねするにはログインしてください。"
    );

    return;
  }

  menuLike.disabled =
    true;

  try{

    const liked =
      await isSongLiked(
        state.song.id
      );

    if(liked){

      const {
        error
      } =
      await sb
      .from("likes")
      .delete()
      .eq(
        "user_id",
        currentSession.user.id
      )
      .eq(
        "song_id",
        state.song.id
      );

      if(error){
        throw error;
      }

      showPlayerStatus(
        "いいねを解除しました。"
      );

    }
    else{

      const {
        error
      } =
      await sb
      .from("likes")
      .insert({

        user_id:
          currentSession.user.id,

        song_id:
          state.song.id

      });

      if(error){
        throw error;
      }

      showPlayerStatus(
        "❤️ いいねしました！"
      );

    }

    playerLikeCache.set(
      String(state.song.id),
      !liked
    );

    await updateLikeMenu();

  }
  catch(error){

    console.error(error);

    showPlayerStatus(
      "いいねの更新に失敗しました：" +
      (
        error.message ||
        error
      )
    );

  }
  finally{

    menuLike.disabled =
      false;

  }

}

    console.error(error);

    showPlayerStatus(
      "プレイリストへの追加に失敗しました：" +
      (
        error.message ||
        error
      )
    );

  }
  finally{

    button.disabled =
      false;

  }

}


/* =========================

========================= */

more.addEventListener(

  async event=>{

    event.stopPropagation();

    if(

    ){

    );

);

document.addEventListener(

/* =========================
   新しい検索からの再生を強制開始
========================= */

function resetForFreshPlayCommand(){

  /*
    以前の検索・ハイライト・「この曲だけフル」の再生状態を
    新しいNOVARADIO_PLAYへ持ち越さない。
  */
  clearHighlightSkipTimer();

  isReturningFromFullTrack =
    false;

  highlightStartTime =
    0;

  /*
    進行中の古いplaySong/startPlaybackを無効化。
  */
  playRequestId +=
    1;

  try{
    fullAudio.pause();
    fullAudio.removeAttribute(
      "src"
    );
    fullAudio.load();
  }
  catch(e){}

  try{
    audio.pause();
  }
  catch(e){}

  state.fullTrack =
    false;

  /*
    前の検索キューを先に捨てる。
    この直後に受け取った新しいqueue/indexで上書きされる。
  */
  state.queue =
    [];

  state.index =
    -1;

}


/* =========================
   Home / My Pageからの命令
========================= */

window.addEventListener(
  "message",
  event=>{

    /*
      セキュリティ:
      NovaRadio自身の同一オリジンiframeから届いたメッセージだけ受け付ける。
      外部サイトや別ウィンドウからNOVARADIO_*命令を送り込まれるのを防ぐ。
    */
    if(
      event.origin !== window.location.origin ||
      event.source !== frame.contentWindow
    ){
      return;
    }

    const data =
      event.data ||
      {};

    if(
      data.type ===
      "NOVARADIO_PLAY"
    ){

      /*
        Homeが発行した最新の検索セッション番号を先に確定。
        以後のPLAYER_STATEはこの番号を付けてHomeへ返す。
      */
      const incomingRadioSessionId =
        Number(data.radioSessionId || 0);

      if(
        Number.isFinite(incomingRadioSessionId) &&
        incomingRadioSessionId > 0
      ){
        activeRadioSessionId =
          incomingRadioSessionId;
      }

      /*
        Homeで条件を変えて再検索した場合も、
        現在再生中かどうかに関係なく新しい曲へ切り替える。
      */
      resetForFreshPlayCommand();

      const queue =
        Array.isArray(
          data.queue
        )
          ? data.queue
          : [];

      const index =
        Number.isInteger(
          data.index
        )
          ? data.index
          : queue.findIndex(
              s=>
                Number(s.id) ===
                Number(
                  data.song?.id
                )
            );

      if(
        typeof data.highlight ===
        "boolean"
      ){

        state.highlight =
          data.highlight;

        /*
          新しい通常再生 / ハイライト再生を明示的に始めた時は
          「この曲だけフル」状態を解除。
        */
        state.fullTrack =
          false;

        clearHighlightSkipTimer();

      }

      if(
        typeof data.shuffle ===
        "boolean"
      ){

        state.shuffle =
          data.shuffle;

      }

      if(
        [
          "off",
          "all",
          "one"
        ].includes(
          data.repeat
        )
      ){

        state.repeat =
          data.repeat;

      }

      /*
        重要:
        この時点では state.song がまだ「前の検索の曲」のまま。
        updateModeButtons() が notifyFrameState() まで行うと、
        前の国の曲がHomeへ逆流して新しい検索結果と競合する。
        UIだけ更新し、新曲の状態通知は playSong() 完了後に一度だけ行う。
      */
      updateModeButtons(
        false
      );

      playSong(
        data.song,
        queue,
        index,
        true
      )
      .catch(
        error=>{

          console.error(
            "Fresh play command failed:",
            error
          );

          showPlayerStatus(
            "新しい条件への切り替えに失敗しました。もう一度再生してください。"
          );

        }
      );

    }


    if(
      data.type ===
      "NOVARADIO_NEXT"
    ){

      playNext(
        false
      );

    }


    if(
      data.type ===
      "NOVARADIO_PREV"
    ){

      playPrev();

    }


    if(
      data.type ===
      "NOVARADIO_TOGGLE"
    ){

      playPause.click();

    }


    if(
      data.type ===
      "NOVARADIO_SET_SHUFFLE"
    ){

      setShuffle(
        data.value
      );

    }


    if(
      data.type ===
      "NOVARADIO_SET_REPEAT"
    ){

      setRepeat(
        data.value
      );

    }


    if(
      data.type ===
      "NOVARADIO_CYCLE_REPEAT"
    ){

      cycleRepeat();

    }


    if(
      data.type ===
      "NOVARADIO_GET_PLAYER_STATE"
    ){

      notifyFrameState();

    }


    if(
      data.type ===
      "NOVARADIO_SET_HIGHLIGHT"
    ){

      state.highlight =
        !!data.value;

      highlightStartTime =
        Number.isFinite(
          audio.currentTime
        )
          ? audio.currentTime
          : 0;

      notifyFrameState();

    }


    if(
      data.type ===
      "NOVARADIO_FULL_CURRENT"
    ){

      if(
        !state.song ||
        !state.song.audio_url
      ){
        return;
      }

      /*
        ハイライト用audioは巻き戻さない。
        フル専用audioを0:00から通常ロードして再生する。
      */
      state.highlight = true;
      state.fullTrack = true;

      resetAnalyticsClock();

      clearHighlightSkipTimer();
      isReturningFromFullTrack = false;
      highlightStartTime = 0;

      try{
        audio.pause();

        fullAudio.pause();
        fullAudio.src = state.song.audio_url;
        fullAudio.load();

        fullAudio.volume = audio.volume;

        fullAudio.play().catch(
          error=>{
            console.warn("Full audio play error:",error);
            showPlayerStatus(
              "フル再生を準備しています。▶で再開できます。"
            );
          }
        );
      }
      catch(error){
        console.warn("Full player error:",error);
      }

      notifyFrameState();

    }

    if(
      data.type ===
      "NOVARADIO_NAV"
    ){

      if(
        data.page ===
        "home"
      ){

        setView(
          "home.html"
        );

      }

      if(
        data.page ===
        "mypage"
      ){

        setView(
          "mypage.html"
        );

      }

    }

  }
);


/* =========================
   起動
========================= */

(async ()=>{

  await initSession();

  updateModeButtons();

  updateProgressUI();

})();
</script>
