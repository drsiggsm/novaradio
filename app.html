<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio App</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#050611;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{overflow:hidden}

button,input{font:inherit}

.app-shell{
  height:100vh;
  display:grid;
  grid-template-rows:64px 1fr 108px;
  background:radial-gradient(circle at 50% 0,#211b50,#07091a 55%,#050611);
}

.app-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #24294d;
  background:#090c1bee;
  backdrop-filter:blur(16px);
  z-index:10;
}

.brand{
  font-size:22px;
  font-weight:900;
}

.nav-buttons{
  display:flex;
  gap:8px;
}

.nav-btn{
  border:1px solid #343b67;
  background:#11152a;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.nav-btn.active{
  background:linear-gradient(90deg,#7b25ff,#159df5);
  border-color:transparent;
}

.view{
  position:relative;
  overflow:hidden;
}

.view iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#050611;
}

/* =========================
   共通プレイヤー
========================= */

.player{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:14px;
  padding:14px 18px 10px;
  border-top:1px solid #343b67;
  background:#0b0e20f2;
  backdrop-filter:blur(18px);
  z-index:50;
}

.track{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.cover{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #343b67;
  background:#15182e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.meta{
  min-width:0;
}

.title{
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  font-size:12px;
  color:#9ba0bd;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time{
  margin-top:6px;
  color:#8f94b2;
  font-size:11px;
  font-variant-numeric:tabular-nums;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.ctrl{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid #343b67;
  background:#171a31;
  color:#fff;
  font-weight:900;
  cursor:pointer;
}

.ctrl:hover{
  border-color:#646ca5;
}

.ctrl.main{
  width:46px;
  height:46px;
  border:0;
  background:linear-gradient(135deg,#7b25ff,#159df5);
  font-size:18px;
}

.ctrl.mode{
  border-radius:12px;
  width:42px;
}

.ctrl.mode.active{
  border-color:#8b36ff;
  background:#24204a;
  box-shadow:0 0 0 1px #8b36ff inset;
}

.ctrl.more{
  border-radius:12px;
  width:42px;
  font-size:21px;
  line-height:1;
}

/* シークバー */
.progress{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:12px;
  background:#181c35;
  cursor:pointer;
  touch-action:none;
}

.progress-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#7b25ff,#159df5);
  pointer-events:none;
}

/* =========================
   その他メニュー
========================= */

.more-menu{
  position:fixed;
  right:18px;
  bottom:118px;
  width:min(300px,calc(100vw - 28px));
  padding:10px;
  border:1px solid #343b67;
  border-radius:16px;
  background:#101328f5;
  box-shadow:0 20px 60px #000b;
  backdrop-filter:blur(18px);
  z-index:1000;
  display:none;
}

.more-menu.show{
  display:grid;
  gap:8px;
}

.menu-btn{
  width:100%;
  border:1px solid #343b67;
  border-radius:12px;
  padding:13px 14px;
  background:#171a31;
  color:#fff;
  text-align:left;
  font-weight:800;
  cursor:pointer;
}

.menu-btn:hover{
  border-color:#7b25ff;
}

.menu-btn.liked{
  background:#442136;
  border-color:#8b415b;
}

/* =========================
   プレイリスト選択モーダル
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1500;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(520px,95vw);
  max-height:min(650px,80vh);
  overflow:auto;
  background:#101228;
  border:1px solid #343b67;
  border-radius:22px;
  padding:20px;
  box-shadow:0 24px 80px #000c;
}

.modal-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:8px;
}

.modal-sub{
  color:#9ba0bd;
  font-size:13px;
  margin-bottom:16px;
}

.playlist-list{
  display:grid;
  gap:9px;
}

.playlist-choice{
  width:100%;
  border:1px solid #343b67;
  border-radius:13px;
  padding:14px;
  background:#080b1d;
  color:#fff;
  text-align:left;
  cursor:pointer;
  font-weight:800;
}

.playlist-choice:hover{
  border-color:#7b25ff;
}

.modal-empty{
  padding:20px;
  text-align:center;
  color:#9ba0bd;
  border:1px solid #343b67;
  border-radius:13px;
  background:#080b1d;
}

.modal-close{
  width:100%;
  margin-top:12px;
  border:1px solid #343b67;
  border-radius:13px;
  padding:13px;
  background:#171a31;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

/* 再生エラー */
.player-status{
  position:fixed;
  left:50%;
  bottom:122px;
  transform:translateX(-50%);
  width:min(620px,92vw);
  border:1px solid #7f4951;
  border-radius:14px;
  padding:10px 14px;
  background:#381e28f5;
  color:#ffdce2;
  font-size:12px;
  z-index:1200;
  display:none;
}

.player-status.show{
  display:block;
}

@media(max-width:700px){

  .app-shell{
    grid-template-rows:58px 1fr 126px;
  }

  .brand{
    font-size:18px;
  }

  .nav-btn{
    padding:8px 10px;
  }

  .player{
    grid-template-columns:minmax(0,1fr);
    gap:8px;
    padding:16px 10px 8px;
  }

  .cover{
    width:46px;
    height:46px;
    flex-basis:46px;
  }

  .controls{
    justify-content:flex-end;
  }

  .ctrl{
    width:34px;
    height:34px;
  }

  .ctrl.main{
    width:40px;
    height:40px;
  }

  .ctrl.mode,
  .ctrl.more{
    width:36px;
  }

  .more-menu{
    right:10px;
    bottom:136px;
  }

  .player-status{
    bottom:140px;
  }
}
</style>
</head>

<body>

<div class="app-shell">

  <header class="app-nav">

    <div class="brand">
      NovaRadio
    </div>

    <div class="nav-buttons">

      <button
        class="nav-btn active"
        id="navHome"
        type="button"
      >
        Home
      </button>

      <button
        class="nav-btn"
        id="navMyPage"
        type="button"
      >
        My Page
      </button>

    </div>

  </header>


  <main class="view">

    <iframe
      id="appFrame"

    ></iframe>

  </main>


  <footer class="player">

    <div
      class="progress"
      id="progress"
      aria-label="再生位置"

      <div

        id="progressFill"
      ></div>
    </div>


    <div class="track">

      <div
        class="cover"
        id="cover"
      >
        🎵
      </div>

      <div class="meta">

        <div

          曲を選択
        </div>

        <div
          class="artist"
          id="artist"

        </div>

      </div>

    </div>


    <div class="controls">

      </button>

      <button

      >
        ⏭
      </button>

      <button
        class="ctrl mode"
        id="shuffle"
        type="button"
        title="シャッフル"
      >
        🔀
      </button>

      <button
        class="ctrl mode"
        id="repeat"
        type="button"
        title="リピート"
      >
        🔁
      </button>

      <button
        class="ctrl more"
        id="more"
        type="button"
        title="その他"
      >
        ⋯
      </button>

    </div>

  </footer>

</div>


<div
  class="more-menu"
  id="moreMenu"
>
  <button
    class="menu-btn"
    id="menuLike"
    type="button"
  >
    🤍 いいね
  </button>

  <button
    class="menu-btn"
    id="menuPlaylist"
    type="button"
  >
    ＋ プレイリストに追加
  </button>
</div>


<div
  class="modal"
  id="playlistModal"
>
  <div class="modal-box">

    <div class="modal-title">
      ＋ プレイリストに追加
    </div>

    <div
      class="modal-sub"
      id="playlistModalSong"
    >
      曲を選択してください
    </div>

    <div
      class="playlist-list"
      id="playlistChoices"
    ></div>

    <button
      class="modal-close"
      id="playlistModalClose"
      type="button"
    >
      閉じる
    </button>

  </div>
</div>


<div
  class="player-status"
  id="playerStatus"
></div>


<audio
  id="audio"
  preload="auto"
></audio>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
  "https://melsoikvhwzvzswlimsi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_IOPT_ffm1Hp2bS3n3slD8w_3lmBaUdm";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentSession =
  null;


/* =========================
   DOM
========================= */

const frame =
  document.getElementById("appFrame");

const navHome =
  document.getElementById("navHome");

const navMyPage =
  document.getElementById("navMyPage");

const audio =
  document.getElementById("audio");

const playPause =
  document.getElementById("playPause");

const prev =
  document.getElementById("prev");

const next =
  document.getElementById("next");

const shuffle =
  document.getElementById("shuffle");

const repeat =
  document.getElementById("repeat");

const more =
  document.getElementById("more");

const cover =
  document.getElementById("cover");

const title =
  document.getElementById("title");

const artist =
  document.getElementById("artist");

const timeText =
  document.getElementById("timeText");

const progress =
  document.getElementById("progress");

const progressFill =
  document.getElementById("progressFill");

const moreMenu =
  document.getElementById("moreMenu");

const menuLike =
  document.getElementById("menuLike");

const menuPlaylist =
  document.getElementById("menuPlaylist");

const playlistModal =
  document.getElementById("playlistModal");

const playlistModalSong =
  document.getElementById("playlistModalSong");

const playlistChoices =
  document.getElementById("playlistChoices");

const playlistModalClose =
  document.getElementById("playlistModalClose");

const playerStatus =
  document.getElementById("playerStatus");


/* =========================
   State
========================= */

let state = {

  song:null,

  queue:[],

  index:-1,

  shuffle:false,

  repeat:"off",

  highlight:false,

  /*
    ハイライトモード中に
    「この曲だけフルで聴く」を選んだ状態。
    曲が終わったら自動でfalseに戻り、
    次曲から30秒ハイライトへ復帰する。
  */
  fullTrack:false

};

let playRequestId =
  0;


/*
  下プレイヤーのいいね状態キャッシュ。
*/
const playerLikeCache =
  new Map();

const playerLikeRequestCache =
  new Map();

/*
  次曲の音源を裏で軽く先読みする。
  実再生用audioとは別なので現在曲は止めない。
*/
const nextTrackPreloader =
  new Audio();

nextTrackPreloader.preload =
  "auto";

let preloadedAudioUrl =
  "";


/*
  Safariなどで ended が遅れたり取りこぼされた時にも
  「この曲だけフル」から確実にハイライトへ戻すためのガード。
*/
let isReturningFromFullTrack =
  false;

let isSeeking =
  false;

let seekRatio =
  0;

let highlightStartTime =
  0;

const HIGHLIGHT_SECONDS =
  30;


/* =========================
   Helpers
========================= */

function formatTime(seconds){

  if(
    !Number.isFinite(seconds) ||
    seconds < 0
  ){
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return (
    minutes +
    ":" +
    String(secs).padStart(2,"0")
  );
}


function showPlayerStatus(message){

  playerStatus.textContent =
    message;

  playerStatus.classList.add(
    "show"
  );

  clearTimeout(
    showPlayerStatus.timer
  );

  showPlayerStatus.timer =
    setTimeout(
      ()=>{
        playerStatus.classList.remove(
          "show"
        );
      },
      3500
    );
}


function escapeAttribute(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll('"',"&quot;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;");

}


function closeMoreMenu(){

  moreMenu.classList.remove(
    "show"
  );

}


/* =========================
   セッション
========================= */

async function initSession(){

  try{

    const {
      data:{session},
      error
    } =
    await sb.auth.getSession();

    if(error){
      throw error;
    }

    currentSession =
      session || null;

  }
  catch(error){

    console.warn(
      "Session load error:",
      error
    );

  }

}


/* =========================
   ページ切り替え
========================= */

function setView(page){

  frame.src =
    page;

  navHome.classList.toggle(
    "active",
    page === "home.html"
  );

  navMyPage.classList.toggle(
    "active",
    page === "mypage.html"
  );

}


navHome.onclick =
  ()=>setView(
    "home.html"
  );


navMyPage.onclick =
  ()=>setView(
    "mypage.html"
  );


frame.addEventListener(
  "load",
  ()=>{

    setTimeout(
      notifyFrameState,
      50
    );

  }
);


/* =========================
   曲情報表示
========================= */

function renderSong(song){

  const previousId =
    Number(
      state.song?.id
    );

  state.song =
    song;

  if(!song){
    return;
  }

  title.textContent =
    song.title ||
    "Untitled";

  artist.textContent =
    song.artist ||
    "Unknown Artist";

  const c =
    song.cover_url ||
    "";

  const existingImg =
    cover.querySelector(
      "img"
    );

  const existingSrc =
    existingImg
      ? existingImg.getAttribute(
          "src"
        ) || ""
      : "";

  /*
    同じジャケットならimg DOMを作り直さない。
  */
  if(
    c &&
    existingSrc !== c
  ){

    cover.innerHTML =
      `<img src="${escapeAttribute(c)}" alt="">`;

  }
  else if(
    !c &&
    cover.textContent !== "🎵"
  ){

    cover.innerHTML =
      "🎵";

  }

  if(
    previousId !==
    Number(song.id)
  ){

    timeText.textContent =
      "0:00 / 0:00";

  }

  updateLikeMenu()
  .catch(()=>{});

}


/* =========================
   再生安定化
========================= */

function waitForPlayable(
  requestId,
  timeoutMs=3000
){

  return new Promise(
    resolve=>{

      if(
        requestId !==
        playRequestId
      ){
        resolve(false);
        return;
      }

      if(
        audio.readyState >= 2
      ){
        resolve(true);
        return;
      }

      let finished =
        false;

      const finish =
        ok=>{

          if(finished){
            return;
          }

          finished =
            true;

          clearTimeout(timer);

          audio.removeEventListener(
            "canplay",
            onCanPlay
          );

          audio.removeEventListener(
            "error",
            onError
          );

          resolve(ok);
        };

      const onCanPlay =
        ()=>finish(true);

      const onError =
        ()=>finish(false);

      const timer =
        setTimeout(
          ()=>finish(
            audio.readyState >= 2
          ),
          timeoutMs
        );

      audio.addEventListener(
        "canplay",
        onCanPlay,
        {once:true}
      );

      audio.addEventListener(
        "error",
        onError,
        {once:true}
      );

    }
  );

}


async function startPlayback(
  requestId
){

  if(
    requestId !==
    playRequestId
  ){
    return;
  }

  /*
    まず即play。
    これが一番ユーザー操作扱いを維持しやすい。
  */
  try{

    await audio.play();

    return;

  }
  catch(firstError){

    console.warn(
      "First play attempt:",
      firstError
    );

  }

  /*
    読み込み待ち後にもう一度。
  */
  const playable =
    await waitForPlayable(
      requestId
    );

  if(
    !playable ||
    requestId !==
    playRequestId
  ){

    showPlayerStatus(
      "音源の読み込みに時間がかかっています。▶をもう一度押してみてください。"
    );

    return;

  }

  try{

    await audio.play();

  }
  catch(secondError){

    console.warn(
      "Second play attempt:",
      secondError
    );

    showPlayerStatus(
      "再生できませんでした。▶を押すと再試行できます。"
    );

  }

}


async function playSong(
  song,
  queue=null,
  index=null,
  restart=false
){

  if(
    !song ||
    !song.audio_url
  ){

    showPlayerStatus(
      "この曲には再生できる音源がありません。"
    );

    return;
  }

  if(
    Array.isArray(queue)
  ){

    state.queue =
      queue;

  }

  if(
    Number.isInteger(index)
  ){

    state.index =
      index;

  }

  const previousSongId =
    Number(
      state.song?.id
    );

  const previousSrc =
    audio.getAttribute(
      "src"
    ) || "";

  renderSong(
    song
  );

  const requestId =
    ++playRequestId;

  const sourceChanged =
    previousSrc !==
    String(song.audio_url);

  if(sourceChanged){

    audio.src =
      song.audio_url;

    /*
      ここは軽量化より正確さを優先。
      新しいsrcに切り替えたら必ずloadして、
      この曲自身のmetadataを確実に読み込む。
      先読み済みならブラウザキャッシュが効くので
      ネットワーク負荷は抑えられる。
    */
    audio.load();

  }

  /*
    通常再生は0秒から。
    ハイライト再生はアーティストが指定した
    highlight_startから開始する。
  */
  const requestedStart =
    (
      state.highlight &&
      !state.fullTrack
    )
      ? Math.max(
          0,
          Number(
            song.highlight_start
          ) || 0
        )
      : 0;

  if(
    restart ||
    sourceChanged ||
    previousSongId !==
    Number(song.id)
  ){

    /*
      ハイライト開始位置を正確に反映する。

      sourceChanged直後は、readyStateが一瞬だけ
      前の曲の状態を持つブラウザがあるため、
      requestedStart > 0 の時は「新しい曲のmetadata」を
      必ず待ってからcurrentTimeを設定する。
    */
    if(
      requestedStart > 0
    ){

      if(
        sourceChanged ||
        audio.readyState < 1
      ){

        await new Promise(
          resolve=>{

            let finished =
              false;

            const finish =
              ()=>{

                if(finished){
                  return;
                }

                finished =
                  true;

                clearTimeout(
                  timer
                );

                audio.removeEventListener(
                  "loadedmetadata",
                  onMetadata
                );

                resolve();

              };

            const onMetadata =
              ()=>finish();

            const timer =
              setTimeout(
                finish,
                4000
              );

            audio.addEventListener(
              "loadedmetadata",
              onMetadata,
              {
                once:true
              }
            );

          }
        );

      }

      try{

        const maxStart =
          Number.isFinite(
            audio.duration
          )
            ? Math.max(
                0,
                audio.duration - 0.1
              )
            : requestedStart;

        audio.currentTime =
          Math.min(
            requestedStart,
            maxStart
          );

      }
      catch(error){

        console.warn(
          "Highlight seek error:",
          error
        );

      }

    }
    else{

      try{

        audio.currentTime =
          0;

      }
      catch(error){

        console.warn(
          "Seek reset error:",
          error
        );

      }

    }

  }

  /*
    src切替直後にブラウザ側がcurrentTimeを0へ戻すケースへの保険。
  */
  if(
    requestedStart > 0 &&
    Math.abs(
      audio.currentTime -
      requestedStart
    ) > 0.75
  ){

    try{

      audio.currentTime =
        requestedStart;

    }
    catch(error){

      console.warn(
        "Final highlight seek retry:",
        error
      );

    }

  }

  highlightStartTime =
    requestedStart;

  await startPlayback(
    requestId
  );

  notifyFrameState();

  preloadLikelyNextTrack();

}

/* =========================
   次曲の軽量プリロード
========================= */

function preloadLikelyNextTrack(){

  if(
    !state.queue.length ||
    state.shuffle
  ){
    return;
  }

  let currentIndex =
    state.index;

  if(
    currentIndex < 0
  ){

    currentIndex =
      state.queue.findIndex(
        song=>
          Number(song.id) ===
          Number(state.song?.id)
      );

  }

  if(
    currentIndex < 0
  ){
    return;
  }

  const nextIndex =
    (
      currentIndex + 1
    ) %
    state.queue.length;

  const nextSong =
    state.queue[
      nextIndex
    ];

  const url =
    String(
      nextSong?.audio_url ||
      ""
    );

  if(
    !url ||
    url === preloadedAudioUrl ||
    url === audio.getAttribute("src")
  ){
    return;
  }

  preloadedAudioUrl =
    url;

  /*
    少し遅らせて現在曲の再生開始を優先。
  */
  setTimeout(
    ()=>{

      try{

        nextTrackPreloader.src =
          url;

        nextTrackPreloader.load();

      }
      catch(error){

        console.warn(
          "Next track preload failed:",
          error
        );

      }

    },
    250
  );

}


/* =========================
   次の曲
========================= */

function playNext(
  fromEnded=false
){

  if(
    !state.queue.length
  ){
    return;
  }

  if(
    fromEnded &&
    state.repeat === "one"
  ){

    audio.currentTime =
      0;

    audio
    .play()
    .catch(
      ()=>startPlayback(
        ++playRequestId
      )
    );

    return;
  }

  if(
    state.index < 0
  ){

    state.index =
      state.queue.findIndex(
        s=>
          Number(s.id) ===
          Number(state.song?.id)
      );

  }

  if(
    state.shuffle &&
    state.queue.length > 1
  ){

    let nextIndex =
      state.index;

    while(
      nextIndex ===
      state.index
    ){

      nextIndex =
        Math.floor(
          Math.random() *
          state.queue.length
        );

    }

    state.index =
      nextIndex;

  }

  else{

    const candidate =
      state.index + 1;

    if(
      candidate >=
      state.queue.length
    ){

      if(
        fromEnded &&
        state.repeat === "off"
      ){
        return;
      }

      state.index =
        0;

    }

    else{

      state.index =
        candidate;

    }

  }

  playSong(
    state.queue[
      state.index
    ],
    state.queue,
    state.index,
    true
  );

}


/* =========================
   前の曲
========================= */

function playPrev(){

  if(
    !state.queue.length
  ){
    return;
  }

  if(
    audio.currentTime > 3
  ){

    audio.currentTime =
      0;

    return;
  }

  if(
    state.index < 0
  ){

    state.index =
      state.queue.findIndex(
        s=>
          Number(s.id) ===
          Number(state.song?.id)
      );

  }

  if(
    state.shuffle &&
    state.queue.length > 1
  ){

    let prevIndex =
      state.index;

    while(
      prevIndex ===
      state.index
    ){

      prevIndex =
        Math.floor(
          Math.random() *
          state.queue.length
        );

    }

    state.index =
      prevIndex;

  }

  else{

    state.index--;

    if(
      state.index < 0
    ){

      state.index =
        state.queue.length - 1;

    }

  }

  playSong(
    state.queue[
      state.index
    ],
    state.queue,
    state.index,
    true
  );

}

/* =========================
   軽量シーク
========================= */

function getSeekRatio(
  event
){

  const rect =
    progress.getBoundingClientRect();

  if(
    rect.width <= 0
  ){
    return 0;
  }

  return Math.max(
    0,
    Math.min(
      1,
      (
        event.clientX -
        rect.left
      ) /
      rect.width
    )
  );

}


function previewSeek(
  event
){

  if(
    !Number.isFinite(
      audio.duration
    ) ||
    audio.duration <= 0
  ){
    return;
  }

  seekRatio =
    getSeekRatio(
      event
    );

  progressFill.style.width =
    (
      seekRatio *
      100
    ) +
    "%";

  timeText.textContent =
    formatTime(
      seekRatio *
      audio.duration
    ) +
    " / " +
    formatTime(
      audio.duration
    );

}


progress.addEventListener(
  "pointerdown",
  event=>{

    if(
      !Number.isFinite(
        audio.duration
      ) ||
      audio.duration <= 0
    ){
      return;
    }

    isSeeking =
      true;

    previewSeek(
      event
    );

    try{

      progress.setPointerCapture(
        event.pointerId
      );

    }
    catch(e){}

  }
);


progress.addEventListener(
  "pointermove",
  event=>{

    if(
      !isSeeking
    ){
      return;
    }

    previewSeek(
      event
    );

  }
);


progress.addEventListener(
  "pointerup",
  event=>{

    if(
      !isSeeking
    ){
      return;
    }

    previewSeek(
      event
    );

    isSeeking =
      false;

    if(
      Number.isFinite(
        audio.duration
      ) &&
      audio.duration > 0
    ){

      audio.currentTime =
        seekRatio *
        audio.duration;

    }

    try{

      progress.releasePointerCapture(
        event.pointerId
      );

    }
    catch(e){}

  }
);


progress.addEventListener(
  "pointercancel",
  ()=>{

    isSeeking =
      false;

    updateProgressUI();

  }
);


/* =========================
   この曲だけフル → ハイライト復帰
========================= */

function returnToHighlightAfterFullTrack(){

  if(
    !state.highlight ||
    !state.fullTrack ||
    isReturningFromFullTrack
  ){
    return false;
  }

  isReturningFromFullTrack =
    true;

  /*
    先にfullTrackを解除してから次曲を再生する。
    これで次のplaySongは必ずhighlight_startから始まる。
  */
  state.fullTrack =
    false;

  highlightStartTime =
    0;

  notifyFrameState();

  /*
    今の曲ではなく次の曲へ。
    falseにすることでrepeat one等の影響も受けない。
  */
  playNext(
    false
  );

  /*
    playNext/playSongの開始を待たず、
    少し後にガードだけ解除。
  */
  setTimeout(
    ()=>{
      isReturningFromFullTrack =
        false;
    },
    600
  );

  return true;
}


/* =========================
   Audioイベント
========================= */

function updateProgressUI(){

  if(
    isSeeking
  ){
    return;
  }

  const duration =
    Number.isFinite(
      audio.duration
    )
      ? audio.duration
      : 0;

  const current =
    Number.isFinite(
      audio.currentTime
    )
      ? audio.currentTime
      : 0;

  if(
    duration > 0
  ){

    progressFill.style.width =
      (
        current /
        duration *
        100
      ) +
      "%";

  }
  else{

    progressFill.style.width =
      "0%";

  }

  timeText.textContent =
    formatTime(current) +
    " / " +
    formatTime(duration);

}


audio.addEventListener(
  "play",
  ()=>{

    playPause.textContent =
      "⏸";

    if(
      state.highlight &&
      !state.fullTrack
    ){
      highlightStartTime =
        Number.isFinite(
          audio.currentTime
        )
          ? audio.currentTime
          : 0;
    }

  }
);


audio.addEventListener(
  "pause",
  ()=>{

    playPause.textContent =
      "▶";

  }
);


audio.addEventListener(
  "loadedmetadata",
  updateProgressUI
);


audio.addEventListener(
  "durationchange",
  updateProgressUI
);


audio.addEventListener(
  "timeupdate",
  ()=>{

    updateProgressUI();

    /*
      「この曲だけフル」で曲末まで来たら、
      endedイベントを待たずにハイライトへ復帰する保険。
      Safari等でendedが不安定なケース対策。
    */
    if(
      state.highlight &&
      state.fullTrack &&
      !isReturningFromFullTrack &&
      Number.isFinite(
        audio.duration
      ) &&
      audio.duration > 0 &&
      Number.isFinite(
        audio.currentTime
      ) &&
      (
        audio.duration -
        audio.currentTime
      ) <= 0.35
    ){

      returnToHighlightAfterFullTrack();

      return;
    }

    if(
      state.highlight &&
      !state.fullTrack &&
      !audio.paused &&
      Number.isFinite(
        audio.currentTime
      ) &&
      (
        audio.currentTime -
        highlightStartTime
      ) >=
      HIGHLIGHT_SECONDS
    ){

      /*
        30秒到達で次の曲へ。
        ended扱いにはしないので、
        repeat oneでも同じ曲に留まらない。
      */
      highlightStartTime =
        audio.currentTime +
        999999;

      playNext(
        false
      );

    }

  }
);


audio.addEventListener(
  "ended",
  ()=>{

    /*
      「この曲だけフル」だった場合は、
      ハイライトモードを維持したまま次曲へ。
    */
    if(
      returnToHighlightAfterFullTrack()
    ){
      return;
    }

    playNext(
      true
    );

  }
);


audio.addEventListener(
  "stalled",

    console.warn(
      "Audio stalled"
    );

  }
);


audio.addEventListener(

  ()=>{

    /*

    */

  }
);


audio.addEventListener(

/* =========================
   いいね
========================= */

async function isSongLiked(
  songId,
  force=false
){

  if(
    !currentSession ||
    !songId
  ){
    return false;
  }

  const cacheKey =
    String(songId);

  if(
    !force &&
    playerLikeCache.has(
      cacheKey
    )
  ){
    return playerLikeCache.get(
      cacheKey
    );
  }

  if(
    !force &&
    playerLikeRequestCache.has(
      cacheKey
    )
  ){
    return playerLikeRequestCache.get(
      cacheKey
    );
  }

  const request =
    (async ()=>{

      const {
        data,
        error
      } =
      await sb
      .from("likes")
      .select("id")
      .eq(
        "user_id",
        currentSession.user.id
      )
      .eq(
        "song_id",
        songId
      )
      .limit(1);

      if(error){

        console.warn(
          "Like check error:",
          error
        );

        return false;
      }

      const liked =
        !!(
          data &&
          data.length
        );

      playerLikeCache.set(
        cacheKey,
        liked
      );

      return liked;

    })();

  playerLikeRequestCache.set(
    cacheKey,
    request
  );

  try{

    return await request;

  }
  finally{

    playerLikeRequestCache.delete(
      cacheKey
    );

  }

}

async function updateLikeMenu(){

  menuLike.classList.remove(
    "liked"
  );

  if(
    !state.song
  ){

    menuLike.textContent =
      "🤍 いいね";

    return;
  }

  if(
    !currentSession
  ){

    menuLike.textContent =
      "🤍 いいね";

    return;
  }

  const songId =
    state.song.id;

  const liked =
    await isSongLiked(
      songId
    );

  /*
    曲が変わっている途中に
    古い問い合わせが返ってきた場合は無視。
  */
  if(
    Number(state.song?.id) !==
    Number(songId)
  ){
    return;
  }

  if(liked){

    menuLike.textContent =
      "❤️ いいね解除";

    menuLike.classList.add(
      "liked"
    );

  }
  else{

    menuLike.textContent =
      "🤍 いいね";

  }

}


async function toggleCurrentLike(){

  if(
    !state.song
  ){

    showPlayerStatus(
      "まず曲を再生してください。"
    );

    return;
  }

  if(
    !currentSession
  ){

    showPlayerStatus(
      "いいねするにはログインしてください。"
    );

    return;
  }

  menuLike.disabled =
    true;

  try{

    const liked =
      await isSongLiked(
        state.song.id
      );

    if(liked){

      const {
        error
      } =
      await sb
      .from("likes")
      .delete()
      .eq(
        "user_id",
        currentSession.user.id
      )
      .eq(
        "song_id",
        state.song.id
      );

      if(error){
        throw error;
      }

      showPlayerStatus(
        "いいねを解除しました。"
      );

    }
    else{

      const {
        error
      } =
      await sb
      .from("likes")
      .insert({

        user_id:
          currentSession.user.id,

        song_id:
          state.song.id

      });

      if(error){
        throw error;
      }

      showPlayerStatus(
        "❤️ いいねしました！"
      );

    }

    playerLikeCache.set(
      String(state.song.id),
      !liked
    );

    await updateLikeMenu();

  }
  catch(error){

    console.error(error);

    showPlayerStatus(
      "いいねの更新に失敗しました：" +
      (
        error.message ||
        error
      )
    );

  }
  finally{

    menuLike.disabled =
      false;

  }

}

    !currentSession

    state.song;

      false;

/* =========================

========================= */

window.addEventListener(
  "message",
  event=>{

    const data =
      event.data ||
      {};

    if(
      data.type ===
      "NOVARADIO_PLAY"
    ){

      const queue =
        Array.isArray(
          data.queue
        )
          ? data.queue
          : [];

      const index =
        Number.isInteger(
          data.index
        )
          ? data.index
          : queue.findIndex(
              s=>
                Number(s.id) ===
                Number(
                  data.song?.id
                )
            );

      if(
        typeof data.highlight ===
        "boolean"
      ){

        state.highlight =
          data.highlight;

        /*
          新しい通常再生 / ハイライト再生を明示的に始めた時は
          「この曲だけフル」状態を解除。
        */
        state.fullTrack =
          false;

      }

      if(
        typeof data.shuffle ===
        "boolean"
      ){

        state.shuffle =
          data.shuffle;

      }

      if(
        [
          "off",
          "all",
          "one"
        ].includes(
          data.repeat
        )
      ){

        state.repeat =
          data.repeat;

      }

      updateModeButtons();

      playSong(
        data.song,
        queue,
        index,
        true
      );

    }


    if(
      data.type ===
      "NOVARADIO_NEXT"
    ){

      playNext(
        false
      );

    }


    if(
      data.type ===
      "NOVARADIO_PREV"
    ){

      playPrev();

    }


    if(
      data.type ===
      "NOVARADIO_TOGGLE"
    ){

      playPause.click();

    }


    if(
      data.type ===
      "NOVARADIO_SET_SHUFFLE"
    ){

      setShuffle(
        data.value
      );

    }


    if(
      data.type ===
      "NOVARADIO_SET_REPEAT"
    ){

      setRepeat(
        data.value
      );

    }


    if(
      data.type ===
      "NOVARADIO_CYCLE_REPEAT"
    ){

      cycleRepeat();

    }


    if(
      data.type ===
      "NOVARADIO_GET_PLAYER_STATE"
    ){

      notifyFrameState();

    }


    if(
      data.type ===
      "NOVARADIO_SET_HIGHLIGHT"
    ){

      state.highlight =
        !!data.value;

      highlightStartTime =
        Number.isFinite(
          audio.currentTime
        )
          ? audio.currentTime
          : 0;

      notifyFrameState();

    }


    if(
      data.type ===
      "NOVARADIO_FULL_CURRENT"
    ){

      if(
        !state.song
      ){
        return;
      }

      /*
        ハイライトモード自体は維持したまま、
        現在曲だけ0:00から最後まで再生する。
      */
      state.highlight =
        true;

      state.fullTrack =
        true;

      isReturningFromFullTrack =
        false;

      highlightStartTime =
        0;

      playSong(
        state.song,
        state.queue,
        state.index,
        true
      );

      notifyFrameState();

    }


    if(
      data.type ===
      "NOVARADIO_NAV"
    ){

      if(
        data.page ===
        "home"
      ){

        setView(
          "home.html"
        );

      }

      if(
        data.page ===
        "mypage"
      ){

        setView(
          "mypage.html"
        );

      }

    }

  }
);


/* =========================
   起動
========================= */

(async ()=>{

  await initSession();

  updateModeButtons();

  updateProgressUI();

})();
</script>

</body>
</html>
