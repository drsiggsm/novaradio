<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaRadio App</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050611;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{overflow:hidden}
.app-shell{height:100vh;display:grid;grid-template-rows:64px 1fr 96px;background:radial-gradient(circle at 50% 0,#211b50,#07091a 55%,#050611)}
.app-nav{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #24294d;background:#090c1bee;backdrop-filter:blur(16px);z-index:10}
.brand{font-size:22px;font-weight:900}
.nav-buttons{display:flex;gap:8px}
.nav-btn{border:1px solid #343b67;background:#11152a;color:#fff;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer}
.nav-btn.active{background:linear-gradient(90deg,#7b25ff,#159df5);border-color:transparent}
.view{position:relative;overflow:hidden}
.view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050611}
.player{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 18px;border-top:1px solid #343b67;background:#0b0e20f2;backdrop-filter:blur(18px)}
.track{display:flex;align-items:center;gap:12px;min-width:0}
.cover{width:58px;height:58px;flex:0 0 58px;border-radius:12px;overflow:hidden;border:1px solid #343b67;background:#15182e;display:flex;align-items:center;justify-content:center;font-size:24px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.meta{min-width:0}
.title{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:12px;color:#9ba0bd;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;gap:8px}
.ctrl{width:40px;height:40px;border-radius:50%;border:1px solid #343b67;background:#171a31;color:#fff;font-weight:900;cursor:pointer}
.ctrl.main{width:46px;height:46px;border:0;background:linear-gradient(135deg,#7b25ff,#159df5);font-size:18px}
.progress{position:absolute;left:0;right:0;bottom:90px;height:4px;background:#181c35}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#7b25ff,#159df5)}
@media(max-width:600px){
  .app-shell{grid-template-rows:58px 1fr 88px}
  .brand{font-size:18px}
  .nav-btn{padding:8px 10px}
  .cover{width:48px;height:48px;flex-basis:48px}
  .player{padding:8px 10px}
  .ctrl{width:34px;height:34px}
  .ctrl.main{width:40px;height:40px}
  .progress{bottom:84px}
}
</style>
</head>
<body>
<div class="app-shell">
  <header class="app-nav">
    <div class="brand">NovaRadio</div>
    <div class="nav-buttons">
      <button class="nav-btn active" id="navHome">Home</button>
      <button class="nav-btn" id="navMyPage">My Page</button>
    </div>
  </header>

  <main class="view">
    <iframe id="appFrame" src="home.html"></iframe>
  </main>

  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

  <footer class="player">
    <div class="track">
      <div class="cover" id="cover">🎵</div>
      <div class="meta">
        <div class="title" id="title">曲を選択</div>
        <div class="artist" id="artist">NovaRadio</div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl" id="prev">⏮</button>
      <button class="ctrl main" id="playPause">▶</button>
      <button class="ctrl" id="next">⏭</button>
    </div>
  </footer>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const frame = document.getElementById("appFrame");
const navHome = document.getElementById("navHome");
const navMyPage = document.getElementById("navMyPage");
const audio = document.getElementById("audio");
const playPause = document.getElementById("playPause");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const cover = document.getElementById("cover");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const progressFill = document.getElementById("progressFill");

let state = {
  song:null,
  queue:[],
  index:-1
};

function setView(page){
  frame.src = page;
  navHome.classList.toggle("active", page === "home.html");
  navMyPage.classList.toggle("active", page === "mypage.html");
}

navHome.onclick = ()=>setView("home.html");
navMyPage.onclick = ()=>setView("mypage.html");

function renderSong(song){
  state.song = song;
  if(!song) return;

  title.textContent = song.title || "Untitled";
  artist.textContent = song.artist || "Unknown Artist";

  const c = song.cover_url || "";
  cover.innerHTML = c
    ? `<img src="${String(c).replaceAll('"','&quot;')}" alt="">`
    : "🎵";

  if(audio.getAttribute("src") !== song.audio_url){
    audio.src = song.audio_url;
    audio.load();
  }
}

function playSong(
  song,
  queue=null,
  index=null,
  restart=false
){
  if(queue){
    state.queue = queue;
  }

  if(Number.isInteger(index)){
    state.index = index;
  }

  const previousSongId =
    Number(state.song?.id);

  renderSong(song);

  /*
    同じ曲がすでに再生中でも、
    プレイリストの「再生」を押したら
    先頭から再スタートできるようにする
  */
  if(
    restart ||
    previousSongId !== Number(song?.id)
  ){
    try{
      audio.currentTime = 0;
    }
    catch(error){
      console.warn(
        "再生位置のリセットに失敗:",
        error
      );
    }
  }

  audio
  .play()
  .catch(()=>{});
}

function playNext(){
  if(!state.queue.length) return;
  if(state.index < 0){
    state.index = state.queue.findIndex(s=>Number(s.id)===Number(state.song?.id));
  }
  state.index = (state.index + 1) % state.queue.length;
  playSong(state.queue[state.index], state.queue, state.index);
}

function playPrev(){
  if(!state.queue.length) return;
  if(state.index < 0){
    state.index = state.queue.findIndex(s=>Number(s.id)===Number(state.song?.id));
  }
  state.index = (state.index - 1 + state.queue.length) % state.queue.length;
  playSong(state.queue[state.index], state.queue, state.index);
}

playPause.onclick = ()=>{
  if(!state.song) return;
  if(audio.paused) audio.play().catch(()=>{});
  else audio.pause();
};
prev.onclick = playPrev;
next.onclick = playNext;

audio.addEventListener("play", ()=>playPause.textContent="⏸");
audio.addEventListener("pause", ()=>playPause.textContent="▶");
audio.addEventListener("ended", playNext);
audio.addEventListener("timeupdate", ()=>{
  if(Number.isFinite(audio.duration) && audio.duration > 0){
    progressFill.style.width = ((audio.currentTime/audio.duration)*100) + "%";
  }
});

window.addEventListener("message", (event)=>{
  const data = event.data || {};

  if(data.type === "NOVARADIO_PLAY"){
    const queue =
      Array.isArray(data.queue)
        ? data.queue
        : [];

    const index =
      Number.isInteger(data.index)
        ? data.index
        : queue.findIndex(
            s=>
              Number(s.id) ===
              Number(data.song?.id)
          );

    playSong(
      data.song,
      queue,
      index,
      true
    );
  }

  if(data.type === "NOVARADIO_NEXT") playNext();
  if(data.type === "NOVARADIO_PREV") playPrev();

  if(data.type === "NOVARADIO_NAV"){
    if(data.page === "home") setView("home.html");
    if(data.page === "mypage") setView("mypage.html");
  }
});
</script>
</body>
</html>
